<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- README hero: a quiet paper stage with a two-tone headline and the demo-data panel screenshots
     (assets/screens/*) cropped to their exact edges. Rendered by scripts/preview/shoot.js --readme
     (or scripts/readme-hero.lua on a Mac). -->
<link rel="stylesheet" href="../theme.css">
<style>
  html, body { margin: 0; width: 1600px; height: 980px; overflow: hidden; background: transparent; }
  .stage { position: relative; width: 1600px; height: 980px; overflow: hidden; border-radius: 28px; font-family: var(--font-ui); }
  .light .stage { color: #0b0b0f; background:
      radial-gradient(700px 420px at 12% 112%, rgba(10,114,239,.16), transparent 70%),
      radial-gradient(720px 440px at 92% 108%, rgba(214,51,108,.13), transparent 70%),
      radial-gradient(900px 400px at 50% 0%, #ffffff, transparent 70%),
      #f4f5f8; }
  .dark .stage { color: #f4f4f5; background:
      radial-gradient(700px 420px at 12% 112%, rgba(76,157,255,.22), transparent 70%),
      radial-gradient(720px 440px at 92% 108%, rgba(244,114,182,.14), transparent 70%),
      radial-gradient(900px 400px at 50% 0%, #2a2b31, transparent 70%),
      #1b1c20; }
  .stage::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); background-size: 160px; opacity: .05; mix-blend-mode: overlay; pointer-events: none; }
  /* faint grid, like a drafting table */
  .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--gl) 1px, transparent 1px), linear-gradient(90deg, var(--gl) 1px, transparent 1px); background-size: 80px 80px; background-position: -1px -1px;
    -webkit-mask-image: radial-gradient(1000px 520px at 50% 30%, #000 20%, transparent 75%); mask-image: radial-gradient(1000px 520px at 50% 30%, #000 20%, transparent 75%); }
  .light .grid { --gl: rgba(12,12,16,.045); } .dark .grid { --gl: rgba(255,255,255,.04); }
  .copy { position: absolute; left: 0; right: 0; top: 70px; text-align: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px 0 8px; border-radius: 999px; font: 600 17px/1 var(--font-ui); letter-spacing: -.01em; }
  .light .eyebrow { background: #fff; box-shadow: 0 0 0 1px rgba(20,24,40,.08), 0 6px 18px -8px rgba(20,24,40,.25); }
  .dark .eyebrow { background: #26272c; box-shadow: 0 0 0 1px rgba(255,255,255,.1); }
  .eyebrow span { opacity: .55; font-weight: 500; }
  .eyebrow img { width: 32px; height: 32px; }
  h1 { margin: 28px 0 0; font: 750 78px/1.02 var(--font-display); letter-spacing: -.045em; }
  h1 span { background: linear-gradient(90deg,#3d7bff,#8b5cf6 60%,#ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .keys { display: inline-flex; gap: 10px; margin-top: 30px; }
  .keys kbd { height: 34px; min-width: 34px; padding: 0 12px; font-size: 15px; border-radius: 9px; color: inherit; }
  .light .keys kbd { background: #fff; box-shadow: 0 0 0 1px rgba(12,12,16,.12), 0 2px 0 rgba(12,12,16,.14); }
  .dark .keys kbd { background: #1a1a1e; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 2px 0 rgba(255,255,255,.1); }
  canvas { position: absolute; display: block; border-radius: 20px; }
  .light canvas { box-shadow: 0 50px 100px -24px rgba(20,20,40,.35), 0 12px 28px -8px rgba(20,20,40,.14), 0 0 0 1px rgba(12,12,16,.08); }
  .dark canvas  { box-shadow: 0 50px 110px -20px rgba(0,0,0,.8), 0 12px 28px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.09); }
  #mid   { left: 110px; top: 420px; width: 1000px; }
  #front { right: 110px; top: 360px; width: 400px; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="copy">
    <div class="eyebrow"><img src="logo.svg" alt="">Nimbstia <span>· a workbench for macOS</span></div>
    <h1>Every move, one key.<br><span>Calm panels for the rest.</span></h1>
    <div class="keys"><kbd>⌃ V</kbd><kbd>⌃ .</kbd><kbd>⌃ Space</kbd><kbd>⌃ ⇧ P</kbd></div>
  </div>
  <canvas id="mid"></canvas>
  <canvas id="front"></canvas>
</div>
<script>
  // ?theme=light|dark. Each layer: screenshot name, its window width in points and the transparent inset
  // around the panel inside that window (the panel's own shadow lives there and is cropped away).
  const theme = new URLSearchParams(location.search).get('theme') || 'light';
  document.documentElement.className = theme;
  const LAYERS = [
    { id: 'mid', name: 'clipboard', winW: 1060, inset: 16 },
    { id: 'front', name: 'popover', winW: 470, inset: 10 },
  ];
  const load = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  Promise.all(LAYERS.map(async L => {
    const img = await load(`screens/${L.name}-${theme}.png?${Date.now()}`);
    if (!img) return;
    const k = img.naturalWidth / L.winW, cut = Math.round(L.inset * k);
    const w = img.naturalWidth - 2 * cut, h = img.naturalHeight - 2 * cut;
    const c = document.getElementById(L.id);
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, cut, cut, w, h, 0, 0, w, h);
    c.style.height = (parseFloat(getComputedStyle(c).width) * h / w) + 'px'; // bottoms bleed off the stage
  })).then(() => document.fonts.ready).then(() => { document.title = 'ready'; });
</script>
</body>
</html>
