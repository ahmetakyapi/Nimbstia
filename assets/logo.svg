<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nimbstia mark: a bold N built from two rounded panes and a diagonal on a vivid squircle.
       Sky family (Ribbon round, 2026-11): one hue, light top-left to deep bottom-right, matches the UI accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".22" cy=".1" r=".95">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#082f49" flood-opacity=".34"/>
    </filter>
  </defs>
  <path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#bg)"/>
  <path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#sheen)"/>
  <path d="M256 3C460 3 509 52 509 256S460 509 256 509 3 460 3 256 52 3 256 3Z" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <g filter="url(#lift)">
    <line x1="182" y1="170" x2="330" y2="342" stroke="url(#bar)" stroke-width="70" stroke-linecap="round" opacity=".9"/>
    <rect x="141" y="132" width="70" height="248" rx="35" fill="url(#bar)"/>
    <rect x="301" y="132" width="70" height="248" rx="35" fill="url(#bar)"/>
  </g>
</svg>
