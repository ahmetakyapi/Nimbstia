<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nimbstia mark: a bold N built from three rounded panes on a vivid squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d82ff"/>
      <stop offset=".55" stop-color="#2f5cf5"/>
      <stop offset="1" stop-color="#7b3df0"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".22" cy=".12" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14185a" flood-opacity=".32"/>
    </filter>
  </defs>
  <path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#bg)"/>
  <path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#sheen)"/>
  <path d="M256 2C460.5 2 510 51.5 510 256S460.5 510 256 510 2 460.5 2 256 51.5 2 256 2Z" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g filter="url(#lift)">
    <line x1="176" y1="168" x2="336" y2="344" stroke="url(#bar)" stroke-width="66" stroke-linecap="round" opacity=".9"/>
    <rect x="143" y="135" width="66" height="242" rx="33" fill="url(#bar)"/>
    <rect x="303" y="135" width="66" height="242" rx="33" fill="url(#bar)"/>
  </g>
</svg>
