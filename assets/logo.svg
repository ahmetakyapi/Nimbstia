<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nimbstia app icon. Built on a 512 grid:
       body   continuous-corner square, radius 115 (22.5%, the macOS icon shape); build-app.sh adds the margin
       glyph  a square N, 256 x 256 (half the body), centred: two panes 64 wide (a quarter of the glyph)
              with a 128 gap, pane radius 21 (a third of the pane), and a link 54 thick (84% of a pane, so the diagonal
              does not look heavier than the uprights) that runs at 45 degrees between the centres of
              the pane ends, tucked under the panes
       depth  light from above: vertical sky gradient, a hairline rim, the link shaded where it goes
              under a pane. No filters: AppKit, browsers and rsvg draw it the same way.
       Colours: sky family only (#38bdf8, #0ea5e9, #0369a1), panes white to sky-50. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ec1fa"/>
      <stop offset=".5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0374b5"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#082f49" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f5fe"/>
    </linearGradient>
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="192" y1="0" x2="320" y2="0">
      <stop offset="0" stop-color="#a4d9f7"/>
      <stop offset=".26" stop-color="#e3f3fd"/>
      <stop offset=".74" stop-color="#e3f3fd"/>
      <stop offset="1" stop-color="#a4d9f7"/>
    </linearGradient>
  </defs>
  <path d="M328 0c64.41 0 96.61 0 121.21 12.53a115 115 0 0 1 50.26 50.26c12.53 24.6 12.53 56.8 12.53 121.21L512 328c0 64.41 0 96.61 -12.53 121.21a115 115 0 0 1 -50.26 50.26c-24.6 12.53 -56.8 12.53 -121.21 12.53L184 512c-64.41 0 -96.61 0 -121.21 -12.53a115 115 0 0 1 -50.26 -50.26c-12.53 -24.6 -12.53 -56.8 -12.53 -121.21L0 184c0 -64.41 0 -96.61 12.53 -121.21a115 115 0 0 1 50.26 -50.26c24.6 -12.53 56.8 -12.53 121.21 -12.53Z" fill="url(#bg)"/>
  <path d="M328 0c64.41 0 96.61 0 121.21 12.53a115 115 0 0 1 50.26 50.26c12.53 24.6 12.53 56.8 12.53 121.21L512 328c0 64.41 0 96.61 -12.53 121.21a115 115 0 0 1 -50.26 50.26c-24.6 12.53 -56.8 12.53 -121.21 12.53L184 512c-64.41 0 -96.61 0 -121.21 -12.53a115 115 0 0 1 -50.26 -50.26c-12.53 -24.6 -12.53 -56.8 -12.53 -121.21L0 184c0 -64.41 0 -96.61 12.53 -121.21a115 115 0 0 1 50.26 -50.26c24.6 -12.53 56.8 -12.53 121.21 -12.53Z" fill="url(#glow)"/>
  <path d="M329.8 3c62.73 0 94.09 0 118.05 12.21a112 112 0 0 1 48.95 48.95c12.21 23.96 12.21 55.32 12.21 118.05L509 329.8c0 62.73 0 94.09 -12.21 118.05a112 112 0 0 1 -48.95 48.95c-23.96 12.21 -55.32 12.21 -118.05 12.21L182.2 509c-62.73 0 -94.09 0 -118.05 -12.21a112 112 0 0 1 -48.95 -48.95c-12.21 -23.96 -12.21 -55.32 -12.21 -118.05L3 182.2c0 -62.73 0 -94.09 12.21 -118.05a112 112 0 0 1 48.95 -48.95c23.96 -12.21 55.32 -12.21 118.05 -12.21Z" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g fill="#075985" stroke="#075985" opacity=".16">
    <g transform="translate(0 7)"><line x1="160" y1="160" x2="352" y2="352" stroke-width="54" stroke-linecap="round" /><rect x="128" y="128" width="64" height="256" rx="21" /><rect x="320" y="128" width="64" height="256" rx="21" /></g>
    <g transform="translate(0 14)" opacity=".6"><line x1="160" y1="160" x2="352" y2="352" stroke-width="54" stroke-linecap="round" /><rect x="128" y="128" width="64" height="256" rx="21" /><rect x="320" y="128" width="64" height="256" rx="21" /></g>
  </g>
  <line x1="160" y1="160" x2="352" y2="352" stroke-width="54" stroke-linecap="round" stroke="url(#link)"/>
  <rect x="128" y="128" width="64" height="256" rx="21" fill="url(#pane)"/>
  <rect x="320" y="128" width="64" height="256" rx="21" fill="url(#pane)"/>
</svg>
