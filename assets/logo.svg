<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nimbstia mark: an ink squircle, two paper panes and the blue diagonal that makes them an N. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c33"/>
      <stop offset="1" stop-color="#09090c"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy="0" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="dia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ccaff"/>
      <stop offset="1" stop-color="#0a72ef"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ec"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#ink)"/>
  <path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#sheen)"/>
  <path d="M256 3C460 3 509 52 509 256S460 509 256 509 3 460 3 256 52 3 256 3Z" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <g filter="url(#lift)">
    <line x1="182" y1="170" x2="330" y2="342" stroke="url(#dia)" stroke-width="70" stroke-linecap="round"/>
    <rect x="141" y="132" width="70" height="248" rx="35" fill="url(#pane)"/>
    <rect x="301" y="132" width="70" height="248" rx="35" fill="url(#pane)"/>
  </g>
</svg>
