<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- Nimbstia glyph in one colour (currentColor): menu bar template image, watermark, favicon mask.
       18 pt grid, panes 3 pt wide on whole points (x 3-6 and 12-15, y 3-15), link 2.5 pt at 45 degrees.
       status.lua draws the same geometry with hs.canvas. -->
  <g fill="currentColor" stroke="currentColor"><line x1="4.5" y1="4.5" x2="13.5" y2="13.5" stroke-width="2.5" stroke-linecap="round" /><rect x="3" y="3" width="3" height="12" rx="1" stroke="none"/><rect x="12" y="3" width="3" height="12" rx="1" stroke="none"/></g>
</svg>
