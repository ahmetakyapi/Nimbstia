<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<script src="motion.js"></script>
<style>
/* Panestia tokens: the miniature Mac screen (pastel wallpaper, glass menubar, little windows). */
:root{
  --screen:radial-gradient(90% 120% at 0% 0%,#dfe7fb 0%,transparent 62%),radial-gradient(80% 110% at 100% 100%,#fbe4d8 0%,transparent 60%),radial-gradient(70% 90% at 85% 0%,#ece2f8 0%,transparent 70%),linear-gradient(140deg,#e6e8f8 0%,#efe6f4 50%,#f7e9e6 100%);
  --screen-line:rgba(40,36,70,.10); --menubar:rgba(255,255,255,.55); --menubar-ink:rgba(30,30,50,.45);
  --win:rgba(255,255,255,.93); --win-bar:rgba(246,246,248,.96); --win-line:rgba(30,30,50,.11);
  --win-shadow:0 0 0 .5px rgba(30,30,50,.14),0 1px 2px rgba(30,30,60,.08),0 6px 14px -6px rgba(40,40,80,.22);
  --tint:8%; --dot-r:#ff5f57; --dot-y:#febc2e; --dot-g:#28c840;
  --lift:0 0 0 1px var(--line),0 1px 2px rgba(12,12,16,.04),0 14px 30px -14px rgba(12,12,16,.20);
  --sel-ring:0 0 0 2px var(--accent),0 1px 2px rgba(0,0,0,.05);
  --glass:rgba(255,255,255,.82);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --screen:radial-gradient(90% 120% at 0% 0%,#34406a 0%,transparent 62%),radial-gradient(80% 110% at 100% 100%,#4a3540 0%,transparent 60%),radial-gradient(70% 90% at 85% 0%,#403462 0%,transparent 70%),linear-gradient(140deg,#2a2f4a 0%,#322c46 50%,#382c34 100%);
  --screen-line:rgba(255,255,255,.08); --menubar:rgba(10,10,16,.32); --menubar-ink:rgba(255,255,255,.4);
  --win:rgba(48,50,60,.86); --win-bar:rgba(62,64,76,.92); --win-line:rgba(255,255,255,.07);
  --win-shadow:0 0 0 .5px rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.3),0 8px 16px -6px rgba(0,0,0,.55);
  --tint:16%;
  --lift:0 0 0 1px var(--line2),inset 0 1px 0 rgba(255,255,255,.04),0 16px 34px -16px rgba(0,0,0,.7);
  --sel-ring:0 0 0 2px var(--accent);
  --glass:rgba(28,28,32,.82);
}}
:root[data-theme="dark"]{
  --screen:radial-gradient(90% 120% at 0% 0%,#34406a 0%,transparent 62%),radial-gradient(80% 110% at 100% 100%,#4a3540 0%,transparent 60%),radial-gradient(70% 90% at 85% 0%,#403462 0%,transparent 70%),linear-gradient(140deg,#2a2f4a 0%,#322c46 50%,#382c34 100%);
  --screen-line:rgba(255,255,255,.08); --menubar:rgba(10,10,16,.32); --menubar-ink:rgba(255,255,255,.4);
  --win:rgba(48,50,60,.86); --win-bar:rgba(62,64,76,.92); --win-line:rgba(255,255,255,.07);
  --win-shadow:0 0 0 .5px rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.3),0 8px 16px -6px rgba(0,0,0,.55);
  --tint:16%;
  --lift:0 0 0 1px var(--line2),inset 0 1px 0 rgba(255,255,255,.04),0 16px 34px -16px rgba(0,0,0,.7);
  --sel-ring:0 0 0 2px var(--accent);
  --glass:rgba(28,28,32,.82);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{font:13px/1.45 var(--font-ui);color:var(--text);-webkit-user-select:none;cursor:default}
.app{position:absolute;inset:16px;border-radius:16px;background:var(--app-bg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
svg{display:block}

/* header: search + focused window + controls */
header{position:relative;display:flex;align-items:center;gap:10px;height:58px;padding:0 14px 0 20px;flex:none;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--top) 70%,transparent)}
header>svg{width:18px;height:18px;color:var(--faint);flex:none}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;font:450 17px/1.3 var(--font-display);letter-spacing:var(--track-title);color:var(--text);padding:3px 0;caret-color:var(--accent)}
#q::placeholder{color:var(--faint)}
.target{display:flex;align-items:center;gap:8px;height:28px;font-size:12px;color:var(--faint);background:var(--chip);border-radius:var(--r-pill);padding:0 12px 0 5px;max-width:330px;flex:none;letter-spacing:-.005em}
.target .live{width:6px;height:6px;border-radius:50%;background:var(--ok-bar);flex:none;margin:0 2px 0 6px}
.target.none .live{background:var(--faint)}
.target img{width:18px;height:18px;flex:none}
.target span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.target b{font-weight:550;color:var(--text)}
.target.none span{color:var(--faint)}

/* content */
#content{position:relative;flex:1;overflow-y:auto;padding:0 20px 24px;scroll-padding:20px 0 20px}
h2{margin:0;padding:24px 4px 12px;display:flex;gap:12px;align-items:center}
h2.eyebrow{font:650 13px/1.2 var(--font-ui);letter-spacing:-.006em;color:var(--text)}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2 small{order:3;min-width:24px;height:20px;padding:0 7px;display:grid;place-items:center;border-radius:var(--r-pill);background:var(--chip);font:600 11.5px/1 var(--font-ui);color:var(--faint);font-variant-numeric:tabular-nums}
h2 em{font-style:normal;color:var(--faint);text-transform:none;letter-spacing:0;font:500 12.5px/1 var(--font-ui)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:4px}
.grid.small{grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}

/* card */
.card{position:relative;border-radius:20px;padding:8px 8px 14px;background:var(--card);box-shadow:var(--card-lift);
  transition:box-shadow var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out),background var(--dur-2)}
.card:hover{box-shadow:var(--lift);transform:translateY(-1px)}
.card:active{transform:scale(.985);transition-duration:var(--dur-1)}
.card.sel{background:var(--sel-bg);box-shadow:var(--sel-ring)}
/* with motion.js the 2px ring is one element that glides between cards (.nb-glide.ring); the tint stays on the card */
.has-glide .card.sel{box-shadow:var(--card-lift)}
.has-glide .card.sel:hover{box-shadow:var(--lift)}
/* Ribbon: exactly one focused window per thumbnail, the app that is in front right now. */
.card.sel .cell.focus .win{box-shadow:0 0 0 2px var(--accent),var(--win-shadow)}
/* entrance: the first six cards arrive in reading order, 28 ms apart; the ring fades in with them */
#content.enter .card{animation:nb-rise var(--dur-2) var(--ease-out) both;animation-delay:calc(min(var(--i,0),6) * var(--stagger))}
#content.enter h2,#content.enter .nb-glide{animation:nb-fade var(--dur-2) ease-out both}

.meta{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;row-gap:4px;align-items:baseline;margin:12px 6px 0}
.meta .idx{font-size:12px;font-weight:650;min-width:12px}
.meta .idx.off{color:var(--faint);opacity:.7}
.name{font:650 14.5px/1.3 var(--font-display);letter-spacing:var(--track-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{grid-column:2;font:450 12px/1.35 var(--font-ui);letter-spacing:-.003em;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.desc .tag{color:var(--accent-ink);font-weight:550}
.card.sel .name{color:var(--text)}
.card.has-last .name{padding-right:112px}

/* the miniature screen */
.screen{position:relative;width:100%;border-radius:12px;background:var(--screen);box-shadow:inset 0 0 0 1px var(--screen-line);overflow:hidden}
.screen::before{content:"";position:absolute;left:0;right:0;top:0;height:13px;background:var(--menubar);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 .5px 0 var(--screen-line)}
.screen .mb{position:absolute;left:8px;right:8px;top:0;height:13px;display:flex;align-items:center;gap:5px;z-index:1;pointer-events:none}
.screen .mb i{width:9px;height:3px;border-radius:2px;background:var(--menubar-ink);opacity:.55}
.screen .mb i:first-child{width:5px;opacity:1;border-radius:50%;height:5px}
.screen .mb i:nth-child(2){width:14px;opacity:.9}
.screen .mb s{flex:1}
.screen .mb u{width:16px;height:3px;border-radius:2px;background:var(--menubar-ink);opacity:.7}
.area{position:absolute;left:0;right:0;bottom:0;top:13px}
.cell{position:absolute;padding:5px}
.cell.front{padding:13px 13px 5px 5px;z-index:1}
.cell.behind{padding:5px 5px 13px 13px}
.win{position:relative;width:100%;height:100%;border-radius:7px;background:var(--win);box-shadow:var(--win-shadow);overflow:hidden;display:flex;flex-direction:column;
  transition:transform var(--dur-2) var(--ease-out),box-shadow var(--dur-2)}
.win .bar{height:12px;flex:none;display:flex;align-items:center;gap:3px;padding:0 5px;
  background:linear-gradient(color-mix(in srgb,var(--c) var(--tint),transparent),color-mix(in srgb,var(--c) var(--tint),transparent)),var(--win-bar);box-shadow:0 .5px 0 var(--win-line)}
.win .bar i{width:4px;height:4px;border-radius:50%;background:var(--dot-r)}
.win .bar i:nth-child(2){background:var(--dot-y)}
.win .bar i:nth-child(3){background:var(--dot-g)}
.win .bar s{flex:1;height:2px;margin:0 18% 0 10%;border-radius:2px;background:color-mix(in srgb,var(--c) 45%,transparent);opacity:.6}
.win .body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px;position:relative}
.app-ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font:650 11px/1 var(--font-display);color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 82%,#fff),var(--c));box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.25),0 1px 1px rgba(0,0,0,.1)}
img.app-ic{background:none;box-shadow:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.2))}
.win b{font:600 11.5px/1.1 var(--font-ui);letter-spacing:-.01em;color:var(--text);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.win em{font:550 11px/1 var(--font-ui);font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:0}
.card:hover .win,.card.sel .win{box-shadow:var(--win-shadow),0 0 0 .5px color-mix(in srgb,var(--c) 30%,transparent)}

/* quick placement glyphs */
.small .card{padding:6px 6px 10px;border-radius:var(--r-md)}
.small .screen{border-radius:7px}
.small .screen::before{height:6px}
.small .screen .mb{display:none}
.small .area{top:6px}
.small .cell{padding:3px}
.small .win{border-radius:4px;--c:var(--accent)}
.small .win .bar{height:6px;padding:0 3px;gap:2px}
.small .win .bar i{width:2.5px;height:2.5px}
.small .win .bar s{display:none}
.small .win .body{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.small .win .bar{background:color-mix(in srgb,var(--accent) 16%,var(--win-bar))}
.small .app-ic{width:14px;height:14px;border-radius:4px}
.small .name{font:550 11.5px/1.2 var(--font-ui);letter-spacing:-.01em;margin:8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:var(--muted)}
.small .card.sel .name,.small .card:hover .name{color:var(--text)}
.small .card:hover .win .body,.small .card.sel .win .body{background:color-mix(in srgb,var(--accent) 16%,transparent)}
/* Ghost window: where a hidden app would go, dashed like Ribbon's incoming window. */
.cell.ghost .win{background:transparent;box-shadow:none;outline:1.5px dashed color-mix(in srgb,var(--text) 28%,transparent);outline-offset:-1.5px}
.arrow{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent-ink);font:600 15px/1 var(--font-ui)}

/* badges + ratio pill */
.last{position:absolute;right:14px;bottom:34px;z-index:2;display:flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-pill);font:600 11.5px/1 var(--font-ui);letter-spacing:-.003em;color:var(--accent-ink);background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.adj{position:absolute;left:50%;bottom:10px;transform:translate(-50%,4px);z-index:3;display:flex;align-items:center;gap:1px;opacity:0;pointer-events:none;
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);border-radius:var(--r-pill);padding:3px;
  box-shadow:0 0 0 .5px var(--line2),0 1px 0 rgba(255,255,255,.08) inset,0 8px 22px -6px rgba(0,0,0,.3);transition:opacity var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out)}
.card.sel .adj,.card:hover .adj{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.adj div{width:24px;height:22px;border-radius:var(--r-pill);display:grid;place-items:center;font:550 15px/1 var(--font-ui);color:var(--text);transition:background var(--dur-1)}
.adj div:hover{background:var(--chip)}
.adj span{font:600 12px/1 var(--font-ui);font-variant-numeric:tabular-nums;padding:0 6px;color:var(--text);min-width:72px;text-align:center;white-space:nowrap}
.adj span u{text-decoration:none;color:var(--faint);padding:0 3px}

/* footer */
footer{display:flex;align-items:center;gap:18px;padding:0 20px;height:44px;flex:none;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 60%,transparent);font-size:12px;color:var(--muted);white-space:nowrap}
footer>span{display:flex;align-items:center;gap:7px}
footer .sp{flex:1}
footer kbd{min-width:20px}
footer kbd+kbd{margin-left:-4px}
.ratio{font:600 12px/1 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--text)}
.ratio u{text-decoration:none;color:var(--faint);padding:0 4px}
.fname{color:var(--text);font-weight:500}

mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:100px 0;text-align:center;color:var(--muted);font-size:12.5px}
.empty svg{width:34px;height:34px;margin:0 0 12px;color:var(--faint);animation:nb-pop var(--dur-3) var(--ease-spring) both .04s}
.empty{animation:nb-rise var(--dur-2) var(--ease-out) both}
.empty b{font:600 15px/1.3 var(--font-display);letter-spacing:var(--track-title);color:var(--text)}

/* theme switch + close */
.tb{position:relative;width:30px;height:30px;flex:none;border:0;padding:0;font:inherit;background:none;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--muted);transition:background var(--dur-1),color var(--dur-1),transform var(--dur-1) var(--ease-out)}
.tb:active{transform:scale(.92)}
.tb svg{width:16px;height:16px}
.tb:hover{background:var(--hover);color:var(--text)}
#closeBtn{color:var(--muted)}
#closeBtn:hover{color:#fff;background:#e5484d}
/* ---------------------------------------------------------------- Panestia, Aurora round
   A hint of violet behind the header; every card is a small lit stage on a calm slate wallpaper. */
:root{--screen:radial-gradient(80% 110% at 0% 0%,#d5e3f8 0%,transparent 62%),radial-gradient(70% 100% at 100% 100%,#d9ece8 0%,transparent 60%),linear-gradient(140deg,#e6ebf3 0%,#eaedf3 50%,#edf0f3 100%);
  --lift:0 0 0 1px var(--line),0 2px 4px rgba(22,26,45,.05),0 22px 40px -22px rgba(22,26,45,.32);
  --sel-ring:0 0 0 2px var(--accent),0 18px 40px -18px var(--accent)}
:root[data-theme="dark"]{--screen:radial-gradient(80% 110% at 0% 0%,#2a3b60 0%,transparent 62%),radial-gradient(70% 100% at 100% 100%,#1f3a44 0%,transparent 60%),linear-gradient(140deg,#1b2030 0%,#1a1e2a 50%,#1b212b 100%);--win:rgba(34,36,46,.86);--win-bar:rgba(50,53,66,.92);--lift:0 0 0 1px var(--line2),inset 0 1px 0 rgba(255,255,255,.06),0 24px 44px -22px #000;--sel-ring:0 0 0 2px var(--accent),0 18px 44px -18px var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--screen:radial-gradient(80% 110% at 0% 0%,#2a3b60 0%,transparent 62%),radial-gradient(70% 100% at 100% 100%,#1f3a44 0%,transparent 60%),linear-gradient(140deg,#1b2030 0%,#1a1e2a 50%,#1b212b 100%);--win:rgba(34,36,46,.86);--win-bar:rgba(50,53,66,.92);--lift:0 0 0 1px var(--line2),inset 0 1px 0 rgba(255,255,255,.06),0 24px 44px -22px #000;--sel-ring:0 0 0 2px var(--accent),0 18px 44px -18px var(--accent)}}
/* the violet stays in the badge; the canvas only hints at it */
.app[data-tool]{--tool2:#38bdf8;--tool3:#2dd4bf;--wash-1:20%;--wash-2:13%;--wash-3:8%;--wash-4:0%}
.app{border-radius:20px;isolation:isolate}
.app::before{content:"";position:absolute;inset:0 0 auto;height:280px;background:var(--wash);pointer-events:none;z-index:-1;-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent);mask-image:linear-gradient(180deg,#000 30%,transparent)}
header{height:64px;gap:13px;padding-left:16px;background:none}
#q{font-weight:500;font-size:19px}
.target{height:32px;padding:0 14px 0 6px;background:color-mix(in srgb,var(--card) 66%,transparent);box-shadow:inset 0 0 0 1px var(--line),var(--ctl-shadow);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.target .live{width:7px;height:7px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok-bar) 24%,transparent)}
.target.none .live{box-shadow:none}
h2.eyebrow{font-size:13.5px}
.card{border-radius:22px;padding:8px 8px 15px}
.card:hover{transform:translateY(-2px)}
.card.sel{background:var(--sel-bg)}
.screen{border-radius:15px;box-shadow:inset 0 0 0 1px var(--screen-line),inset 0 1px 0 rgba(255,255,255,.25)}
.win{border-radius:8px}
.win .body{background:radial-gradient(90% 70% at 50% 0%,color-mix(in srgb,var(--c) 9%,transparent),transparent 75%)}
.app-ic{width:26px;height:26px;border-radius:8px;font-size:12.5px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.3),0 4px 8px -3px color-mix(in srgb,var(--c) 75%,transparent)}
.card:hover .win,.card.sel .win{transform:translateY(-1px)}
.card.sel .cell.focus .win{box-shadow:0 0 0 2px var(--accent),0 8px 18px -8px var(--accent),var(--win-shadow)}
.meta .idx{display:grid;place-items:center;width:20px;height:20px;border-radius:7px;font-size:11.5px;color:var(--muted);background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);align-self:start}
.meta .idx.off{color:var(--faint);background:var(--chip);box-shadow:none;opacity:1}
.card.sel .meta .idx{color:var(--accent-ink);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.meta{column-gap:10px;margin:13px 8px 0}
.small .card{border-radius:14px}
.small .meta .idx{display:none}
.small .app-ic{width:14px;height:14px;border-radius:4px;box-shadow:none}
.last{box-shadow:inset 0 0 0 1px var(--accent-line)}
.adj{box-shadow:0 0 0 .5px var(--line2),0 1px 0 rgba(255,255,255,.1) inset,0 10px 26px -8px rgba(0,0,0,.4)}
.app::before{inset:0;height:auto;-webkit-mask-image:none;mask-image:none}
header{border-bottom:0}
footer{border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 62%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.card{background:color-mix(in srgb,var(--card) 84%,transparent)}
</style>
</head>
<body>
<div class="app grain" id="app" data-tool="panestia">
  <header>
    <span class="tmark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" fill-opacity=".3" stroke="none"><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/></g><rect x="2.5" y="2.5" width="4.8" height="11" rx="1.4"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/></svg></span>
    <input id="q" placeholder="Düzen veya uygulama ara…" autocomplete="off" spellcheck="false">
    <div class="target" id="target"></div>
    <button class="tb" id="theme" type="button"></button>
    <button class="tb" id="closeBtn" type="button" aria-label="Kapat" data-tip="Kapat · Esc"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
  </header>
  <div id="content"></div>
  <footer id="foot"></footer>
</div>
<script>
const $ = s => document.querySelector(s);
const app = $('#app'), input = $('#q'), contentEl = $('#content'), footEl = $('#foot'), targetEl = $('#target');
let data = { apps: {}, layouts: [], actions: [], aspect: 16 / 10 }, view = [], sel = 0, q = '';
const STEP = 0.05;
const EMPTY_ICON = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.4C4 9 6 7 8.4 7H14v18H8.4C6 25 4 23 4 20.6z" fill="currentColor" fill-opacity=".28" stroke="none"/><rect x="4" y="7" width="24" height="18" rx="4.4"/><path d="M14 7v18M14 16h14"/></svg>';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lower = s => String(s || '').toLocaleLowerCase('tr');
const post = m => window.webkit.messageHandlers.layouts.postMessage(m);

// Theme switch: sun while the panel is dark (click -> light), moon while it is light (click -> dark).
const SUN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3" fill="currentColor" fill-opacity=".28" stroke="none"/><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8H3M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1"/></svg>', MOON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4z" fill="currentColor" fill-opacity=".28" stroke="none"/><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4z"/></svg>';
const themeBtn = $('#theme'), darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : darkMQ.matches; };
function syncTheme() {
  const d = isDark(), tip = d ? 'Açık Tema' : 'Koyu Tema';
  themeBtn.innerHTML = d ? SUN : MOON; themeBtn.dataset.tip = tip; themeBtn.setAttribute('aria-label', tip);
}
new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
darkMQ.addEventListener('change', syncTheme);
themeBtn.addEventListener('mousedown', e => { e.preventDefault(); post({ action: 'toggleTheme' }); });
$('#closeBtn').addEventListener('mousedown', e => { e.preventDefault(); post({ action: 'close' }); });
syncTheme();
const pct = v => '%' + Math.round(v * 100);

function descOf(L) {
  const name = c => data.apps[c.app]?.name || c.app;
  const [a, b, c] = L.cells;
  if (L.id === 'pair') return 'Öndeki solda · önceki sağda';
  if (L.cells.length === 1) return name(a) + (a.rect[2] === 1 ? ' tam ekran' : ' ortada');
  if (L.cells.length === 3 && b.rect[0] === c.rect[0] && b.rect[1] === c.rect[1]) return `${name(a)} ${pct(a.rect[2])} · sağda ${name(b)} ve ${name(c)} ${pct(b.rect[2])}`;
  if (L.cells.length === 3 && b.rect[0] === c.rect[0]) return `${name(a)} ${pct(a.rect[2])} · sağda ${name(b)} / ${name(c)}`;
  return L.cells.map(x => `${name(x)} ${pct(x.rect[2])}`).join(' · ');
}

const MENUBAR = '<div class="mb"><i></i><i></i><i></i><i></i><s></s><u></u></div>';
const pctHTML = v => `%${Math.round(v * 100)}`;
function screenHTML(cells, overlay = '') {
  const ratio = (1 / data.aspect) * 100;
  return `<div class="screen" style="padding-top:${ratio.toFixed(2)}%">${MENUBAR}<div class="area">${cells.join('')}</div>${overlay}</div>`;
}
// One little window: title bar with traffic lights (tinted with the app colour) and a body.
function cellHTML(rect, inner, color, cls = '') {
  const [x, y, w, h] = rect;
  return `<div class="cell ${cls}" style="left:${x * 100}%;top:${y * 100}%;width:${w * 100}%;height:${h * 100}%"><div class="win" style="--c:${color}">${cls.includes('ghost') ? '' : '<div class="bar"><i></i><i></i><i></i><s></s></div>'}<div class="body">${inner}</div></div></div>`;
}
const appIcon = a => a.icon ? `<img class="app-ic" src="${a.icon}">` : `<span class="app-ic">${esc(String(a.name || '?').trim().charAt(0).toLocaleUpperCase('tr'))}</span>`;

function layoutCard(L, i) {
  const big = L.cells.length <= 2;
  let focused = false;
  const same = (p, q) => p.rect.every((v, k) => v === q.rect[k]);
  const cells = L.cells.map((c, ci) => {
    const a = data.apps[c.app] || {};
    // The window of the app in front gets the focus ring (once per card).
    const focus = !focused && !!data.win && (data.win.key ? c.app === data.win.key : a.name === data.win.app);
    if (focus) focused = true;
    const showPct = L.adjustable && c.rect[3] === 1;
    const roomy = big || c.rect[2] > 0.3;
    const inner = `${appIcon(a)}${roomy ? `<b>${esc(a.name)}</b>` : ''}${showPct ? `<em>${pct(c.rect[2])}</em>` : ''}`;
    // Windows sharing a rect are drawn as a cascade: the earlier one in front, the later peeking out behind.
    const stack = L.cells.some((o, oi) => oi !== ci && same(o, c)) ? (L.cells.findIndex(o => same(o, c)) === ci ? ' front' : ' behind') : '';
    return cellHTML(c.rect, inner, a.color || '#888', (focus ? 'focus' : '') + stack);
  });
  const tags = [];
  if (L.hideOthers) tags.push('Diğerlerini Gizler');
  if (L.custom) tags.push('Özel Oran');
  const last = data.last === L.id ? '<span class="last">Son Kullanılan</span>' : '';
  const adj = L.adjustable ? `<div class="adj"><div data-d="-1" title="Solu Daralt">−</div><span>${pct(L.ratio)}<u>/</u>${pct(1 - L.ratio)}</span><div data-d="1" title="Solu Genişlet">+</div></div>` : '';
  return `<div class="card${last ? ' has-last' : ''}" data-i="${i}" style="--i:${i}">${last}${screenHTML(cells, adj)}
    <div class="meta"><span class="idx${i < 9 ? '' : ' off'}">${i + 1}</span><div class="name">${hl(L.name)}</div><div class="desc">${esc(descOf(L))}${tags.length ? ` · <span class="tag">${tags.join(' · ')}</span>` : ''}</div></div></div>`;
}

function actionCard(A, i) {
  const icon = data.win?.icon ? `<img class="app-ic" src="${data.win.icon}">` : '';
  let cells;
  if (A.nextScreen) cells = [cellHTML([0, 0, 1, 1], '', 'var(--accent)', 'ghost'), '<div class="arrow">→</div>'];
  else cells = [cellHTML(A.rect, icon, 'var(--accent)')];
  return `<div class="card" data-i="${i}" style="--i:6">${screenHTML(cells)}<div class="name">${hl(A.name)}</div></div>`;
}

function hl(str) {
  const toks = lower(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return esc(str);
  const l = lower(str), marks = new Array(str.length).fill(false);
  for (const tk of toks) { let i = l.indexOf(tk); while (i >= 0) { for (let j = i; j < i + tk.length; j++) marks[j] = true; i = l.indexOf(tk, i + tk.length); } }
  let out = '', on = false;
  for (let i = 0; i < str.length; i++) { if (marks[i] !== on) { out += marks[i] ? '<mark>' : '</mark>'; on = marks[i]; } out += esc(str[i]); }
  return out + (on ? '</mark>' : '');
}

function matches(text) {
  const toks = lower(q).split(/\s+/).filter(Boolean);
  const h = lower(text);
  return toks.every(t => h.includes(t));
}

function render(keepId) {
  const layouts = data.layouts.filter(L => matches(L.name + ' ' + L.group + ' ' + L.cells.map(c => data.apps[c.app]?.name).join(' ')));
  const actions = data.actions.filter(A => matches(A.name + ' pencere'));
  view = [...layouts.map(x => ({ type: 'layout', ...x })), ...actions.map(x => ({ type: 'action', ...x }))];
  if (keepId) { const i = view.findIndex(v => v.id === keepId); sel = i >= 0 ? i : 0; } else sel = 0;
  sel = Math.max(0, Math.min(sel, view.length - 1));

  let html = '', idx = 0, lastGroup = null, open = false;
  for (const L of layouts) {
    if (L.group !== lastGroup) {
      if (open) html += '</div>';
      const n = layouts.filter(x => x.group === L.group).length;
      html += `<h2 class="eyebrow">${esc(L.group)}<small>${n}</small></h2><div class="grid">`; open = true; lastGroup = L.group;
    }
    html += layoutCard(L, idx++);
  }
  if (open) html += '</div>';
  if (actions.length) {
    html += `<h2 class="eyebrow">Bu Pencere<em>${esc(data.win ? data.win.app : 'Seçili Pencere Yok')}</em><small>${actions.length}</small></h2><div class="grid small">`;
    for (const A of actions) html += actionCard(A, idx++);
    html += '</div>';
  }
  if (!view.length) html = `<div class="empty">${EMPTY_ICON}<b>Eşleşen Düzen Yok</b><span>Farklı bir kelime dene ya da Esc ile aramayı temizle.</span></div>`;
  contentEl.innerHTML = html;
  targetEl.classList.toggle('none', !data.win);
  targetEl.innerHTML = data.win ? `${data.win.icon ? `<img src="${data.win.icon}">` : '<i class="live"></i>'}<span><b>${esc(data.win.app)}</b>${data.win.title ? ' · ' + esc(data.win.title) : ''}</span>` : '<i class="live"></i><span>Seçili Pencere Yok</span>';
  targetEl.style.display = 'flex';
  mark(false, false);
}

function mark(scroll = true, animate = true) {
  contentEl.querySelector('.card.sel')?.classList.remove('sel');
  const el = contentEl.querySelector(`.card[data-i="${sel}"]`);
  if (el) { el.classList.add('sel'); if (scroll) el.scrollIntoView({ block: 'nearest' }); }
  if (window.NB) NB.glide(contentEl, el, { cls: 'ring', animate });
  footer();
}

function footer() {
  const v = view[sel], h = ['<span><kbd>↩</kbd>Uygula</span>', '<span><kbd>1–9</kbd>Hızlı Seç</span>'];
  // the same key glyphs as Pastia and Repostia (⌥ ⌘), not spelled-out names
  if (v?.type === 'layout' && v.adjustable) h.push('<span><kbd>⌥←</kbd><kbd>⌥→</kbd>Oran</span>');
  if (v?.type === 'layout' && v.custom) h.push('<span><kbd>⌥0</kbd>Sıfırla</span>');
  if (data.canUndo) h.push('<span><kbd>⌘Z</kbd>Geri Al</span>');
  let right = '';
  if (v?.type === 'layout' && v.adjustable) right = `<span><span class="fname">${esc(v.name)}</span><span class="ratio">${pct(v.ratio)}<u>/</u>${pct(1 - v.ratio)}</span></span>`;
  else if (v) right = `<span class="fname">${esc(v.name)}</span>`;
  footEl.innerHTML = h.join('') + '<span class="sp"></span>' + right;
}

function move(dir) {
  const cur = contentEl.querySelector(`.card[data-i="${sel}"]`);
  if (!cur) return;
  if (dir === 'left' || dir === 'right') { sel = Math.max(0, Math.min(view.length - 1, sel + (dir === 'left' ? -1 : 1))); return mark(); }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2;
  let best = null, bestScore = Infinity;
  contentEl.querySelectorAll('.card').forEach(el => {
    const b = el.getBoundingClientRect();
    const dy = dir === 'down' ? b.top - r.bottom : r.top - b.bottom;
    if (dy < -2) return;
    const score = dy * 4 + Math.abs(b.left + b.width / 2 - cx);
    if (score < bestScore) { bestScore = score; best = el; }
  });
  if (best) { sel = +best.dataset.i; mark(); }
}

function apply(v = view[sel]) { if (v) post({ action: 'apply', id: v.id }); }

input.addEventListener('input', () => { q = input.value; render(); contentEl.scrollTop = 0; });
contentEl.addEventListener('mousedown', e => {
  const d = e.target.closest('.adj [data-d]');
  if (d) { e.preventDefault(); e.stopPropagation(); const c = d.closest('.card'); sel = +c.dataset.i; post({ action: 'ratio', id: view[sel].id, delta: +d.dataset.d * STEP }); return; }
  if (e.target.closest('.adj')) { e.preventDefault(); return; }
  const c = e.target.closest('.card'); if (!c) return;
  e.preventDefault(); sel = +c.dataset.i; mark(false);
});
contentEl.addEventListener('click', e => { if (e.target.closest('.adj')) return; if (e.target.closest('.card')) apply(); });
let enterT = 0;
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('mousedown', () => setTimeout(() => input.focus(), 0));

document.addEventListener('keydown', e => {
  const k = e.key, v = view[sel];
  if (e.altKey && (k === 'ArrowLeft' || k === 'ArrowRight')) { if (v?.type === 'layout' && v.adjustable) post({ action: 'ratio', id: v.id, delta: k === 'ArrowLeft' ? -STEP : STEP }); }
  else if (e.altKey && (e.code === 'Digit0' || k === '0')) { if (v?.type === 'layout' && v.custom) post({ action: 'ratio', id: v.id, reset: true }); }
  else if (k === 'ArrowLeft') move('left');
  else if (k === 'ArrowRight') move('right');
  else if (k === 'ArrowDown') move('down');
  else if (k === 'ArrowUp') move('up');
  else if (k === 'Tab') move(e.shiftKey ? 'left' : 'right');
  else if (k === 'Enter') apply();
  else if (e.metaKey && lower(k) === 'z') post({ action: 'undo' });
  else if (k === 'Escape') { if (q) { input.value = q = ''; render(); } else post({ action: 'close' }); }
  else if (/^[1-9]$/.test(k) && (!q || e.metaKey)) apply(view[+k - 1]);
  else return;
  e.preventDefault();
  // the keycap of the shortcut that just fired dips
  const cap = e.altKey && k === 'ArrowLeft' ? '⌥←' : e.altKey && k === 'ArrowRight' ? '⌥→' : e.altKey && (e.code === 'Digit0' || k === '0') ? '⌥0'
    : k === 'Enter' ? '↩' : e.metaKey && lower(k) === 'z' ? '⌘Z' : /^[1-9]$/.test(k) ? '1–9' : '';
  if (cap && window.NB) NB.press(cap, footEl);
});

window.Layouts = {
  setData(d) {
    const keep = view[sel]?.id;
    data = d; render(keep);
  },
  open() {
    input.value = q = '';
    render(data.last);
    contentEl.scrollTop = 0;
    contentEl.classList.remove('enter'); void contentEl.offsetWidth; contentEl.classList.add('enter');
    clearTimeout(enterT); enterT = setTimeout(() => contentEl.classList.remove('enter'), 700);
    app.classList.remove('show');
    requestAnimationFrame(() => app.classList.add('show'));
    input.focus();
  },
  close() { app.classList.remove('show'); },
};
window.Panel = window.Layouts;
post({ action: 'ready' });
</script>
</body>
</html>
