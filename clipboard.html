<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<style>
/* tooltips and toasts: a white card in light, graphite ink in dark (no near-black fills in light) */
:root{--tt-bg:#ffffff;--tt-fg:var(--text);--tt-shadow:0 0 0 .5px rgba(20,24,40,.14),0 8px 24px -6px rgba(20,24,40,.22)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tt-bg:var(--ink);--tt-fg:var(--on-ink);--tt-shadow:var(--ink-shadow),0 16px 36px -10px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--tt-bg:var(--ink);--tt-fg:var(--on-ink);--tt-shadow:var(--ink-shadow),0 16px 36px -10px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{font:13px/1.45 var(--font-ui);color:var(--text);-webkit-user-select:none;cursor:default}
svg{display:block}
/* Shared skeleton (Pastia + Repostia): search header, segmented filter bar, day-grouped list, paper preview, keycap footer, ink toast. */
.app{position:absolute;inset:16px;border-radius:var(--r-lg);background:var(--app-bg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;isolation:isolate;
  opacity:0;transform:scale(.985) translateY(-6px);transition:opacity var(--dur-1) ease,transform var(--dur-2) var(--ease-out)}
.app::before{content:"";position:absolute;inset:0 0 auto;height:180px;background:var(--wash);pointer-events:none;z-index:-1}
.app.show{opacity:1;transform:none}

/* header: a calm, large search field */
header{display:flex;align-items:center;gap:12px;height:64px;padding:0 16px 0 20px;flex:none}
header>svg{width:19px;height:19px;color:var(--faint);flex:none;transition:color var(--dur-2)}
header:focus-within>svg{color:var(--text)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;font:450 19px/1.3 var(--font-display);letter-spacing:var(--track-title);color:var(--text);padding:3px 0;caret-color:var(--accent)}
#q::placeholder{color:var(--faint);opacity:.8}
.qhint{display:flex;align-items:center;gap:4px;flex:none;margin-right:4px;transition:opacity var(--dur-2)}
.qhint kbd{min-width:22px;height:22px}
#q:not(:placeholder-shown)~.qhint{display:none}
.reset{display:none;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:var(--r-pill);font:500 12px/1 var(--font-ui);color:var(--accent-ink);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);white-space:nowrap;transition:background var(--dur-1)}
.reset.on{display:flex}
.reset:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tb{position:relative;width:30px;height:30px;flex:none;border:0;padding:0;font:inherit;background:none;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--muted);transition:background var(--dur-1),color var(--dur-1)}
.tb svg{width:16px;height:16px}
.tb:hover{background:var(--hover);color:var(--text)}
.tb[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;white-space:nowrap;background:var(--tt-bg);color:var(--tt-fg);font:500 11.5px/1 var(--font-ui);padding:6px 9px;border-radius:var(--r-pill);pointer-events:none;z-index:60;box-shadow:var(--tt-shadow)}
#closeBtn{color:#e5484d}
#closeBtn:hover{color:#fff;background:#e5484d}

/* filter bar: two pill segmented controls */
.bar{display:flex;align-items:center;gap:8px 16px;padding:0 20px 16px;border-bottom:1px solid var(--line);flex:none}
.seg{display:flex;gap:2px;flex-wrap:nowrap;padding:3px;border-radius:var(--r-pill);background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
#kinds{flex:0 1 auto;min-width:0}
.seg.time{flex:none;margin-left:auto}
.f,.t{flex:none;display:flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 10px;border-radius:var(--r-pill);font:500 12.5px/1 var(--font-ui);letter-spacing:-.005em;color:var(--muted);white-space:nowrap;
  transition:background var(--dur-1),color var(--dur-1),box-shadow var(--dur-2) var(--ease-out)}
.t{padding:0 12px}
.f svg{width:15px;height:15px;flex:none;color:var(--faint);transition:color var(--dur-1)}
.f b{font:600 11.5px/1 var(--font-ui);color:var(--faint);font-variant-numeric:tabular-nums}
.f:hover:not(.on),.t:hover:not(.on){color:var(--text)}
.f:hover:not(.on) svg{color:var(--muted)}
.f.on,.t.on{background:var(--seg-on);color:var(--text);font-weight:600;box-shadow:0 0 0 .5px var(--line2),0 1px 2px rgba(12,12,16,.08),0 2px 6px -2px rgba(12,12,16,.08)}
.f.on svg{color:var(--accent)}
.f.on b{color:var(--accent-ink)}
.f.zero:not(.on){color:var(--faint)}
.f.zero:not(.on) svg{opacity:.55}

/* list */
main{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
#list{overflow-y:auto;padding:0 10px 12px;background:var(--pane);border-right:1px solid var(--line);scroll-padding:40px 0 8px}
.group{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;margin:0 -10px 2px;padding:14px 20px 8px;
  font:600 12px/1 var(--font-ui);letter-spacing:-.003em;color:var(--muted);
  background:linear-gradient(180deg,var(--pane) 70%,color-mix(in srgb,var(--pane) 0%,transparent))}
.group::after{content:"";flex:1;height:1px;background:var(--line);order:1}
.group span{order:2;min-width:20px;height:18px;padding:0 6px;display:grid;place-items:center;border-radius:var(--r-pill);background:var(--chip);color:var(--faint);font:600 11px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:0 12px 0 10px;border-radius:var(--r-md);height:56px;transition:background var(--dur-1),box-shadow var(--dur-2) var(--ease-out)}
.row+.row{margin-top:1px}
.row:hover{background:var(--hover)}
.row.sel{background:color-mix(in srgb,var(--accent-soft) 70%,transparent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.row.sel::before{content:"";position:absolute;left:-1px;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.intro .row{animation:nb-rise .36s var(--ease-out) both;animation-delay:calc(min(var(--i,0),10) * 18ms)}
/* kind tile: a soft gradient in the kind's colour, glyph in the full colour */
:root{--t-top:19%;--t-bot:8%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-top:30%;--t-bot:15%}}
:root[data-theme="dark"]{--t-top:30%;--t-bot:15%}
.ico{--k:var(--k-text);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--k) var(--t-top),var(--card)) 0%,color-mix(in srgb,var(--k) var(--t-bot),var(--card)) 100%);
  color:color-mix(in srgb,var(--k) var(--glyph),#000);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) var(--tile-ring),transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.ico svg{width:17px;height:17px}
.row.sel .ico{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 42%,transparent)}
.meta{min-width:0;flex:1}
.ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;font-weight:560;letter-spacing:-.008em;color:var(--text)}
.su{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.end{display:flex;align-items:center;gap:8px;color:var(--faint);font:500 11.5px/1 var(--font-ui);flex:none}
.end .pin svg{width:12px;height:12px;color:var(--k-pin)}
.end .n{font-variant-numeric:tabular-nums;min-width:20px;text-align:right;opacity:.8}
.cp{display:none;width:28px;height:28px;border-radius:var(--r-pill);place-items:center;color:var(--muted);background:var(--ctl);box-shadow:0 0 0 1px var(--line2),var(--ctl-shadow);transition:color var(--dur-1),background var(--dur-1),transform var(--dur-1) var(--ease-out)}
.cp svg{width:14px;height:14px}
.cp:hover{color:var(--accent-ink)}
.cp:active{transform:scale(.92)}
.row:hover .cp,.row.sel .cp{display:grid}
.row:hover .n,.row.sel .n{display:none}
.row.flash .cp{color:var(--ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 45%,transparent)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* buttons: blue pill for the primary action, quiet ghost pills for the rest */
.btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:var(--r-pill);font:500 12.5px/1 var(--font-ui);letter-spacing:-.005em;color:var(--text);background:transparent;box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap;
  transition:background var(--dur-1),color var(--dur-1),box-shadow var(--dur-1),transform var(--dur-1) var(--ease-out)}
.btn svg{width:15px;height:15px;color:var(--muted);transition:color var(--dur-1)}
.btn:hover{background:var(--hover);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 18%,transparent)}
.btn:hover svg{color:var(--text)}
.btn:active{transform:scale(.97)}
.btn.primary{height:32px;padding:0 5px 0 13px;gap:8px;background:var(--primary);color:var(--on-primary);font-weight:600;box-shadow:var(--primary-shadow);transition:filter var(--dur-1),transform var(--dur-1) var(--ease-out)}
.btn.primary:hover{background:var(--primary);filter:brightness(1.07);box-shadow:var(--primary-shadow)}
.btn.primary:active{filter:brightness(.95);transform:scale(.97)}
.btn.primary svg,.btn.primary:hover svg{color:var(--on-primary);order:0}
.btn.primary .k{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:var(--r-pill);background:rgba(255,255,255,.22);color:var(--on-primary);font:600 11.5px/1 var(--font-ui);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.btn.danger:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 30%,transparent)}
.btn.danger:hover svg{color:var(--danger)}

/* preview */
#preview{display:flex;flex-direction:column;min-width:0;min-height:0;background:color-mix(in srgb,var(--pv-bg) 55%,transparent)}
#preview:empty{display:grid;place-items:center}
#preview:empty::before{content:"Seçili öğe yok";font:500 13px/1 var(--font-ui);color:var(--faint)}
.pv-actions{display:flex;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:center;flex:none}
.pv-actions .sp{flex:1}
.sec{display:flex;align-items:center;gap:10px;margin:28px 0 12px;font:600 12px/1 var(--font-ui);color:var(--muted)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec .idx{letter-spacing:.02em}

/* footer */
footer{display:flex;align-items:center;gap:18px;padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;flex:none;background:color-mix(in srgb,var(--bg2) 60%,transparent)}
footer>span{display:flex;align-items:center;gap:7px}
footer .sp{flex:1}
footer .cnt{font:500 12px/1 var(--font-ui);color:var(--faint);font-variant-numeric:tabular-nums}
footer .cnt b{font-weight:650;color:var(--text);margin-right:4px}

/* empty states */
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px 28px;font-size:13px;animation:nb-rise .3s var(--ease-out) both}
.empty>div>svg{width:46px;height:46px;padding:13px;margin:0 auto 16px;border-radius:14px;color:var(--muted);background:var(--card);box-shadow:var(--card-lift),0 8px 20px -10px rgba(12,12,16,.2)}
.empty svg+div{font:600 15px/1.35 var(--font-display);letter-spacing:var(--track-title);color:var(--text);max-width:300px;margin:0 auto}
.empty .hint{color:var(--faint);font-size:12.5px;font-weight:400;margin:6px auto 0;max-width:280px;line-height:1.5}
.empty .btn{margin:18px auto 0;display:inline-flex}

/* toast: ink pill */
.toast{position:absolute;left:50%;bottom:58px;z-index:40;transform:translate(-50%,10px) scale(.96);background:var(--tt-bg);color:var(--tt-fg);font:550 12.5px/1 var(--font-ui);letter-spacing:-.005em;padding:0 16px 0 6px;height:34px;border-radius:var(--r-pill);opacity:0;
  transition:opacity var(--dur-1),transform var(--dur-2) var(--ease-spring);pointer-events:none;display:flex;gap:9px;align-items:center;box-shadow:var(--tt-shadow);white-space:nowrap}
.toast svg{width:22px;height:22px;padding:5px;border-radius:50%;color:#fff;background:var(--ok-bar)}
.toast.on{opacity:1;transform:translate(-50%,0)}

body{-webkit-font-smoothing:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{-webkit-font-smoothing:antialiased}}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased}

/* Pastia: when the kind pills and the time range do not fit on one row, the time range moves to its own row */
.bar{flex-wrap:wrap}
.bar.stack #kinds{flex-basis:auto}
.bar.stack .seg.time{margin-left:0}
.ico.k-text{--k:var(--k-text)}.ico.k-multi{--k:var(--k-code)}.ico.k-link{--k:var(--k-link)}.ico.k-mail{--k:var(--k-mail)}.ico.k-path{--k:var(--k-path)}.ico.k-number{--k:var(--k-number)}.ico.k-color{--k:var(--k-text)}.ico.k-clip{--k:var(--accent)}
.ico:has(img){box-shadow:inset 0 0 0 1px var(--line2);background:var(--chip)}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico .sw{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35),0 1px 2px rgba(0,0,0,.12)}
.ico.shimmer{background:linear-gradient(100deg,var(--chip) 30%,var(--line) 50%,var(--chip) 70%) 0 0/300% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-100% 0}}
.pv-body{flex:1;min-height:0;overflow:auto;padding:24px 24px 16px;display:flex;flex-direction:column}
.intro .pv-body>*{animation:nb-rise .32s var(--ease-out) both}
/* one soft card style for every preview; it fills the height between the action bar and the metadata */
.pv-body>.pv-card{flex:1 1 auto;min-height:0}
.pv-card{position:relative;border-radius:16px;background:var(--pv-card);box-shadow:var(--card-lift),0 12px 32px -20px rgba(20,24,40,.22)}
.pv-text{padding:20px 24px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.65;letter-spacing:-.004em;color:var(--text);-webkit-user-select:text;cursor:text}
.pv-text.short{display:flex;flex-direction:column;justify-content:center;font:500 18px/1.5 var(--font-display);letter-spacing:-.014em}
.pv-text.mono,textarea.mono{font:12.5px/1.7 var(--font-mono);letter-spacing:0}
.pv-more{margin-top:10px;font:500 12px/1.3 var(--font-ui);color:var(--faint)}
/* code: soft card, gutter numbers (not selectable), language chip */
.pv-code{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pv-code .hd{flex:none;display:flex;align-items:center;height:40px;padding:0 16px;border-bottom:1px solid var(--line)}
.pv-code .lang{font:600 12px/1 var(--font-ui);color:var(--muted)}
.pv-code ol{margin:0;padding:14px 0;list-style:none;counter-reset:ln;overflow:auto;flex:1;font:12.5px/1.75 var(--font-mono);letter-spacing:0;color:var(--text);-webkit-user-select:text;cursor:text;
  background:linear-gradient(90deg,color-mix(in srgb,var(--text) 3.5%,transparent) 0 46px,transparent 46px)}
.pv-code li{counter-increment:ln;white-space:pre;padding:0 22px 0 62px;position:relative;min-height:1.75em}
.pv-code li::before{content:counter(ln);position:absolute;left:0;width:46px;padding-right:12px;text-align:right;color:var(--faint);opacity:.75;font-variant-numeric:tabular-nums;-webkit-user-select:none}
.pv-code li:hover{background:var(--hover)}
/* link: host tile, domain, path, full address */
.pv-url{padding:24px;display:flex;flex-direction:column;justify-content:center}
.pv-url .hd{display:flex;align-items:center;gap:16px;min-width:0}
.htile{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font:560 24px/1 var(--font-display);color:#fff;
  background:linear-gradient(150deg,hsl(var(--h) 85% 62%),hsl(var(--h2) 75% 48%));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(0,0,0,.06)}
.pv-url .ht{min-width:0}
.pv-url .host{font:560 24px/1.15 var(--font-display);letter-spacing:var(--track-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-user-select:text}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:7px;min-width:0}
.crumbs span{font:500 12px/1 var(--font-ui);color:var(--muted);background:var(--chip);padding:5px 8px;border-radius:var(--r-pill);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs i{width:10px;height:10px;color:var(--faint);font-style:normal;display:grid;place-items:center}
.crumbs i svg{width:10px;height:10px}
.pv-url .full{display:flex;align-items:flex-start;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font:12.5px/1.6 var(--font-mono);color:var(--accent-ink);word-break:break-all;-webkit-user-select:text;cursor:text}
.pv-url .full svg{flex:none;width:14px;height:14px;margin-top:2px;color:var(--ok)}
/* colour: big swatch + value rows */
.pv-color{display:flex;gap:24px;padding:24px;align-items:center}
.pv-swatch{flex:none;width:168px;min-height:168px;border-radius:14px;position:relative;overflow:hidden;
  background:conic-gradient(rgba(127,127,127,.18) 25%,transparent 0 50%,rgba(127,127,127,.18) 0 75%,transparent 0) 0 0/14px 14px}
.pv-swatch i{position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(127,127,127,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.pv-cv{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.pv-big{font:560 34px/1.1 var(--font-display);letter-spacing:var(--track-display);word-break:break-all;-webkit-user-select:text;font-variant-numeric:tabular-nums;color:var(--text)}
.cv-rows{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
.cv-rows dt,.cv-rows dd{padding:8px 0;border-bottom:1px solid var(--line)}
.cv-rows dt{font:600 12px/18px var(--font-ui);color:var(--faint);padding-right:18px}
.cv-rows dd{margin:0;font:500 12.5px/18px var(--font-mono);color:var(--text);text-align:right;-webkit-user-select:text;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* number */
.pv-num{padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.pv-num .pv-big{font-size:48px;letter-spacing:-.04em;color:var(--text)}
.pv-num .rule{height:4px;border-radius:2px;background:var(--k-number);width:32px}
/* mail */
.pv-mail{display:flex;align-items:center;gap:16px;padding:24px}
.pv-mail .av{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:560 22px/1 var(--font-display);color:#fff;
  background:linear-gradient(150deg,hsl(var(--h) 80% 64%),hsl(var(--h2) 70% 50%));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(0,0,0,.06)}
.pv-mail .who{min-width:0;-webkit-user-select:text;cursor:text}
.pv-mail .lp{font:560 22px/1.2 var(--font-display);letter-spacing:var(--track-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-mail .dm{margin-top:4px;font:500 14px/1.3 var(--font-ui);color:var(--muted)}
/* path: file tile, name, extension, breadcrumb */
.pv-path{padding:24px;display:flex;flex-direction:column;justify-content:center}
.pv-path .hd{display:flex;align-items:center;gap:14px;min-width:0}
.pv-path .ft{--k:var(--k-path);flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:color-mix(in srgb,var(--k) var(--glyph),#000);
  background:linear-gradient(160deg,color-mix(in srgb,var(--k) var(--t-top),var(--card)),color-mix(in srgb,var(--k) var(--t-bot),var(--card)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) var(--tile-ring),transparent)}
.pv-path .ft svg{width:24px;height:24px}
.pv-path .fn{min-width:0;display:flex;align-items:center;gap:8px}
.pv-path .fn b{font:560 21px/1.2 var(--font-display);letter-spacing:var(--track-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-user-select:text}
.pv-path .ext{flex:none;font:650 11px/1 var(--font-ui);color:var(--warn);background:var(--warn-soft);padding:5px 8px;border-radius:var(--r-pill);text-transform:none}
.pv-path .full{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font:12.5px/1.6 var(--font-mono);color:var(--muted);word-break:break-all;-webkit-user-select:text;cursor:text}
/* image: framed, with a dimension badge */
.pv-body.has-img{position:relative;overflow:hidden}
.pv-img{position:absolute;inset:24px 24px 16px;container-type:size;display:flex;align-items:center;justify-content:center;border-radius:16px}
.pv-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:0 0 0 5px var(--pv-card),0 0 0 6px var(--line2),0 18px 40px -14px rgba(20,24,40,.35);background:conic-gradient(var(--chip) 25%,transparent 0 50%,var(--chip) 0 75%,transparent 0) 0 0/16px 16px}
.pv-img .fr{position:relative;display:block;aspect-ratio:var(--ar);width:min(100%,calc(100cqh * var(--ar)));max-height:100%}
.pv-img .fr img{display:block;width:100%;height:100%;object-fit:cover}
.pv-dim{position:absolute;right:10px;bottom:10px;height:24px;padding:0 10px;border-radius:var(--r-pill);display:flex;align-items:center;font:600 11.5px/1 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--text);
  background:color-mix(in srgb,var(--pv-card) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--line2),0 4px 12px -4px rgba(20,24,40,.2)}
textarea{width:100%;height:100%;resize:none;border:0;outline:0;border-radius:16px;padding:18px 20px;background:var(--pv-card);box-shadow:0 0 0 1px var(--accent-line),0 0 0 4px var(--accent-soft);color:var(--text);font:14px/1.65 var(--font-ui);caret-color:var(--accent)}
/* metadata: a small grid of labelled cells, like Repostia's summary */
.pv-meta{margin:0 24px 24px;flex:none;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:1px;border-radius:14px;overflow:hidden;background:var(--pv-card);box-shadow:var(--card-lift)}
.pv-meta div{min-width:0;padding:11px 14px 12px;box-shadow:-1px -1px 0 var(--line)}
.pv-meta dt{font:500 12px/1.1 var(--font-ui);color:var(--muted);margin-bottom:6px}
.pv-meta dd{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:580;line-height:17px;letter-spacing:-.006em;color:var(--text);font-variant-numeric:tabular-nums}
.pv-text.mono,textarea.mono,code,.pv-code ol{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.btn.primary-soft{color:var(--accent-ink);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.btn.primary-soft svg,.btn.primary-soft:hover svg{color:var(--accent-ink)}
.btn.primary-soft:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 1px var(--accent-line)}
/* empty list: a little fan of kind tiles behind the icon */
.empty .fan{position:relative;width:120px;height:74px;margin:0 auto 18px}
.empty .fan .ico{position:absolute;top:14px;width:44px;height:44px;border-radius:13px}
.empty .fan .ico svg{width:20px;height:20px}
.empty .fan .ico:nth-child(1){left:6px;transform:rotate(-12deg)}
.empty .fan .ico:nth-child(2){right:6px;transform:rotate(12deg)}
.empty .fan .ico:nth-child(3){left:34px;top:4px;width:52px;height:52px;border-radius:15px;z-index:1;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) var(--tile-ring),transparent),0 8px 16px -8px rgba(12,12,16,.22)}
.empty .fan .ico:nth-child(3) svg{width:24px;height:24px}
.empty .fan+div{font:650 16px/1.35 var(--font-display);letter-spacing:var(--track-title);color:var(--text);max-width:300px;margin:0 auto}
</style>
</head>
<body>
<div class="app grain" id="app">
  <header>
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5" fill="currentColor" fill-opacity=".14" stroke="none"/><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
    <input id="q" placeholder="Pano geçmişinde ara…" autocomplete="off" spellcheck="false">
    <span class="qhint" aria-hidden="true"><kbd>⌃V</kbd></span>
    <div class="reset" id="reset">Filtreleri Temizle</div>
    <button class="tb" id="theme" type="button"></button>
    <button class="tb" id="closeBtn" type="button" aria-label="Kapat" data-tip="Kapat · Esc"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
  </header>
  <div class="bar">
    <div class="seg" id="kinds"></div>
    <div class="seg time" id="times"></div>
  </div>
  <main>
    <div id="list"></div>
    <div id="preview"></div>
  </main>
  <footer id="foot"></footer>
  <div class="toast" id="toast"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const app = $('#app'), input = $('#q'), listEl = $('#list'), pvEl = $('#preview'), kindsEl = $('#kinds'), timesEl = $('#times'), footEl = $('#foot'), resetEl = $('#reset'), toastEl = $('#toast');
let items = [], thumbs = {}, view = [], sel = 0, q = '', kind = 'all', span = 'any', editing = null;
const nowS = () => Date.now() / 1000;

// Duotone set: 16px grid, 1.6px round stroke; a soft fill (same colour, 20%) sits behind part of each glyph.
const P = (soft, line) => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" fill-opacity=".28" stroke="none">${soft}</g>${line}</svg>`;
const DOT = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="currentColor" stroke="none"/>`;
const ICONS = {
  all:    P('<rect x="9" y="9" width="4.8" height="4.8" rx="1.4"/>', '<rect x="2.2" y="2.2" width="4.8" height="4.8" rx="1.4"/><rect x="9" y="2.2" width="4.8" height="4.8" rx="1.4"/><rect x="2.2" y="9" width="4.8" height="4.8" rx="1.4"/><rect x="9" y="9" width="4.8" height="4.8" rx="1.4"/>'),
  text:   P('<rect x="2" y="3.2" width="12" height="4" rx="2"/>', '<path d="M3.2 5.2h9.6M3.2 9.4h5.4M11.8 7.8v3.8"/>'),
  multi:  P('<rect x="5" y="3" width="6" height="10" rx="1.5"/>', '<path d="M6 3H4.6c-.6 0-1.1.5-1.1 1.1v7.8c0 .6.5 1.1 1.1 1.1H6M10 3h1.4c.6 0 1.1.5 1.1 1.1v7.8c0 .6-.5 1.1-1.1 1.1H10"/>' + DOT(8, 8, 1)),
  link:   P('<g transform="rotate(-40 8 8)"><rect x="1.4" y="5.8" width="8" height="4.4" rx="2.2"/></g>', '<g transform="rotate(-40 8 8)"><rect x="1.4" y="5.8" width="8" height="4.4" rx="2.2"/><rect x="6.6" y="5.8" width="8" height="4.4" rx="2.2"/></g>'),
  mail:   P('<path d="M2.8 5 8 9.2 13.2 5v-.8c0-.6-.5-1-1-1H3.8c-.6 0-1 .4-1 1z"/>', '<rect x="2" y="3.2" width="12" height="9.6" rx="2"/><path d="m2.8 5 5.2 4.2L13.2 5"/>'),
  path:   P('<path d="M2 4.8c0-.9.7-1.6 1.6-1.6h2.3c.4 0 .7.1.9.4l.9 1.1h4.7c.9 0 1.6.7 1.6 1.6v.7H2z"/>', '<path d="M2 4.8c0-.9.7-1.6 1.6-1.6h2.3c.4 0 .7.1.9.4l.9 1.1h4.7c.9 0 1.6.7 1.6 1.6v5.3c0 .9-.7 1.6-1.6 1.6H3.6c-.9 0-1.6-.7-1.6-1.6z"/><path d="M9.4 8 7.2 12"/>'),
  number: P('<path d="M5.68 6h5l-.37 4h-5z"/>', '<path d="M6 2.5 5 13.5M11 2.5 10 13.5M2.8 6h10.4M2.5 10h10.4"/>'),
  color:  P('<path d="M8 2.2S12.6 6.4 12.6 9.5a4.6 4.6 0 0 1-9.2 0C3.4 6.4 8 2.2 8 2.2z"/>', '<path d="M8 2.2S12.6 6.4 12.6 9.5a4.6 4.6 0 0 1-9.2 0C3.4 6.4 8 2.2 8 2.2z"/><path d="M5.9 9.8a2.3 2.3 0 0 0 2 2.2"/>'),
  image:  P('<rect x="2" y="2.6" width="12" height="10.8" rx="2.2"/>', '<rect x="2" y="2.6" width="12" height="10.8" rx="2.2"/><path d="M2.2 11.4 5.8 7.8l2.6 2.6 1.8-1.8 3.6 3.6"/>' + DOT(10.6, 5.8, 1.1)),
  shot:   P('<circle cx="8" cy="8" r="3.3"/>', '<path d="M2.5 5.5v-2c0-.6.4-1 1-1h2M10.5 2.5h2c.6 0 1 .4 1 1v2M13.5 10.5v2c0 .6-.4 1-1 1h-2M5.5 13.5h-2c-.6 0-1-.4-1-1v-2"/>' + DOT(8, 8, 1.5)),
  pinO:   P('<path d="M8 14.2s4.3-3.9 4.3-7.4a4.3 4.3 0 1 0-8.6 0c0 3.5 4.3 7.4 4.3 7.4z"/>', '<path d="M8 14.2s4.3-3.9 4.3-7.4a4.3 4.3 0 1 0-8.6 0c0 3.5 4.3 7.4 4.3 7.4z"/><circle cx="8" cy="6.8" r="1.5"/>'),
  pin:    '<svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 14.2s4.3-3.9 4.3-7.4a4.3 4.3 0 1 0-8.6 0c0 3.5 4.3 7.4 4.3 7.4zM8 8.5a1.7 1.7 0 1 0 0-3.4 1.7 1.7 0 0 0 0 3.4z"/></svg>',
  clip:   P('<rect x="3.5" y="3" width="9" height="11" rx="1.8"/>', '<rect x="3.5" y="3" width="9" height="11" rx="1.8"/><path d="M6.2 3v-.6c0-.5.4-.9.9-.9h1.8c.5 0 .9.4.9.9V3M6 8.2h4M6 10.8h2.6"/>'),
  copy:   P('<rect x="5.6" y="5.6" width="8" height="8" rx="1.8"/>', '<rect x="5.6" y="5.6" width="8" height="8" rx="1.8"/><path d="M10.4 5.6V4.2c0-1-.8-1.7-1.7-1.7H4.2c-1 0-1.7.8-1.7 1.7v4.5c0 1 .8 1.7 1.7 1.7h1.4"/>'),
  paste:  P('<path d="M3 10.6h10v1.8c0 .6-.4 1-1 1H4c-.6 0-1-.4-1-1z"/>', '<path d="M8 2.5v7M5 6.8l3 3 3-3M3 10.8v1.6c0 .6.4 1 1 1h8c.6 0 1-.4 1-1v-1.6"/>'),
  edit:   P('<path d="M3 13l.6-3L10.8 2.8a1.2 1.2 0 0 1 1.7 0l.7.7a1.2 1.2 0 0 1 0 1.7L6 12.4z"/>', '<path d="M10.2 3.2 12.8 5.8M3 13l.6-3L10.8 2.8a1.2 1.2 0 0 1 1.7 0l.7.7a1.2 1.2 0 0 1 0 1.7L6 12.4z"/>'),
  trash:  P('<path d="M4.2 4.6h7.6l-.6 8.2c0 .4-.4.7-.8.7H5.6c-.4 0-.8-.3-.8-.7z"/>', '<path d="M2.8 4.5h10.4M6.3 4.5V3c0-.3.2-.5.5-.5h2.4c.3 0 .5.2.5.5v1.5M4.2 4.5l.6 8.3c0 .4.4.7.8.7h4.8c.4 0 .8-.3.8-.7l.6-8.3"/>'),
  open:   P('<rect x="2" y="5.5" width="8" height="8" rx="1.8"/>', '<path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M11.5 9.5v3c0 .6-.4 1-1 1h-7c-.6 0-1-.4-1-1v-7c0-.6.4-1 1-1h3"/>'),
  check:  P('', '<path d="m3.5 8.5 3 3 6-7"/>'),
  save:   P('', '<path d="m3.5 8.5 3 3 6-7"/>'),
  x:      P('', '<path d="M4 4l8 8M12 4l-8 8"/>'),
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lower = s => String(s || '').toLocaleLowerCase('tr');
const post = m => window.webkit.messageHandlers.clip.postMessage(m);

// Theme switch: sun while the panel is dark (click -> light), moon while it is light (click -> dark).
const SUN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3" fill="currentColor" fill-opacity=".28" stroke="none"/><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8H3M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1"/></svg>', MOON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4z" fill="currentColor" fill-opacity=".28" stroke="none"/><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4z"/></svg>';
const themeBtn = $('#theme'), darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : darkMQ.matches; };
function syncTheme() {
  const d = isDark(), tip = d ? 'Açık Tema' : 'Koyu Tema';
  themeBtn.innerHTML = d ? SUN : MOON; themeBtn.dataset.tip = tip; themeBtn.setAttribute('aria-label', tip);
}
new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
darkMQ.addEventListener('change', syncTheme);
themeBtn.addEventListener('mousedown', e => { e.preventDefault(); post({ action: 'toggleTheme' }); });
$('#closeBtn').addEventListener('mousedown', e => { e.preventDefault(); post({ action: 'close' }); });
syncTheme();

// Filter labels always stay readable: when the pills and the time range do not fit on one row,
// the time range moves to a second row instead of the labels being hidden.
const barEl = document.querySelector('.bar');
function fitBar() {
  barEl.classList.remove('stack');
  if (kindsEl.scrollWidth > kindsEl.clientWidth + 1) barEl.classList.add('stack');
}
new ResizeObserver(fitBar).observe(barEl);

// Strict colour literals only: the value ends up in a style attribute, so nothing else may pass.
const COLOR_RE = /^(#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})|rgba?\(\s*[\d.]+%?\s*(,\s*[\d.]+%?\s*){2,3}\)|hsla?\(\s*[\d.]+(deg)?\s*(,\s*[\d.]+%?\s*){2,3}\))$/i;
const isColor = s => COLOR_RE.test(s) && CSS.supports('color', s);

function classify(it) {
  if (it._c) return it._c;
  let c = it.kind;
  if (c === 'text') {
    const s = it.text.trim();
    if (/^https?:\/\/\S+$/i.test(s)) c = 'link';
    else if (isColor(s)) c = 'color';
    else if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) c = 'mail';
    else if (/^(~|\/)[^\n]*$/.test(s) && s.length < 400) c = 'path';
    else if (/^[-+]?[\d][\d.,\s]*$/.test(s) && s.length < 40) c = 'number';
    else if (it.lines > 1) c = 'multi';
    else c = 'text';
  }
  return (it._c = c);
}
const KIND_LABEL = { text: 'Metin', multi: 'Çok Satırlı Metin', link: 'Bağlantı', color: 'Renk', mail: 'E-Posta', path: 'Dosya Yolu', number: 'Sayı', image: 'Kopyalanan Görsel', shot: 'Ekran Görüntüsü' };

// Kind filters: "all" is the default; clicking the active filter again goes back to it.
const KINDS = [
  { key: 'all',   label: 'Tümü',             icon: 'all',   test: () => true },
  { key: 'text',  label: 'Metin',            icon: 'text',  test: it => it.kind === 'text' && classify(it) !== 'link' },
  { key: 'link',  label: 'Bağlantı',         icon: 'link',  test: it => classify(it) === 'link' },
  { key: 'image', label: 'Görsel',           icon: 'image', test: it => it.kind === 'image' },
  { key: 'shot',  label: 'Ekran Görüntüsü',  icon: 'shot',  test: it => it.kind === 'shot' },
  { key: 'pin',   label: 'Sabitli',          icon: 'pinO',  test: it => it.pinned },
];
const DAY = 864e2;
function day0(t) { const d = new Date(t * 1000); d.setHours(0, 0, 0, 0); return d.getTime() / 1000; }
const SPANS = [
  { key: 'any',   label: 'Her Zaman', test: () => true },
  { key: 'today', label: 'Bugün',     test: it => it.t >= day0(nowS()) },
  { key: 'week',  label: '7 Gün',     test: it => it.t >= day0(nowS()) - 6 * DAY },
  { key: 'month', label: '30 Gün',    test: it => it.t >= day0(nowS()) - 29 * DAY },
];
const isDefault = () => kind === 'all' && span === 'any';

function titleOf(it) {
  const c = classify(it);
  if (c === 'shot') return it.name ? it.name.replace(/\.(png|jpe?g|heic)$/i, '') : 'Ekran Görüntüsü';
  if (c === 'image') return 'Görsel';
  if (c === 'link') return it.text.trim().replace(/^https?:\/\/(www\.)?/i, '');
  const line = it.text.split('\n').find(l => l.trim()) || it.text;
  return line.replace(/\s+/g, ' ').trim().slice(0, 240);
}

const titleTR = s => String(s).split(' ').map(w => w ? w.charAt(0).toLocaleUpperCase('tr') + w.slice(1) : w).join(' ');
function groupOf(it) {
  if (it.t < 1e9) return 'Daha Eski';
  const diff = Math.round((day0(nowS()) - day0(it.t)) / DAY);
  if (diff <= 0) return 'Bugün';
  if (diff === 1) return 'Dün';
  const d = new Date(it.t * 1000);
  if (diff < 7) return titleTR(d.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' }));
  return titleTR(d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }));
}
function timeOf(it) {
  if (it.t < 1e9) return '';
  const s = nowS() - it.t;
  if (s < 60) return 'şimdi';
  if (s < 3600) return Math.floor(s / 60) + ' dk önce';
  return new Date(it.t * 1000).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
}
function fullTime(it) {
  if (it.t < 1e9) return 'Bilinmiyor (eski kayıt)';
  return new Date(it.t * 1000).toLocaleString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function bytes(n) {
  if (!n && n !== 0) return '–';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
}
const num = n => Number(n).toLocaleString('tr-TR');

function tokens(s) { return lower(s).split(/\s+/).filter(Boolean); }
function hay(it) {
  if (it._h) return it._h;
  const k = KIND_LABEL[classify(it)] || '';
  return (it._h = lower([it.text || '', it.name || '', it.app || '', k].join(' ')));
}
function highlight(str, toks) {
  if (!toks.length) return esc(str);
  const l = lower(str), marks = new Array(str.length).fill(false);
  for (const tk of toks) { let i = l.indexOf(tk); while (i >= 0) { for (let j = i; j < i + tk.length; j++) marks[j] = true; i = l.indexOf(tk, i + tk.length); } }
  let out = '', on = false;
  for (let i = 0; i < str.length; i++) {
    if (marks[i] !== on) { out += marks[i] ? '<mark>' : '</mark>'; on = marks[i]; }
    out += esc(str[i]);
  }
  return out + (on ? '</mark>' : '');
}

function icoHTML(it) {
  const c = classify(it);
  if (c === 'image' || c === 'shot') {
    const th = thumbs[it.id];
    return th ? `<div class="ico k-${c}" data-tid="${esc(it.id)}"><img src="${th.u}"></div>` : `<div class="ico shimmer" data-tid="${esc(it.id)}"></div>`;
  }
  if (c === 'color') return `<div class="ico k-color"><div class="sw" style="background:${esc(it.text.trim())}"></div></div>`;
  return `<div class="ico k-${c}">${ICONS[c] || ICONS.text}</div>`;
}
function subOf(it) {
  const c = classify(it), parts = [];
  const t = timeOf(it); if (t) parts.push(t);
  if (c === 'shot' || c === 'image') { const w = it.w || thumbs[it.id]?.w, h = it.h || thumbs[it.id]?.h; if (w) parts.push(`${w}×${h}`); if (c === 'shot') parts.push('Ekran Görüntüsü'); }
  else if (c === 'multi') parts.push(num(it.lines) + ' satır');
  else if (c !== 'text') parts.push(KIND_LABEL[c]);
  if (it.app) parts.push(it.app);
  return parts.join(' · ') || KIND_LABEL[c];
}

// Newest first, always. Legacy entries without a real timestamp sink to the bottom.
function byNewest(a, b) { return (b.t - a.t) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0); }

function matchQ(it, toks) { return toks.every(tk => hay(it).includes(tk)); }

function refresh(keepId) {
  const toks = tokens(q), K = KINDS.find(x => x.key === kind), S = SPANS.find(x => x.key === span);
  view = items.filter(it => K.test(it) && S.test(it) && matchQ(it, toks));
  if (keepId) { const i = view.findIndex(it => it.id === keepId); sel = i >= 0 ? i : Math.min(sel, view.length - 1); }
  else sel = 0;
  sel = Math.max(0, Math.min(sel, view.length - 1));
  if (editing && view[sel]?.id !== editing) editing = null;
  renderFilters(toks); renderList(toks); renderPreview(); renderFooter();
}

function renderFilters(toks) {
  const S = SPANS.find(x => x.key === span), K = KINDS.find(x => x.key === kind);
  kindsEl.innerHTML = KINDS.map(f => {
    const n = items.filter(it => f.test(it) && S.test(it) && matchQ(it, toks)).length;
    return `<div class="f${f.key === kind ? ' on' : ''}${n ? '' : ' zero'}" data-k="${f.key}" title="${f.label}">${ICONS[f.icon]}<span class="lb">${f.label}</span><b>${num(n)}</b></div>`;
  }).join('');
  timesEl.innerHTML = SPANS.map(s => `<div class="t${s.key === span ? ' on' : ''}" data-s="${s.key}">${s.label}</div>`).join('');
  resetEl.classList.toggle('on', !isDefault() || !!q);
  fitBar();
}

function emptyHTML(toks) {
  if (!items.length) return `<div class="empty"><div><div class="fan"><div class="ico k-link">${ICONS.link}</div><div class="ico k-multi">${ICONS.multi}</div><div class="ico k-clip">${ICONS.clip}</div></div><div>Pano Geçmişi Boş</div><div class="hint">Bir şey kopyaladığında burada görünür.</div></div></div>`;
  const all = items.filter(it => matchQ(it, toks)).length;
  if (!isDefault() && all) {
    const K = KINDS.find(x => x.key === kind), S = SPANS.find(x => x.key === span);
    const what = [kind !== 'all' ? `“${K.label}”` : '', span !== 'any' ? `“${S.label}”` : ''].filter(Boolean).join(' + ');
    return `<div class="empty"><div>${ICONS[K.icon]}<div>${what} Filtresinde ${q ? 'Eşleşen ' : ''}Öğe Yok</div><div class="hint">Filtreler kaldırılınca ${num(all)} öğe var.</div><div class="btn" data-act="clear">${ICONS.x}Filtreleri Kaldır</div></div></div>`;
  }
  return `<div class="empty"><div>${ICONS.clip}<div>“${esc(q)}” için Sonuç Yok</div><div class="hint">Farklı bir kelime dene ya da Esc ile aramayı temizle.</div></div></div>`;
}

function renderList(toks) {
  if (!view.length) { listEl.innerHTML = emptyHTML(toks); return; }
  const n = Math.min(view.length, 500), counts = {};
  for (let i = 0; i < n; i++) { const g = groupOf(view[i]); counts[g] = (counts[g] || 0) + 1; }
  let html = '', last = null;
  for (let i = 0; i < n; i++) {
    const it = view[i], g = groupOf(it);
    if (g !== last) { html += `<div class="group">${esc(g)}<span>${num(counts[g])}</span></div>`; last = g; }
    const quick = '';
    html += `<div class="row${i === sel ? ' sel' : ''}" data-i="${i}" style="--i:${i}">${icoHTML(it)}<div class="meta"><div class="ti">${highlight(titleOf(it), toks)}</div><div class="su">${esc(subOf(it))}</div></div><div class="end">${it.pinned ? `<span class="pin">${ICONS.pin}</span>` : ''}${quick}<div class="cp" data-act="copy" title="Kopyala">${ICONS.copy}</div></div></div>`;
  }
  listEl.innerHTML = html;
}

function btn(act, icon, label, key, cls = '') {
  return `<div class="btn ${cls}" data-act="${act}"${key ? ` title="${label} (${key})"` : ''}>${ICONS[icon]}${label}${key && cls === 'primary' ? `<span class="k">${key}</span>` : ''}</div>`;
}

// Kind-specific preview bodies. Values stay selectable text; decoration is CSS only.
const hueOf = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
const hues = s => { const h = hueOf(s); return `--h:${h};--h2:${(h + 28) % 360}`; };
const CHEV_R = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3.8 2.2 2.6 2.8-2.6 2.8"/></svg>';
const LOCK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="7" width="9.6" height="6.6" rx="1.8" fill="currentColor" fill-opacity=".2"/><path d="M5.3 7V5.2a2.7 2.7 0 0 1 5.4 0V7"/></svg>';
function linkHTML(t) {
  let u = null; try { u = new URL(t); } catch (e) {}
  const host = u ? u.hostname.replace(/^www\./, '') : t;
  const segs = u ? (u.pathname + u.search + u.hash).split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } }) : [];
  const crumbs = segs.length ? `<div class="crumbs">${segs.slice(0, 6).map(s => `<span>${esc(s)}</span>`).join(`<i>${CHEV_R}</i>`)}</div>` : '';
  return `<div class="pv-card pv-url"><div class="hd"><div class="htile" style="${hues(host)}">${esc((host.replace(/[^a-z0-9]/gi, '').charAt(0) || '?').toUpperCase())}</div>` +
    `<div class="ht"><div class="host">${esc(host)}</div>${crumbs}</div></div><div class="full">${u && u.protocol === 'https:' ? LOCK : ICONS.link}<span>${esc(t)}</span></div></div>`;
}
function rgbOf(s) {
  const el = document.createElement('i'); el.style.color = s; document.body.appendChild(el);
  const m = getComputedStyle(el).color.match(/[\d.]+/g); el.remove();
  return m ? m.map(Number) : null;
}
function colorHTML(t) {
  const v = rgbOf(t) || [0, 0, 0], [r, g, b] = v, a = v.length > 3 ? v[3] : 1;
  const hx = n => Math.round(n).toString(16).padStart(2, '0');
  const hex = ('#' + hx(r) + hx(g) + hx(b) + (a < 1 ? hx(a * 255) : '')).toUpperCase();
  const R = r / 255, G = g / 255, B = b / 255, mx = Math.max(R, G, B), mn = Math.min(R, G, B), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, sat = 0;
  if (d) { sat = d / (1 - Math.abs(2 * l - 1)); h = mx === R ? ((G - B) / d) % 6 : mx === G ? (B - R) / d + 2 : (R - G) / d + 4; h = (h * 60 + 360) % 360; }
  const A = a < 1 ? ` / ${Math.round(a * 100)}%` : '';
  const rows = [['HEX', hex], ['RGB', `${Math.round(r)} ${Math.round(g)} ${Math.round(b)}${A}`], ['HSL', `${Math.round(h)}° ${Math.round(sat * 100)}% ${Math.round(l * 100)}%${A}`]];
  return `<div class="pv-card pv-color"><div class="pv-swatch"><i style="background:${esc(t)}"></i></div>` +
    `<div class="pv-cv"><div class="pv-big">${esc(t)}</div><dl class="cv-rows">${rows.map(([k, x]) => `<dt>${k}</dt><dd>${esc(x)}</dd>`).join('')}</dl></div></div>`;
}
function mailHTML(t) {
  const at = t.lastIndexOf('@'), lp = t.slice(0, at), dm = t.slice(at);
  return `<div class="pv-card pv-mail"><div class="av" style="${hues(dm)}">${esc((lp.charAt(0) || '?').toLocaleUpperCase('tr'))}</div><div class="who"><div class="lp">${esc(lp)}</div><div class="dm">${esc(dm)}</div></div></div>`;
}
const FILE = P('<path d="M4 2.5h4.6L12 5.9v7.1c0 .3-.2.5-.5.5h-7a.5.5 0 0 1-.5-.5z"/>', '<path d="M4.5 1.8h4.3L12.4 5.4v7.6c0 .6-.5 1.2-1.2 1.2H4.5c-.6 0-1.1-.5-1.1-1.2V3c0-.7.5-1.2 1.1-1.2z"/><path d="M8.6 1.9v2.9c0 .4.3.7.7.7h2.9M5.8 9h4.4M5.8 11.4h2.8"/>');
function pathHTML(t) {
  const parts = t.split('/').filter(Boolean), name = parts.pop() || t, m = name.match(/\.([a-z0-9]{1,8})$/i);
  const crumbs = parts.length ? `<div class="crumbs">${(t.startsWith('/') ? ['/'] : []).concat(parts).slice(-6).map(s => `<span>${esc(s)}</span>`).join(`<i>${CHEV_R}</i>`)}</div>` : '';
  return `<div class="pv-card pv-path"><div class="hd"><div class="ft">${m ? FILE : ICONS.path}</div><div class="ht" style="min-width:0"><div class="fn"><b>${esc(name)}</b>${m ? `<span class="ext">${esc(m[1].toUpperCase())}</span>` : ''}</div>${crumbs}</div></div><div class="full">${esc(t)}</div></div>`;
}
function langOf(t) {
  const s = t.trim();
  if (/^[[{]/.test(s)) { try { JSON.parse(s); return 'JSON'; } catch (e) {} }
  if (/^<(!doctype|html|[a-z][\w-]*[\s>])/i.test(s)) return 'HTML';
  if (/^(select|insert|update|delete|create|with)\s/i.test(s)) return 'SQL';
  if (/\blocal\s+\w+\s*=|\bhs\.\w+|\bthen\b[\s\S]*\bend\b/.test(s)) return 'Lua';
  if (/^(def |class \w+.*:\s*$|from \w+ import|import \w+\s*$)/m.test(s)) return 'Python';
  if (/^(\$ |#!\/|sudo |brew |npm |git |cd |export \w+=)/m.test(s)) return 'Shell';
  if (/\b(const|let|var|function|return)\b|=>|console\.|\bimport .+ from\b/.test(s)) return /\binterface \w+|:\s*(string|number|boolean)\b/.test(s) ? 'TypeScript' : 'JavaScript';
  if (/^[^{}\n]+\{[^}]*:[^}]*\}/m.test(s)) return 'CSS';
  return '';
}
function codeHTML(t) {
  const lang = langOf(t), lines = t.replace(/\n$/, '').split('\n');
  return `<div class="pv-card pv-code">${lang ? `<div class="hd"><span class="lang">${lang}</span></div>` : ''}<ol>${lines.map(l => `<li>${esc(l) || ' '}</li>`).join('')}</ol></div>`;
}

function renderPreview() {
  const it = view[sel];
  if (!it) { pvEl.innerHTML = ''; return; }
  const c = classify(it), meta = [['Tür', KIND_LABEL[c]]], isText = it.kind === 'text';
  let body = '', acts = '';
  if (editing === it.id) {
    acts = btn('save', 'save', 'Kaydet', '⌘S', 'primary') + btn('cancel', 'x', 'Vazgeç', 'Esc');
    pvEl.innerHTML = `<div class="pv-actions">${acts}<span class="sp"></span></div><div class="pv-body"><textarea id="ed" class="${c === 'multi' || c === 'path' ? 'mono' : ''}" spellcheck="false"></textarea></div>`;
    const ed = $('#ed'); ed.value = it.text; ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length);
    return;
  }
  acts = btn('paste', 'paste', 'Yapıştır', '↩', 'primary') + btn('copy', 'copy', 'Kopyala', '⌘C');
  if (isText) acts += btn('edit', 'edit', 'Düzenle', '⌘E');
  if (c === 'link') acts += btn('reveal', 'open', 'Aç', '⌘O');
  if (c === 'image' || c === 'shot') acts += btn('editImage', 'edit', 'Düzenle', '⌘E', 'primary-soft');
  if (c === 'image' || c === 'shot') acts += btn('reveal', 'open', 'Finder', '⌘O');
  acts += '<span class="sp"></span>';
  if (c !== 'shot') acts += btn('pin', it.pinned ? 'pin' : 'pinO', it.pinned ? 'Sabitli' : 'Sabitle', '');
  acts += btn('delete', 'trash', 'Sil', '⌘⌫', 'danger');

  if (c === 'image' || c === 'shot') {
    const th = thumbs[it.id];
    const w = it.w || th?.w, h = it.h || th?.h;
    body = `<div class="pv-img">${!th ? '<div class="ico shimmer" style="width:60%;height:60%"></div>' : w && h ? `<span class="fr" style="--ar:${w / h}"><img src="${th.u}"><span class="pv-dim">${num(w)} × ${num(h)}</span></span>` : `<img src="${th.u}">`}</div>`;
    if (w) meta.push(['Boyut', `${num(w)} × ${num(h)} piksel`]);
    meta.push(['Dosya', bytes(it.size)]);
    if (it.name) meta.push(['Ad', it.name]);
  } else {
    const t = it.text;
    const code = c === 'multi' && /[{};=<>]|^\s{2,}\S/m.test(t);
    if (c === 'color') body = colorHTML(t.trim());
    else if (c === 'link') body = linkHTML(t.trim());
    else if (c === 'mail') body = mailHTML(t.trim());
    else if (c === 'path') body = pathHTML(t.trim());
    else if (c === 'number') body = `<div class="pv-card pv-num"><div class="pv-big">${esc(t.trim())}</div><i class="rule"></i></div>`;
    else if (code) body = codeHTML(t);
    else body = `<div class="pv-card pv-text${c === 'text' && t.length <= 160 ? ' short' : ''}">${esc(t)}</div>`;
    if (it.len > t.length) body += `<div class="pv-more">… ve ${num(it.len - t.length)} karakter daha</div>`;
    meta.push(['Uzunluk', `${num(it.len)} karakter · ${num(it.words)} kelime${it.lines > 1 ? ' · ' + num(it.lines) + ' satır' : ''}`]);
  }
  if (it.app) meta.push(['Kaynak', it.app]);
  meta.push([c === 'shot' ? 'Çekildi' : (it.edited ? 'Güncellendi' : 'Kopyalandı'), fullTime(it)]);
  const cols = meta.length <= 3 ? meta.length : meta.length === 4 ? 2 : 3;
  pvEl.innerHTML = `<div class="pv-actions">${acts}</div><div class="pv-body${c === 'image' || c === 'shot' ? ' has-img' : ''}">${body}</div><dl class="pv-meta" style="--cols:${cols}">${meta.map(([k, v], i) => `<div${i === meta.length - 1 && meta.length % cols ? ` style="grid-column:span ${cols - meta.length % cols + 1}"` : ''}><dt>${esc(k)}</dt><dd title="${esc(v)}">${esc(v)}</dd></div>`).join('')}</dl>`;
}

function renderFooter() {
  const h = editing
    ? ['<span><kbd>⌘S</kbd>Kaydet</span>', '<span><kbd>Esc</kbd>Vazgeç</span>']
    : ['<span><kbd>↩</kbd>Yapıştır</span>', '<span><kbd>⌘C</kbd>Kopyala</span>', '<span><kbd>⇥</kbd>Filtre</span>'];
  footEl.innerHTML = h.join('') + `<span class="sp"></span><span class="cnt"><b>${num(view.length)}</b>Öğe</span>`;
}

function select(i, scroll = true) {
  if (!view.length) return;
  if (editing) editing = null;
  sel = Math.max(0, Math.min(i, view.length - 1));
  listEl.querySelector('.row.sel')?.classList.remove('sel');
  const row = listEl.querySelector(`.row[data-i="${sel}"]`);
  if (row) { row.classList.add('sel'); if (scroll) row.scrollIntoView({ block: 'nearest' }); }
  renderPreview(); renderFooter();
}

let toastTimer, introTimer;
function toast(msg) {
  toastEl.innerHTML = ICONS.check + esc(msg);
  toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1300);
}

function act(a, it = view[sel]) {
  if (!it) return;
  if (a === 'pin' && it.kind === 'shot') return;
  if (a === 'editImage') { if (it.kind === 'shot' || it.kind === 'image') post({ action: 'editImage', id: it.id }); return; }
  if (a === 'reveal' && it.kind === 'text' && classify(it) !== 'link') return;
  if (a === 'edit') { if (it.kind !== 'text') return; if (it.truncated) { toast('Bu metin düzenlemek için çok uzun'); return; } editing = it.id; renderPreview(); renderFooter(); return; }
  if (a === 'cancel') { editing = null; renderPreview(); renderFooter(); input.focus(); return; }
  if (a === 'save') {
    const v = $('#ed')?.value ?? '';
    editing = null;
    if (!v.trim()) { toast('Boş metin kaydedilmez'); renderPreview(); renderFooter(); return; }
    post({ action: 'edit', id: it.id, text: v });
    input.focus();
    return;
  }
  if (a === 'copy') {
    const row = listEl.querySelector(`.row[data-i="${view.indexOf(it)}"]`);
    if (row) { row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 700); }
  }
  post({ action: a, id: it.id });
}

function setKind(k) { kind = (k === kind && k !== 'all') ? 'all' : k; refresh(); listEl.scrollTop = 0; }
function setSpan(s) { span = (s === span && s !== 'any') ? 'any' : s; refresh(); listEl.scrollTop = 0; }
function clearAll() { kind = 'all'; span = 'any'; input.value = q = ''; refresh(); listEl.scrollTop = 0; input.focus(); }

input.addEventListener('input', () => { q = input.value; refresh(); listEl.scrollTop = 0; });
kindsEl.addEventListener('mousedown', e => { const c = e.target.closest('.f'); if (c) { e.preventDefault(); setKind(c.dataset.k); } });
timesEl.addEventListener('mousedown', e => { const c = e.target.closest('.t'); if (c) { e.preventDefault(); setSpan(c.dataset.s); } });
resetEl.addEventListener('mousedown', e => { e.preventDefault(); clearAll(); });
listEl.addEventListener('mousedown', e => {
  const b = e.target.closest('[data-act]');
  if (b && b.dataset.act === 'clear') { e.preventDefault(); return clearAll(); }
  const r = e.target.closest('.row'); if (!r) return;
  e.preventDefault();
  select(+r.dataset.i, false);
  if (b) act(b.dataset.act);
});
listEl.addEventListener('dblclick', e => { if (e.target.closest('.row') && !e.target.closest('.cp')) act('paste'); });
pvEl.addEventListener('mousedown', e => { const b = e.target.closest('.btn[data-act]'); if (b) { e.preventDefault(); act(b.dataset.act); } });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('mousedown', e => { if (!e.target.closest('.pv-text,.full,.pv-big,textarea')) setTimeout(() => { if (!editing) input.focus(); }, 0); });

function hasTextSelection() { const s = window.getSelection(); return s && !s.isCollapsed && !input.contains(s.anchorNode); }

document.addEventListener('keydown', e => {
  const k = e.key, m = e.metaKey;
  if (editing) {
    if (k === 'Escape') act('cancel');
    else if (m && (lower(k) === 's' || k === 'Enter')) act('save');
    else return;
    return e.preventDefault();
  }
  if (k === 'ArrowDown') select(sel + 1);
  else if (k === 'ArrowUp') select(sel - 1);
  else if (k === 'PageDown') select(sel + 8);
  else if (k === 'PageUp') select(sel - 8);
  else if (m && k === 'ArrowUp') select(0);
  else if (k === 'Enter') act(m ? 'copy' : 'paste');
  else if (k === 'Escape') {
    if (q) { input.value = q = ''; refresh(); }
    else if (!isDefault()) clearAll();
    else post({ action: 'close' });
  }
  else if (k === 'Tab') { const i = KINDS.findIndex(f => f.key === kind); kind = KINDS[(i + (e.shiftKey ? -1 : 1) + KINDS.length) % KINDS.length].key; refresh(); listEl.scrollTop = 0; }
  else if (m && lower(k) === 't') { const i = SPANS.findIndex(s => s.key === span); span = SPANS[(i + 1) % SPANS.length].key; refresh(); listEl.scrollTop = 0; }
  else if (m && lower(k) === 'c') { if (hasTextSelection() || (input.selectionStart !== input.selectionEnd)) return; act('copy'); }
  else if (m && lower(k) === 'e') act(view[sel] && view[sel].kind !== 'text' ? 'editImage' : 'edit');
  else if (m && k === 'Backspace') { if (input.value) return; act('delete'); }
  else if (m && lower(k) === 'p') act('pin');
  else if (m && lower(k) === 'o') act('reveal');
  else if (m && /^[1-9]$/.test(k)) act('paste', view[+k - 1]);
  else return;
  e.preventDefault();
});

// Relative times ("3 dk önce") and day groups stay correct while the panel is open.
setInterval(() => { if (app.classList.contains('show') && !editing) refresh(view[sel]?.id); }, 30000);

window.Clip = {
  setItems(data) {
    const keep = data.select || view[sel]?.id;
    items = (Array.isArray(data.items) ? data.items : []).sort(byNewest);
    refresh(keep);
  },
  thumbs(map) {
    Object.assign(thumbs, map);
    for (const id in map) {
      document.querySelectorAll(`.ico[data-tid="${CSS.escape(id)}"]`).forEach(el => { el.classList.remove('shimmer'); el.innerHTML = `<img src="${map[id].u}">`; });
    }
    const cur = view[sel];
    if (cur && map[cur.id] && !editing) renderPreview();
  },
  toast,
  open() {
    input.value = q = ''; kind = 'all'; span = 'any'; editing = null;
    refresh();
    listEl.scrollTop = 0;
    app.classList.remove('show');
    app.classList.add('intro'); clearTimeout(introTimer); introTimer = setTimeout(() => app.classList.remove('intro'), 700);
    requestAnimationFrame(() => app.classList.add('show'));
    input.focus();
  },
  close() { app.classList.remove('show'); editing = null; },
};
window.Panel = window.Clip;
post({ action: 'ready' });
</script>
</body>
</html>
