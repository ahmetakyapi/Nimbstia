<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
body{font:13px/1.45 var(--font-ui);color:var(--text);-webkit-user-select:none;cursor:default;padding:10px}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default;text-align:inherit}
button:focus{outline:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px}

/* ---------------------------------------------------------------- window */
.app{position:relative;display:flex;flex-direction:column;max-height:980px;border-radius:22px;background:var(--app-bg);box-shadow:var(--shadow);overflow:hidden;outline:0;
  opacity:0;transform:translateY(-6px) scale(.985);transform-origin:top right;transition:opacity .16s ease,transform .34s var(--ease-out)}
.app::before{content:"";position:absolute;inset:0 0 auto 0;height:220px;background:var(--wash);pointer-events:none}
.app.show{opacity:1;transform:none}
.app:focus,.app:focus-visible{outline:0;box-shadow:var(--shadow)}
.scroll{position:relative;overflow-y:auto;overflow-x:hidden;padding:0 12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.scroll::after{content:"";flex:none;height:2px}
.app.show .scroll > *{animation:nb-rise .45s var(--ease-out) both}
.app.show .scroll > :nth-child(2){animation-delay:.035s}.app.show .scroll > :nth-child(3){animation-delay:.07s}
.app.show .scroll > :nth-child(4){animation-delay:.105s}.app.show .scroll > :nth-child(5){animation-delay:.14s}
.app.show .scroll > :nth-child(6){animation-delay:.175s}.app.show .scroll > :nth-child(n+7){animation-delay:.21s}
.scroll.still > *{animation:none!important}

/* ---------------------------------------------------------------- header */
.head{display:flex;align-items:center;gap:11px;padding:16px 4px 2px 4px;flex:none}
.mark{width:34px;height:34px;flex:none;filter:drop-shadow(0 3px 6px rgba(37,70,255,.28))}
.ht{display:flex;flex-direction:column;gap:3px;min-width:0}
.ht b{font:700 16px/1.05 var(--font-display);letter-spacing:-.02em}
.ht small{font-size:12px;font-weight:500;color:var(--faint);white-space:nowrap}
.head .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px 0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap;color:var(--ok);background:color-mix(in srgb,var(--ok-bar) 13%,transparent)}
.pill i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--ok-bar)}
.pill.ok i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--ok-bar);animation:ping 2.4s var(--ease-out) infinite}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn-bar) 16%,transparent)} .pill.warn i{background:var(--warn-bar)}
.pill.bad{color:var(--danger);background:color-mix(in srgb,var(--bad-bar) 14%,transparent)} .pill.bad i{background:var(--bad-bar)}
@keyframes ping{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(1.7);opacity:0}}

/* icon buttons + tooltips */
.ib{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background var(--dur-1),color var(--dur-1),transform var(--dur-1) var(--ease-out)}
.ib svg{width:16px;height:16px}
.ib:hover{background:var(--hover);color:var(--text)}
.ib:active{transform:scale(.92)}
.ib.ring{box-shadow:inset 0 0 0 1px var(--line2);background:var(--card)}
.ib[data-act="close"]:hover{color:#fff;background:var(--bad-bar)}
.ib[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);right:0;z-index:80;white-space:nowrap;background:var(--ink);color:var(--on-ink);font:500 11.5px/1 var(--font-ui);padding:7px 10px;border-radius:9px;pointer-events:none;box-shadow:var(--pop-shadow);animation:nb-rise .16s var(--ease-out)}

/* error banner */
.banner{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:14px;background:color-mix(in srgb,var(--bad-bar) 11%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad-bar) 30%,transparent);color:var(--danger);font-size:13px;font-weight:600;flex:none}
.banner svg{width:16px;height:16px}
.banner .go{margin-left:auto;font-size:12px;font-weight:600;opacity:.85}
.banner:hover{background:color-mix(in srgb,var(--bad-bar) 16%,var(--card))}

/* ---------------------------------------------------------------- widgets */
.w{position:relative;border-radius:20px;background:var(--card);box-shadow:var(--card-lift);padding:14px;overflow:hidden;min-width:0}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wrow.one{grid-template-columns:1fr}
.wh{display:flex;align-items:center;gap:8px;min-height:22px;margin-bottom:12px}
.wh .wi{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;background:var(--wc,var(--accent))}
.wh .wi svg{width:13px;height:13px}
.wh b{font-size:13px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.wh .sp{flex:1}
.wh .meta{font-size:11.5px;font-weight:500;color:var(--faint);white-space:nowrap}

/* connection: neutral card, colour only in the status chip and the icon */
.w.vpn{display:flex;flex-direction:column;--vc:var(--faint)}
.w.vpn.ok{--vc:var(--ok-bar)} .w.vpn.warn{--vc:var(--warn-bar)} .w.vpn.bad{--vc:var(--bad-bar)}
.w.vpn .wh .wi{background:color-mix(in srgb,var(--vc) 16%,transparent);color:var(--vc)}
.w.vpn .ib{width:26px;height:26px}
.w.vpn .ib svg{width:13px;height:13px}
.w.vpn .ib[data-tip]:hover::after{right:-4px}
.vt{font:700 17px/1.2 var(--font-display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh{margin-top:3px;font:450 11.5px/1 var(--font-mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.vchip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 9px;border-radius:var(--r-pill);font-size:12px;font-weight:650;color:color-mix(in srgb,var(--vc) 70%,var(--text));background:color-mix(in srgb,var(--vc) 13%,transparent)}
.vchip em{font-style:normal;font-weight:550;opacity:.75;margin-left:2px;font-variant-numeric:tabular-nums}
.vchip i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--vc)}
.w.vpn.ok .vchip i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--vc);animation:ping 2.4s var(--ease-out) infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(1.7);opacity:0}}
.vs .lat{display:inline-flex;align-items:flex-end;gap:6px;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.sig i{width:3px;border-radius:1.5px;background:var(--line2)}
.sig i.on{background:var(--vc)}
.vbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:34px;margin-top:14px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--text);background:color-mix(in srgb,var(--text) 6%,var(--card));transition:background var(--dur-1),color var(--dur-1),transform var(--dur-1) var(--ease-out)}
.vbtn:hover{background:color-mix(in srgb,var(--bad-bar) 12%,transparent);color:var(--danger)}
.vbtn:active{transform:scale(.97)}
.vbtn svg{width:13px;height:13px}
.vbtn.solid{color:var(--on-primary);background:var(--primary);box-shadow:var(--primary-shadow)}
.vbtn.solid:hover{color:var(--on-primary);background:var(--primary);filter:brightness(1.05)}
.vbtn[disabled]{opacity:.7}

/* Claude usage */
.w.claude{display:flex;flex-direction:column;--wc:rgba(217,119,87,.16)}
.w.claude .wh .wi{color:#d97757}
.w.claude .plan{font-size:11px;font-weight:650;color:var(--muted);padding:3px 8px;border-radius:var(--r-pill);background:var(--chip)}
.big{display:flex;align-items:baseline;gap:2px;font:720 38px/.95 var(--font-display);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.big small{font-size:18px;font-weight:650;letter-spacing:-.02em;color:var(--faint)}
.bl{margin-top:5px;font-size:12px;font-weight:550;color:var(--muted)}
.meter{height:8px;margin-top:12px;border-radius:5px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#f0a183,#d97757);transform-origin:left;animation:grow .8s var(--ease-out) both .12s}
.meter.warn i{background:linear-gradient(90deg,#fcd34d,#f59e0b)} .meter.bad i{background:linear-gradient(90deg,#fda4af,#f43f5e)}
@keyframes grow{from{transform:scaleX(0)}}
.rs{margin-top:8px;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lim2{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--faint)}
.lim2 .mini{flex:1;height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.lim2 .mini i{display:block;height:100%;border-radius:2px;background:var(--muted);opacity:.6}
.lim2 b{font-size:11.5px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.today{margin-top:8px;align-self:flex-start;font-size:11.5px;font-weight:650;color:var(--accent-ink);padding:3px 9px;border-radius:var(--r-pill);background:var(--accent-soft)}
.slink{display:flex;align-items:center;gap:8px;margin:auto -6px -6px;padding:8px 6px 6px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--text);transition:background var(--dur-1)}
.w.claude .slink{margin-top:12px}
.slink:hover{background:var(--hover)}
.slink .sp{flex:1}
.slink small{font-size:11.5px;font-weight:550;color:var(--ok)}
.slink svg{width:12px;height:12px;color:var(--faint);transition:transform var(--dur-2) var(--ease-out)}
.slink:hover svg{transform:translateX(3px)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.sdot.b{background:var(--ok-bar);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok-bar) 20%,transparent)}
.vago{margin-top:10px;font-size:11.5px;color:var(--faint)}

/* tools: glossy app icons */
.tw{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:2px;margin:-4px -6px -6px}
.ti{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;padding:6px 2px 14px;border-radius:14px;transition:background var(--dur-1)}
.ti:hover{background:var(--hover)}
.ti .ico{position:relative;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin-bottom:8px;color:var(--k);
  background:linear-gradient(180deg,color-mix(in srgb,var(--k) 10%,var(--card)),color-mix(in srgb,var(--k) 16%,var(--card)));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 20%,transparent),0 1px 2px rgba(20,24,40,.06);
  transition:transform var(--dur-2) var(--ease-spring),box-shadow var(--dur-2)}
.ti .ico svg{position:relative;width:23px;height:23px}
.ti:hover .ico{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 34%,transparent),0 6px 14px -6px color-mix(in srgb,var(--k) 50%,transparent)}
.ti:hover .ico{transform:translateY(-2px) scale(1.03)}
.ti:active .ico{transform:scale(.95)}
.ti .nm{font-size:12.5px;font-weight:650;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .wt{font-size:11.5px;color:var(--faint);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ti .ky{margin-top:auto;position:relative;top:6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;white-space:nowrap;padding:2px 7px;border-radius:6px;background:var(--chip)}

/* quick toggles: Control Center */
.rw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rt{display:flex;align-items:center;gap:11px;padding:10px 12px 10px 10px;border-radius:16px;text-align:left;background:var(--chip);transition:background var(--dur-2),box-shadow var(--dur-2)}
.rt:hover{background:color-mix(in srgb,var(--chip) 70%,var(--hover))}
.rt .rc{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--card);box-shadow:0 1px 2px rgba(20,24,40,.08);transition:background var(--dur-2),color var(--dur-2),transform var(--dur-2) var(--ease-spring)}
.rt > span:last-child{min-width:0}
.rt .rc svg{width:18px;height:18px}
.rt:active .rc{transform:scale(.92)}
.rt .rn{display:block;font-size:13px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rt small{display:block;margin-top:2px;font-size:11.5px;font-weight:550;color:var(--faint)}
.rt.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--line2),0 1px 3px rgba(20,24,40,.06)}
.rt.on .rc{color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--q) 75%,#fff),var(--q));box-shadow:0 4px 12px -3px color-mix(in srgb,var(--q) 60%,transparent)}
.rt.on small{color:color-mix(in srgb,var(--q) 70%,var(--text))}
/* dev servers */
.w.ports .wh .wi{background:var(--chip);color:var(--muted)}
.pl{display:flex;flex-direction:column;margin:-4px -6px -6px}
.pr{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 8px;border-radius:12px;transition:background var(--dur-1)}
.pr:hover{background:var(--hover)}
.pr + .pr{box-shadow:0 -1px 0 var(--line)}
.pd{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ok-bar);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok-bar) 18%,transparent)}
.pp{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px;padding:7px 4px}
.pp b{flex:none;font:650 13.5px/1 var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pp small{min-width:0;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .ib{opacity:.75}
.pr:hover .ib{opacity:1}
.pr .ib.stop:hover{color:#fff;background:var(--bad-bar)}
.pr .ib[data-tip]:hover::after{top:auto;bottom:calc(100% + 6px)}
.meets{margin:12px 0 0;padding:8px 0 0;border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:10px;width:calc(100% + 16px);margin:0 -8px;padding:0 8px;height:32px;border-radius:9px;font-size:13px}
.mrow.link:hover{background:var(--hover)}
.mrow time{font-size:12px;font-weight:650;color:var(--accent-ink);flex:none;min-width:40px;font-variant-numeric:tabular-nums}
.mrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{font-size:12px;color:var(--faint);padding:8px 0 0}

/* system: ring gauges */
.sw4{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.sc{display:flex;align-items:center;gap:10px;min-width:0;padding:6px;margin:-4px;border-radius:14px;text-align:left;transition:background var(--dur-1)}
.sc:hover{background:var(--hover)}
.gauge{position:relative;flex:none;width:44px;height:44px}
.gauge svg{width:44px;height:44px;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:5;stroke-linecap:round}
.gauge .trk{stroke:color-mix(in srgb,var(--s) 16%,transparent)}
.gauge .val{stroke:var(--s);animation:dash .9s var(--ease-out) both .15s}
@keyframes dash{from{stroke-dasharray:0 200}}
.gauge .gi{position:absolute;inset:0;display:grid;place-items:center;color:var(--s)}
.gauge .gi svg{width:16px;height:16px;transform:none}
.sx{display:flex;flex-direction:column;gap:3px;min-width:0}
.sx b{font:700 17px/1 var(--font-display);letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sx b em{font-style:normal;font-size:12px;font-weight:600;color:var(--faint);margin-left:1px}
.sx small{font-size:11.5px;font-weight:550;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc.alert{--s:var(--bad-bar)!important} .sc.alert b{color:var(--danger)}

/* ---------------------------------------------------------------- footer */
.foot{flex:none;display:flex;align-items:center;gap:4px;padding:10px 12px 12px}
.foot .sp{flex:1}
.fb{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:11px;font-size:12.5px;font-weight:550;color:var(--muted);transition:background var(--dur-1),color var(--dur-1)}
.fb:hover{color:var(--text);background:var(--hover)}
.fb svg{width:15px;height:15px}
.fb.ring{background:var(--card);box-shadow:var(--card-lift);color:var(--text)}
.fb.wide{width:100%;justify-content:center;height:40px;background:var(--card);box-shadow:var(--card-lift);color:var(--text)}

/* ---------------------------------------------------------------- sub views */
.vhead{display:flex;align-items:center;gap:12px;padding:16px 2px 4px}
.vht{display:flex;flex-direction:column;gap:4px;min-width:0}
.vhead h2{margin:0;font:700 18px/1.1 var(--font-display);letter-spacing:-.025em}
.vht small{font-size:12px;color:var(--faint)}
.card{flex:none;background:var(--card);border-radius:18px;box-shadow:var(--card-lift);padding:6px 14px}
.krow{display:flex;align-items:center;gap:10px;min-height:40px;font-size:13px;border-top:1px solid var(--line)}
.krow:first-child{border-top:0}
.krow span{flex:1;min-width:0}
.kbds{display:inline-flex;gap:3px;flex:none}
.empty{color:var(--faint);font-size:13px;padding:14px 0}
.ss-list{padding:4px}
.ss{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;text-align:left}
.ss + .ss{box-shadow:0 -1px 0 var(--line)}
button.ss:hover{background:var(--hover);box-shadow:none}
.ss-av{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(145deg,#cbd5e1,#94a3b8)}
.ss-av.b{background:linear-gradient(145deg,#e8906f,#d97757)}
.ss-tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ss-tx b{font-size:13.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-tx small{font:450 11.5px/1.2 var(--font-mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-st{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:5px 10px;border-radius:var(--r-pill);color:var(--muted);background:var(--chip)}
.ss-st.b{color:var(--ok);background:color-mix(in srgb,var(--ok-bar) 14%,transparent)}
.ss-st.b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok-bar)}
.ss .go{flex:none;width:14px;height:14px;color:var(--faint);transition:transform var(--dur-2) var(--ease-out)}
button.ss:hover .go{color:var(--text);transform:translate(2px,-2px)}
.msum{display:flex;align-items:baseline;gap:8px;padding:12px 0}
.msum b{font:720 28px/1 var(--font-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.msum span{font-size:12.5px;color:var(--faint)}
.mbar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden;margin-bottom:10px}
.mbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#60a5fa,#2563ff);transform-origin:left;animation:grow .7s var(--ease-out) both}
.prc{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 64px 56px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.pb i{display:block;height:100%;border-radius:3px;background:var(--accent);transform-origin:left;animation:grow .6s var(--ease-out) both}
.pm{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.pc2{font-size:11.5px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}

/* ---- premium pass: material, rings, ripple */
.app{background:radial-gradient(70% 45% at 0% 0%,color-mix(in srgb,#5b8cff 14%,transparent),transparent 70%),radial-gradient(60% 40% at 100% 0%,color-mix(in srgb,#f472b6 10%,transparent),transparent 70%),radial-gradient(80% 40% at 50% 100%,color-mix(in srgb,#a78bfa 9%,transparent),transparent 70%),var(--app-bg)}
.app::before{display:none}
.app::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background-image:var(--grain);background-size:160px;opacity:var(--grain-op);mix-blend-mode:overlay}
.w{border-radius:22px;box-shadow:0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.85),0 1px 2px rgba(20,24,40,.04),0 10px 28px -14px rgba(20,24,40,.22);transition:box-shadow var(--dur-2),transform var(--dur-2) var(--ease-out)}
:root[data-theme="dark"] .w{box-shadow:0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.06),0 12px 30px -14px rgba(0,0,0,.6)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .w{box-shadow:0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.06),0 12px 30px -14px rgba(0,0,0,.6)}}
.w > *{position:relative;z-index:1}
/* connection ripple: a quiet radar that says "live" */
.w.vpn .ripple{position:absolute;z-index:0;right:-44px;top:58px;width:140px;height:140px;pointer-events:none;opacity:.9}
.ripple i{position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--vc) 32%,transparent);background:radial-gradient(circle,color-mix(in srgb,var(--vc) 7%,transparent),transparent 70%)}
.ripple i:nth-child(2){inset:20px;border-color:color-mix(in srgb,var(--vc) 40%,transparent)}
.ripple i:nth-child(3){inset:40px;border-color:color-mix(in srgb,var(--vc) 50%,transparent);background:color-mix(in srgb,var(--vc) 10%,transparent)}
.ripple b{position:absolute;inset:40px;padding-right:0;display:grid;place-items:center;color:var(--vc)}
.ripple b svg{width:24px;height:24px}
.w.vpn.ok .ripple i{animation:radar 3.6s var(--ease-out) infinite}
.w.vpn.ok .ripple i:nth-child(2){animation-delay:.25s}.w.vpn.ok .ripple i:nth-child(3){animation-delay:.5s}
@keyframes radar{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.55}}
/* Claude rings */
.ring2{display:flex;align-items:center;gap:12px;margin-top:2px}
.rgw{position:relative;flex:none;width:88px;height:88px}
.rg{width:88px;height:88px;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:10;stroke-linecap:round}
.rg .t1{stroke:color-mix(in srgb,#d9623f 14%,transparent)} .rg .t2{stroke:color-mix(in srgb,#ef9a1a 14%,transparent)}
.rg .v1{stroke:url(#r1);animation:dash 1s var(--ease-out) both .1s} .rg .v2{stroke:url(#r2);animation:dash 1s var(--ease-out) both .22s}
.rv{position:absolute;inset:0;display:grid;place-items:center;color:#d9623f}
.rv svg{width:20px;height:20px}
.rv small{font-size:11px;font-weight:650;color:var(--faint);margin-left:1px;letter-spacing:0}
.rv.warn b{color:var(--warn)} .rv.bad b{color:var(--danger)}
.lg{display:flex;flex-direction:column;gap:9px;min-width:0;flex:1}
.lg div{display:grid;grid-template-columns:8px 1fr;column-gap:7px;row-gap:1px;align-items:center}
.lg i{width:8px;height:8px;border-radius:50%}
.lg i.c1{background:linear-gradient(145deg,#f7b195,#d9623f)} .lg i.c2{background:linear-gradient(145deg,#fcd581,#ef9a1a)}
.lg span{font-size:11.5px;font-weight:550;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{grid-column:2;font:700 15px/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.w.claude .rs{margin-top:10px}
/* glassier app tiles */
.ti .ico{background:linear-gradient(180deg,color-mix(in srgb,var(--k) 7%,#fff),color-mix(in srgb,var(--k) 17%,#fff));box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px color-mix(in srgb,var(--k) 20%,transparent),0 5px 12px -6px color-mix(in srgb,var(--k) 55%,transparent)}
:root[data-theme="dark"] .ti .ico{background:linear-gradient(180deg,color-mix(in srgb,var(--k) 22%,#2a2b30),color-mix(in srgb,var(--k) 12%,#26272c));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px color-mix(in srgb,var(--k) 30%,transparent),0 6px 14px -6px color-mix(in srgb,var(--k) 40%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ti .ico{background:linear-gradient(180deg,color-mix(in srgb,var(--k) 22%,#2a2b30),color-mix(in srgb,var(--k) 12%,#26272c));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px color-mix(in srgb,var(--k) 30%,transparent),0 6px 14px -6px color-mix(in srgb,var(--k) 40%,transparent)}}
</style>
</head>
<body>
<div class="app" id="app" tabindex="-1">
  <div class="scroll" id="scroll"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const app = document.getElementById('app'), scrollEl = document.getElementById('scroll'), footEl = document.getElementById('foot');
const post = m => { try { window.webkit.messageHandlers.pulse.postMessage(m); } catch (e) {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Duotone set: 16px grid, 1.6px round stroke, soft fill (28%) behind part of each glyph.
const P = (soft, line) => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" fill-opacity=".28" stroke="none">${soft}</g>${line}</svg>`;
const DOT = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="currentColor" stroke="none"/>`;
const ICONS = {
  bat:    P('<rect x="2" y="5" width="7" height="6" rx="1"/>', '<rect x="1.8" y="4.5" width="11" height="7" rx="2"/><path d="M14.4 7v2"/>'),
  memo:   P('<rect x="4.5" y="4.5" width="7" height="7" rx="1.2"/>', '<rect x="3" y="3" width="10" height="10" rx="2"/><path d="M6 1.5V3M10 1.5V3M6 13v1.5M10 13v1.5M1.5 6H3M1.5 10H3M13 6h1.5M13 10h1.5"/>'),
  disk:   P('<ellipse cx="8" cy="4.5" rx="5" ry="2"/>', '<ellipse cx="8" cy="4.5" rx="5" ry="2"/><path d="M3 4.5v7c0 1.1 2.2 2 5 2s5-.9 5-2v-7M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>'),
  box:    P('<path d="M8 2.2 13.5 5v6L8 13.8 2.5 11V5z"/>', '<path d="M8 2.2 13.5 5v6L8 13.8 2.5 11V5z"/><path d="M2.5 5 8 7.8 13.5 5M8 7.8v6"/>'),
  cup:    P('<path d="M3 6.2h7.8v3.3a3.9 3.9 0 0 1-7.8 0z"/>', '<path d="M3 6.2h7.8v3.3a3.9 3.9 0 0 1-7.8 0z"/><path d="M10.8 7.2h.9a1.9 1.9 0 0 1 0 3.8h-1.1M5.4 2.4v1.6M8.4 2.4v1.6"/>'),
  mic:    P('<rect x="5.6" y="1.8" width="4.8" height="8" rx="2.4"/>', '<rect x="5.6" y="1.8" width="4.8" height="8" rx="2.4"/><path d="M3.4 7.8a4.6 4.6 0 0 0 9.2 0M8 12.4v1.8"/>'),
  cal:    P('<rect x="2.5" y="3.5" width="11" height="10" rx="2"/>', '<rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/>'),
  clip:   P('<rect x="3.5" y="3" width="9" height="11" rx="1.8"/>', '<rect x="3.5" y="3" width="9" height="11" rx="1.8"/><path d="M6.2 3v-.6c0-.5.4-.9.9-.9h1.8c.5 0 .9.4.9.9V3"/><path d="M9.6 14v-2.2c0-.4.3-.7.7-.7h2.2"/>'),
  shot:   P('<circle cx="8" cy="8" r="3.3"/>', '<path d="M2.5 5.5v-2c0-.6.4-1 1-1h2M10.5 2.5h2c.6 0 1 .4 1 1v2M13.5 10.5v2c0 .6-.4 1-1 1h-2M5.5 13.5h-2c-.6 0-1-.4-1-1v-2"/>' + DOT(8, 8, 1.5)),
  layout: P('<rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/>', '<rect x="2.5" y="2.5" width="4.8" height="11" rx="1.4"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/>'),
  repo:   P('<circle cx="4.5" cy="12" r="1.9"/>', '<circle cx="4.5" cy="3.8" r="1.7"/><circle cx="11.5" cy="6.2" r="1.7"/><circle cx="4.5" cy="12" r="1.9" fill="currentColor"/><path d="M4.5 5.5v4.6M11.5 7.9c0 2-2.6 2.2-5.2 3.4"/>'),
  text:   P('<rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1.6"/>', '<path d="M2.5 5.5v-2c0-.6.4-1 1-1h2M10.5 2.5h2c.6 0 1 .4 1 1v2M13.5 10.5v2c0 .6-.4 1-1 1h-2M5.5 13.5h-2c-.6 0-1-.4-1-1v-2"/><path d="M6.2 6h3.6M8 6v4.2"/>'),
  refresh:P('', '<path d="M13.2 8A5.2 5.2 0 1 1 11.6 4.3"/><path d="M13.3 2.4v2.6h-2.6"/>'),
  shield: P('<path d="M8 2 3.4 3.8v3.7c0 3 2 5 4.6 6.2 2.6-1.2 4.6-3.2 4.6-6.2V3.8z"/>', '<path d="M8 2 3.4 3.8v3.7c0 3 2 5 4.6 6.2 2.6-1.2 4.6-3.2 4.6-6.2V3.8z"/>'),
  play:   P('<path d="M5.6 3.8v8.4L12.4 8z"/>', '<path d="M5.6 3.8v8.4L12.4 8z"/>'),
  keys:   P('<rect x="1.8" y="3.8" width="12.4" height="8.4" rx="2"/>', '<rect x="1.8" y="3.8" width="12.4" height="8.4" rx="2"/><path d="M4.6 6.6h.01M7 6.6h.01M9.4 6.6h.01M11.6 6.6h.01M5 9.4h6"/>'),
  term:   P('<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/>', '<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><path d="m4.8 6.4 2 1.7-2 1.7M8.4 10h2.8"/>'),
  reload: P('', '<path d="M13.2 8A5.2 5.2 0 1 1 11.6 4.3"/><path d="M13.3 2.4v2.6h-2.6"/>'),
  sun:    '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3" fill="currentColor" fill-opacity=".28" stroke="none"/><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8H3M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1"/></svg>',
  moon:   '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4z" fill="currentColor" fill-opacity=".28" stroke="none"/><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4z"/></svg>',
  back:   P('', '<path d="M10 3 5 8l5 5"/>'),
  warn:   P('<path d="M8 2.4 14 13H2z"/>', '<path d="M8 2.4 14 13H2z"/><path d="M8 6.6v2.6"/>' + DOT(8, 11.2, .6)),
};
// App identity colours: each tool keeps the colour people learn it by.
const TOOL_COLOR = { clip: '#3b82f6', shot: '#22c55e', layout: '#8b5cf6', repo: '#f59e0b', text: '#14b8a6' };
ICONS.moonf = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4z" fill="currentColor" fill-opacity=".28"/></svg>';
const TOOL_ICON = { clip: 'clip', shot: 'shot', layout: 'layout', repo: 'repo', text: 'text' };
const W_ICON = {
  spark: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5c.3 2.9 1.6 4.2 4.5 4.5v.5C9.6 6.8 8.3 8.1 8 11h-.5c-.3-2.9-1.6-4.2-4.5-4.5V6c2.9-.3 4.2-1.6 4.5-4.5z" transform="translate(.6 1.6)"/></svg>',
  grid: '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="5" height="5" rx="1.5"/><rect x="9" y="2" width="5" height="5" rx="1.5"/><rect x="2" y="9" width="5" height="5" rx="1.5"/><rect x="9" y="9" width="5" height="5" rx="1.5" opacity=".6"/></svg>',
  toggle: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h6M3 11h3"/><circle cx="11.5" cy="5" r="1.8" fill="currentColor"/><circle cx="8.5" cy="11" r="1.8" fill="currentColor"/><path d="M10.5 11H13"/></svg>',
  chip: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="4" width="8" height="8" rx="2" fill="currentColor" fill-opacity=".35"/><path d="M6.5 2v2M9.5 2v2M6.5 12v2M9.5 12v2M2 6.5h2M2 9.5h2M12 6.5h2M12 9.5h2"/></svg>',
  ext: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5H4a1 1 0 0 0-1 1V12a1 1 0 0 0 1 1h7.5a1 1 0 0 0 1-1v-2"/><path d="M9 3h4v4M13 3 7.5 8.5"/></svg>',
  stop: '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="2"/></svg>',
  play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.2v9.6c0 .5.5.8.9.5l7.2-4.8a.6.6 0 0 0 0-1L5.9 2.7c-.4-.3-.9 0-.9.5z"/></svg>',
};

// Nimbstia mark: two white panes and the diagonal that makes them an N, on a blue-to-violet squircle.
const MARK = `<svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="mk-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b8dff"/><stop offset=".55" stop-color="#2f5cf5"/><stop offset="1" stop-color="#7b3df0"/></linearGradient><radialGradient id="mk-sh" cx=".25" cy=".1" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#mk-bg)"/><path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#mk-sh)"/><line x1="182" y1="170" x2="330" y2="342" stroke="#fff" stroke-width="70" stroke-linecap="round" opacity=".88"/><rect x="141" y="132" width="70" height="248" rx="35" fill="#fff"/><rect x="301" y="132" width="70" height="248" rx="35" fill="#fff"/></svg>`;
const ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
const CHEV = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 4 4-4 4"/></svg>';

let data = {}, view = 'main', sessionsOpen = false, lastView = null, lastHTML = '';

// "⌃⌥P" -> "Ctrl Opt P"
function keyText(s) {
  const NAMES = { '⌃': 'Ctrl', '⌥': 'Opt', '⇧': 'Shift', '⌘': 'Cmd' };
  const out = []; let rest = '';
  for (const ch of Array.from(String(s || ''))) {
    if (NAMES[ch]) { if (rest) { out.push(rest); rest = ''; } out.push(NAMES[ch]); } else rest += ch;
  }
  if (rest) out.push(rest);
  return out.join(' ');
}
function keycaps(s) {
  if (!s) return '';
  const parts = [], mods = '⌃⌥⇧⌘';
  let rest = '';
  for (const ch of Array.from(String(s))) {
    if (mods.includes(ch)) { if (rest) { parts.push(rest); rest = ''; } parts.push(ch); } else rest += ch;
  }
  if (rest) parts.push(rest);
  // Spelled out (Ctrl, Opt, Cmd, Shift): easier to read than the bare symbols.
  const NAMES = { '⌃': 'Ctrl', '⌥': 'Opt', '⇧': 'Shift', '⌘': 'Cmd' };
  return parts.map(p => `<kbd>${esc(NAMES[p] || p)}</kbd>`).join('');
}
// Tool tiles are narrow: one symbol per keycap (⌃ ⇧ P); Inter has the macOS key glyphs.
const keySym = s => { const out = []; let rest = ''; for (const ch of Array.from(String(s || ''))) { if ('⌃⌥⇧⌘'.includes(ch)) { if (rest) { out.push(rest); rest = ''; } out.push(ch); } else rest += ch; } if (rest) out.push(rest); return out.map(p => `<kbd>${esc(p === 'Space' ? '␣' : p)}</kbd>`).join(''); };

const TONE = { ok: 'ok', warn: 'warn', bad: 'bad', down: 'bad' };
function overall() {
  const s = data.status;
  if (s && s.text) return { text: s.text, tone: TONE[s.tone] || 'ok' };
  if (data.health === 'down') return { text: 'Bağlantı Yok', tone: 'bad' };
  if (data.health === 'warn') return { text: 'Dikkat', tone: 'warn' };
  return { text: 'Her Şey Yolunda', tone: 'ok' };
}
// Turkish writes the sign first (%33), English after (33%); i18n.js sets <html lang>.
const pctAfter = () => document.documentElement.lang === 'en';
const limTone = p => p >= 90 ? 'bad' : p >= 70 ? 'warn' : '';
const today = () => { const s = new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' }); return s.charAt(0).toLocaleUpperCase('tr') + s.slice(1); };
// Widget header: small coloured glyph + name, optional right side.
const wh = (icon, label, right, color) => `<div class="wh"><span class="wi"${color ? ` style="--wc:${color}"` : ''}>${icon}</span><b>${label}</b><span class="sp"></span>${right || ''}</div>`;

function renderMain() {
  const d = data, out = [];
  const st = overall();
  out.push(`<div class="head">${MARK}<div class="ht"><b>Nimbstia</b><small>${esc(today())}</small></div><span class="sp"></span><button class="ib flip" data-act="flip" type="button"></button><button class="ib" data-act="close" type="button" aria-label="Kapat" data-tip="Kapat · Esc"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button></div>`);

  const errs = Array.isArray(d.errors) ? d.errors : [];
  if (errs.length) out.push(`<button class="banner" data-act="console">${ICONS.warn}<span>${errs.length} modül yüklenemedi</span><span class="go">Konsol</span></button>`);

  // ---- row 1: connection + Claude
  const row1 = [];
  if (d.dev) {
    const dev = d.dev, tone = TONE[d.health] || '', v = d.vpn;
    // signal bars by latency: 3 under 60 ms, 2 under 150 ms, else 1; none while down
    const ms = typeof dev.ms === 'number' ? dev.ms : null;
    const bars = tone === 'ok' ? (ms == null ? 3 : ms < 60 ? 3 : ms < 150 ? 2 : 1) : 0;
    const sig = `<span class="sig">${[1, 2, 3].map(i => `<i class="${i <= bars ? 'on' : ''}" style="height:${3 + i * 3}px"></i>`).join('')}</span>`;
    const label = v && v.busy ? v.busy : tone === 'ok' ? 'Bağlı' : tone === 'warn' ? 'Yanıt Vermiyor' : tone === 'bad' ? 'Bağlı Değil' : 'Kontrol Ediliyor…';
    const power = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v5.5"/><path d="M4.6 4.4a5 5 0 1 0 6.8 0"/></svg>';
    const action = !v ? '' : v.busy
      ? `<button class="vbtn" type="button" disabled>${esc(v.busy)}</button>`
      : v.connected
        ? `<button class="vbtn" data-act="vpn" data-v="disconnect" type="button">${power}Bağlantıyı Kes</button>`
        : `<button class="vbtn solid" data-act="vpn" data-v="connect" type="button">${power}Bağlan</button>`;
    const tip = 'Yeniden Kontrol Et' + (dev.checkedAgo ? ' · ' + dev.checkedAgo : '');
    row1.push(`<section class="w vpn ${tone}">
      <span class="ripple" aria-hidden="true"><i></i><i></i><i></i><b>${ICONS.shield}</b></span>
      ${wh(ICONS.shield, 'Bağlantı', `<button class="ib" data-act="check" type="button" data-tip="${esc(tip)}" aria-label="Yeniden Kontrol Et">${ICONS.refresh}</button>`)}
      <div class="vt">${esc(dev.title || 'VPN Bağlantısı')}</div>${dev.host ? `<div class="vh">${esc(dev.host)}</div>` : ''}
      <div class="vs"><span class="vchip"><i></i>${esc(label)}${tone === 'ok' && ms != null ? `<em>${ms} ms</em>` : ''}</span></div>
      ${dev.checkedAgo ? `<div class="vago"><span>Son kontrol</span> <span>${esc(dev.checkedAgo)}</span></div>` : ''}
      <span style="flex:1"></span>${action}</section>`);
  }
  if (d.claude) {
    const c = d.claude, lims = Array.isArray(c.limits) ? c.limits : [], lim = lims[0], sess = Array.isArray(c.sessions) ? c.sessions : [];
    const p = lim && typeof lim.percent === 'number' ? Math.max(0, Math.min(100, Math.round(lim.percent))) : null;
    const tone = p == null ? '' : limTone(p);
    const busy = sess.filter(x => x.busy).length;
    // Activity-style concentric rings: outer = first limit (weekly), inner = second (session).
    const short = l => String(l.label || '').replace(/ Limiti?$/, '');
    const pct = l => l && typeof l.percent === 'number' ? Math.max(0, Math.min(100, Math.round(l.percent))) : null;
    const p2 = pct(lims[1]);
    const arc = (r, v) => { const C = 2 * Math.PI * r; return `${(C * Math.max(v || 0, .5) / 100).toFixed(1)} ${C.toFixed(1)}`; };
    const rings = `<svg class="rg" viewBox="0 0 88 88"><defs><linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7b195"/><stop offset="1" stop-color="#d9623f"/></linearGradient><linearGradient id="r2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd581"/><stop offset="1" stop-color="#ef9a1a"/></linearGradient></defs>
      <circle class="t1" cx="44" cy="44" r="38"/><circle class="v1" cx="44" cy="44" r="38" stroke-dasharray="${arc(38, p)}"/>
      ${p2 != null ? `<circle class="t2" cx="44" cy="44" r="27"/><circle class="v2" cx="44" cy="44" r="27" stroke-dasharray="${arc(27, p2)}"/>` : ''}</svg>`;
    const fmtP = v => v == null ? '–' : (pctAfter() ? v + '%' : '%' + v);
    row1.push(`<section class="w claude">
      ${wh(W_ICON.spark, 'Claude', c.plan ? `<span class="plan">${esc(c.plan)}</span>` : '')}
      <div class="ring2"><div class="rgw">${rings}<div class="rv">${W_ICON.spark}</div></div>
        <div class="lg"><div><i class="c1"></i><span>${esc(lim ? short(lim) : 'Kullanım')}</span><b>${fmtP(p)}</b></div>${p2 != null ? `<div><i class="c2"></i><span>${esc(short(lims[1]))}</span><b>${fmtP(p2)}</b></div>` : ''}</div></div>
      ${lim && lim.resets ? `<div class="rs"><span>Sıfırlanma</span> <span>${esc(lim.resets)}</span></div>` : ''}
      ${lim && typeof lim.today === 'number' ? `<div class="today">Bugün +%${lim.today}</div>` : ''}
      ${sess.length ? `<button class="slink" data-act="sessions" type="button"><span class="sdot${busy ? ' b' : ''}"></span><span>${sess.length} oturum</span>${busy ? `<small>${busy} aktif</small>` : ''}<span class="sp"></span>${CHEV}</button>` : ''}
      </section>`);
  }
  if (row1.length) out.push(`<div class="wrow${row1.length === 1 ? ' one' : ''}">${row1.join('')}</div>`);


  // ---- tools: app icons
  const tools = Array.isArray(d.tools) ? d.tools : [];
  if (tools.length) {
    out.push(`<section class="w tools"><div class="tw" style="--n:${Math.min(tools.length, 5)}">` + tools.map(t =>
      `<button class="ti" data-act="tool" data-id="${esc(t.id)}" style="--k:${TOOL_COLOR[t.id] || '#64748b'}" aria-label="${esc(t.name + ' · ' + t.what)}"><span class="ico">${ICONS[TOOL_ICON[t.id]] || ICONS.clip}</span><span class="nm">${esc(t.name)}</span><span class="wt">${esc(t.what)}</span><span class="ky">${esc(Array.from(String(t.keys || '')).join(' ').replace('S p a c e', 'Space'))}</span></button>`).join('') + `</div></section>`);
  }

  // ---- dev servers that are listening right now (status.lua → fetchPorts)
  const ports = Array.isArray(d.ports) ? d.ports : [];
  if (ports.length) {
    out.push(`<section class="w ports">${wh(ICONS.term, 'Geliştirme Sunucuları', `<span class="meta">${ports.length}</span>`)}<div class="pl">` + ports.map(x =>
      `<div class="pr"><span class="pd"></span><button class="pp" data-act="port" data-v="open" data-port="${x.port}" type="button" aria-label="localhost:${x.port}"><b>:${x.port}</b><small>${esc(x.cmd)}${x.folder ? ' · ' + esc(x.folder) : ''}</small></button><button class="ib sm" data-act="port" data-v="open" data-port="${x.port}" type="button" data-tip="Aç" aria-label="Aç">${W_ICON.ext}</button><button class="ib sm stop" data-act="port" data-v="stop" data-port="${x.port}" type="button" data-tip="Durdur" aria-label="Durdur">${W_ICON.stop}</button></div>`).join('') + `</div></section>`);
  }

  // ---- quick toggles
  const tg = d.toggles || {};
  const rt = (id, label, icon, color, states) => `<button class="rt${tg[id] ? ' on' : ''}" role="switch" aria-checked="${tg[id] ? 'true' : 'false'}" data-act="toggle" data-id="${id}" style="--q:${color}"><span class="rc">${ICONS[icon]}</span><span><span class="rn">${label}</span><small>${(states || ['Açık', 'Kapalı'])[tg[id] ? 0 : 1]}</small></span></button>`;
  let q = `<section class="w quick"><div class="rw">` +
    rt('awake', 'Uyanık Tut', 'cup', '#f59e0b') + rt('mic', 'Mikrofon', 'mic', '#f43f5e', ['Sessiz', 'Açık']) +
    rt('meetings', 'Toplantılar', 'cal', '#8b5cf6') + rt('appearance', 'Koyu Görünüm', 'moonf', '#6366f1') + `</div>`;
  const meets = Array.isArray(d.meetings) ? d.meetings : [];
  if (tg.meetings && meets.length) {
    q += `<div class="meets">` + meets.slice(0, 3).map(m => {
      const inner = `<time>${esc(m.time)}</time><span>${esc(m.title)}</span>`;
      return m.url ? `<button class="mrow link" data-act="url" data-url="${esc(m.url)}">${inner}</button>` : `<div class="mrow">${inner}</div>`;
    }).join('') + `</div>`;
  }
  if (d.meetErr) q += `<div class="muted">${esc(d.meetErr)}</div>`;
  out.push(q + '</section>');

  // ---- system: ring gauges
  const sy = d.system || {};
  const C = 2 * Math.PI * 19.5;
  const gauge = (id, icon, color, value, unit, label, alert, tip, fill) => `<button class="sc${alert ? ' alert' : ''}" data-act="${id === 'mem' ? 'memory' : 'sys'}" data-id="${id}" type="button" style="--s:${color}" aria-label="${esc(tip)}"><span class="gauge"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="19.5"/><circle class="val" cx="22" cy="22" r="19.5" stroke-dasharray="${(C * Math.max(2, Math.min(100, fill || 0)) / 100).toFixed(1)} ${C.toFixed(1)}"/></svg><span class="gi">${ICONS[icon]}</span></span><span class="sx"><b>${value}<em>${unit}</em></b><small>${label}</small></span></button>`;
  const cols = [];
  if (sy.battery) cols.push(gauge('battery', 'bat', '#22c55e', sy.battery.pct, '%', sy.battery.charging ? 'Şarjda' : 'Pil', sy.battery.pct < 20 && !sy.battery.charging, 'Pil Ayarları', sy.battery.pct));
  if (typeof sy.mem === 'number') cols.push(gauge('mem', 'memo', '#3b82f6', sy.mem, '%', 'Bellek', sy.mem >= 85, 'Neyin ne kadar kullandığını gör', sy.mem));
  if (typeof sy.disk === 'number') cols.push(gauge('disk', 'disk', '#8b5cf6', sy.disk >= 1000 ? (sy.disk / 1000).toFixed(1).replace('.', ',') : sy.disk, sy.disk >= 1000 ? 'TB' : 'GB', 'Boş Disk', sy.disk < 20 || sy.diskUsed >= 90, 'Depolama Ayarları', sy.diskUsed));
  if (cols.length) out.push(`<section class="w sys"><div class="sw4" style="--n:${cols.length}">${cols.join('')}</div></section>`);
  return out.join('');
}

let procs = null;
function renderMemory() {
  const fmt = mb => mb >= 1024 ? (mb / 1024).toFixed(1).replace('.', ',') + ' GB' : Math.round(mb) + ' MB';
  let body;
  if (!procs) body = '<div class="empty">Uygulamalar okunuyor…</div>';
  else if (!procs.list.length) body = '<div class="empty">Okunamadı.</div>';
  else {
    const max = procs.list[0].mb || 1;
    body = procs.list.map((p, i) => `<div class="prc"><span class="pn">${esc(p.name)}</span><span class="pb"><i style="width:${Math.max(3, p.mb / max * 100)}%;animation-delay:${i * 30}ms"></i></span><span class="pm">${fmt(p.mb)}</span>${p.cpu ? `<span class="pc2">%${p.cpu} CPU</span>` : '<span class="pc2"></span>'}</div>`).join('');
  }
  const total = procs && procs.memMB ? `<div class="msum"><b>${fmt(procs.totalMB)}</b><span>/ ${fmt(procs.memMB)}</span></div><div class="mbar"><i style="width:${Math.min(100, procs.totalMB / procs.memMB * 100)}%"></i></div>` : '';
  return `<div class="vhead"><button class="ib ring" data-act="back" aria-label="Geri">${ICONS.back}</button><div class="vht"><h2>Bellek Kullanımı</h2></div></div>
    <section class="card">${total}${body}</section>
    <button class="fb wide" data-act="sys" data-id="activity" type="button">${ICONS.memo}<span>Etkinlik İzleyicisi'nde Aç</span></button>`;
}

function renderSessions() {
  const sess = (data.claude && Array.isArray(data.claude.sessions)) ? data.claude.sessions.slice() : [];
  sess.sort((a, b) => (b.busy ? 1 : 0) - (a.busy ? 1 : 0));
  const busy = sess.filter(x => x.busy).length;
  const ext = '<svg class="go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2.5"/></svg>';
  const rows = sess.map(x => {
    const meta = [x.folder, x.ago].filter(Boolean).map(esc).join(' · ');
    const inner = `<span class="ss-av${x.busy ? ' b' : ''}">${esc(String(x.name || '?').charAt(0).toLocaleUpperCase('tr'))}</span><span class="ss-tx"><b>${esc(x.name)}</b>${meta ? `<small>${meta}</small>` : ''}</span><span class="ss-st${x.busy ? ' b' : ''}">${x.busy ? 'Çalışıyor' : 'Boşta'}</span>${x.url ? ext : ''}`;
    return x.url ? `<button class="ss" data-act="url" data-url="${esc(x.url)}" type="button" title="claude.ai'de aç">${inner}</button>` : `<div class="ss">${inner}</div>`;
  }).join('');
  return `<div class="vhead"><button class="ib ring" data-act="back" aria-label="Geri">${ICONS.back}</button><div class="vht"><h2>Claude Oturumları</h2><small><span>${sess.length} oturum</span> · <span>${busy} aktif</span></small></div></div>
    <section class="card ss-list">${rows || '<div class="empty">Açık oturum yok.</div>'}</section>`;
}

function renderKeys() {
  const list = Array.isArray(data.shortcuts) ? data.shortcuts : [];
  return `<div class="vhead"><button class="ib ring" data-act="back" aria-label="Geri">${ICONS.back}</button><div class="vht"><h2>Kısayollar</h2></div></div>
    <section class="card">${list.length ? list.map(s => `<div class="krow"><span>${esc(s.label)}</span><span class="kbds">${keycaps(s.keys)}</span></div>`).join('') : '<div class="empty">Henüz kısayol yok.</div>'}</section>`;
}

function renderFoot() {
  // Labelled actions: what each one does is written on it (the theme switch lives in the header).
  return `<button class="fb" data-act="keys" type="button">${ICONS.keys}<span>Kısayollar</span></button>
    <button class="fb" data-act="console" type="button">${ICONS.term}<span>Konsol</span></button>
    <span class="sp"></span>
    <button class="fb ring" data-act="reload" type="button">${ICONS.reload}<span>Yeniden Yükle</span></button>`;
}

function applyTheme() {
  const t = data.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

// Theme switch in the header: sun while dark (click -> light), moon while light (click -> dark).
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : darkMQ.matches; };
function syncFlip() {
  const d = isDark(), tip = d ? 'Açık Tema' : 'Koyu Tema';
  document.querySelectorAll('.flip').forEach(b => { b.innerHTML = d ? ICONS.sun : ICONS.moon; b.dataset.tip = tip; b.setAttribute('aria-label', tip); });
}
new MutationObserver(syncFlip).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
darkMQ.addEventListener('change', syncFlip);

function render() {
  const top = scrollEl.scrollTop;
  const html = view === 'keys' ? renderKeys() : view === 'sessions' ? renderSessions() : view === 'memory' ? renderMemory() : renderMain();
  // Live updates that change nothing visible leave the DOM (and a running entrance) alone; a new view
  // plays the entrance, a data change within the same view just swaps in place.
  if (html === lastHTML && lastView === view) return;
  scrollEl.classList.toggle('still', lastView === view);
  lastView = view; lastHTML = html;
  scrollEl.innerHTML = html;
  footEl.innerHTML = renderFoot();
  syncFlip();
  scrollEl.scrollTop = top;
  postSize();
}
let lastH = 0;
function postSize() { const h = Math.ceil(app.offsetHeight) + 20; if (h !== lastH) { lastH = h; post({ action: 'size', h }); } }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'url': if (el.dataset.url) post({ action: 'url', url: el.dataset.url }); break;
    case 'vpn': post({ action: 'vpn', v: el.dataset.v }); break;
    case 'port': post({ action: 'port', v: el.dataset.v, port: +el.dataset.port }); break;
    case 'tool': post({ action: 'tool', id: el.dataset.id }); break;
    case 'toggle': post({ action: 'toggle', id: el.dataset.id }); break;
    case 'theme': post({ action: 'theme', v: el.dataset.v }); break;
    case 'flip': post({ action: 'toggleTheme' }); break;
    case 'close': post({ action: 'close' }); break;
    case 'more': sessionsOpen = !sessionsOpen; render(); break;
    case 'keys': view = 'keys'; scrollEl.scrollTop = 0; render(); break;
    case 'sessions': view = 'sessions'; scrollEl.scrollTop = 0; render(); break;
    case 'memory': view = 'memory'; procs = null; scrollEl.scrollTop = 0; render(); post({ action: 'procs' }); break;
    case 'sys': post({ action: 'sys', id: el.dataset.id }); break;
    case 'back': view = 'main'; render(); break;
    default: post({ action: a });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); if (view !== 'main') { view = 'main'; render(); } else post({ action: 'close' }); }
});

window.Pulse = {
  setProcs(p) { procs = p && Array.isArray(p.list) ? p : { list: [] }; if (view === 'memory') render(); },
  set(d) { data = d || {}; applyTheme(); render(); },
  open() { view = 'main'; lastView = null; lastHTML = ''; render(); app.classList.remove('show'); void app.offsetWidth; requestAnimationFrame(() => app.classList.add('show')); try { app.focus({ preventScroll: true }); } catch (e) {} },
  close() { app.classList.remove('show'); },
};
window.Panel = window.Pulse;
render();
post({ action: 'ready' });
</script>
</body>
</html>
