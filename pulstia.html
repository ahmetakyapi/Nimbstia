<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
body{font:13px/1.45 var(--font-ui);color:var(--text);-webkit-user-select:none;cursor:default;padding:10px}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default;text-align:inherit}
button:focus{outline:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px}

/* window */
.app{position:relative;display:flex;flex-direction:column;max-height:980px;border-radius:20px;background:var(--app-bg);box-shadow:var(--shadow);overflow:hidden;outline:0;opacity:0;transform:translateY(-6px) scale(.99);transform-origin:top right;transition:opacity .16s ease,transform .32s var(--ease-out)}
.app::before{content:"";position:absolute;inset:0 0 auto 0;height:180px;background:var(--wash);pointer-events:none}
.app.show{opacity:1;transform:none}
.app:focus,.app:focus-visible{outline:0;box-shadow:var(--shadow)}
.scroll{position:relative;overflow-y:auto;overflow-x:hidden;padding:0 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.scroll::after{content:"";flex:none;height:2px}
.app.show .scroll > *{animation:nb-rise .42s var(--ease-out) both}
.app.show .scroll > :nth-child(2){animation-delay:.03s}.app.show .scroll > :nth-child(3){animation-delay:.06s}
.app.show .scroll > :nth-child(4){animation-delay:.09s}.app.show .scroll > :nth-child(5){animation-delay:.12s}
.app.show .scroll > :nth-child(6){animation-delay:.15s}.app.show .scroll > :nth-child(n+7){animation-delay:.18s}
.scroll.still > *{animation:none!important}

/* header */
.head{display:flex;align-items:center;gap:10px;padding:16px 4px 0 4px;flex:none}
.mark{width:26px;height:26px;flex:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.18))}
.ht{display:flex;flex-direction:column;gap:4px;min-width:0}
.ht b{font:620 14.5px/1 var(--font-display);letter-spacing:var(--track-title)}
.ht .eyebrow{font-size:9.5px;letter-spacing:.14em}
.head .sp{flex:1}

/* hero line: Shoji-style two-tone statement */
.hero{padding:16px 4px 6px}
.hero h1{margin:0;font:640 23px/1.12 var(--font-display);letter-spacing:-.032em;text-wrap:balance}
.hero h1 span{color:var(--faint);font-weight:560}
.hero .tone{display:inline-block;width:9px;height:9px;margin:0 9px 3px 1px;border-radius:50%;vertical-align:middle;background:var(--ok-bar);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok-bar) 18%,transparent)}
.hero .tone.warn{background:var(--warn-bar);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn-bar) 20%,transparent)}
.hero .tone.bad{background:var(--bad-bar);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad-bar) 18%,transparent)}
.hero .tone.ok{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok-bar) 6%,transparent)}}

/* error banner */
.banner{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bad-bar) 9%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad-bar) 30%,transparent);color:var(--danger);font-size:12.5px;font-weight:600;flex:none}
.banner svg{width:15px;height:15px}
.banner .go{margin-left:auto;font:500 10.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.banner:hover{background:color-mix(in srgb,var(--bad-bar) 14%,var(--card))}

/* icon buttons + tooltips */
.ib{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background var(--dur-1),color var(--dur-1),transform var(--dur-1) var(--ease-out)}
.ib svg{width:15px;height:15px}
.ib:hover{background:var(--hover);color:var(--text)}
.ib:active{transform:scale(.92)}
.ib.sm{width:26px;height:26px}
.ib.sm svg{width:13px;height:13px}
.ib.ring{box-shadow:inset 0 0 0 1px var(--line2)}
.ib[data-act="close"]:hover{color:#fff;background:var(--bad-bar)}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);right:0;z-index:80;white-space:nowrap;background:var(--ink);color:var(--on-ink);font:500 11px/1 var(--font-ui);letter-spacing:0;padding:6px 9px;border-radius:8px;pointer-events:none;box-shadow:var(--pop-shadow);animation:nb-rise .16s var(--ease-out)}
.ti[data-tip]:hover::after,.rt[data-tip]:hover::after,.sc[data-tip]:hover::after,.cc-ago[data-tip]:hover::after{display:none}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 10px;border-radius:var(--r-pill);font:500 10.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--muted);background:var(--card);box-shadow:inset 0 0 0 1px var(--line2)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.pill.ok i{background:var(--ok-bar);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok-bar) 20%,transparent)}
.pill.warn i{background:var(--warn-bar);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn-bar) 22%,transparent)}
.pill.bad{color:var(--danger)} .pill.bad i{background:var(--bad-bar);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad-bar) 20%,transparent)}

/* cards */
.cc{position:relative;border-radius:16px;background:var(--card);box-shadow:var(--card-lift);padding:14px 14px 14px;overflow:hidden}
.cc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc-row.one{grid-template-columns:1fr}
.cc-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:18px;margin-bottom:12px}
.cc-kicker{display:flex;align-items:center;gap:7px;font:500 10px/1 var(--font-mono);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--faint);white-space:nowrap}
.cc-kicker .idx{font-size:10px;letter-spacing:.02em}
.cc-ago{position:relative;font:400 10.5px/1 var(--font-mono);color:var(--faint);white-space:nowrap}
.cc h2{margin:0;font:620 15px/1.15 var(--font-display);letter-spacing:var(--track-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* connection */
.cc.vpn{display:flex;flex-direction:column;--vc:var(--faint)}
.cc.vpn.ok{--vc:var(--ok-bar)} .cc.vpn.warn{--vc:var(--warn-bar)} .cc.vpn.bad{--vc:var(--bad-bar)}
.vtx{display:flex;flex-direction:column;gap:5px;min-width:0}
.hostin{font:400 11px/1 var(--font-mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.vstat{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text)}
.vstat i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--vc)}
.cc.vpn.ok .vstat i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--vc);opacity:0;animation:ping 2.4s var(--ease-out) infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}80%,100%{transform:scale(1.5);opacity:0}}
.vlat{display:inline-flex;align-items:flex-end;gap:6px;font:500 11px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.sig i{width:3px;border-radius:1px;background:var(--line2)}
.sig i.on{background:var(--vc)}
.cc-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:32px;margin-top:12px;border-radius:var(--r-pill);font-size:12.5px;font-weight:560;transition:transform var(--dur-1) var(--ease-out),background var(--dur-1),box-shadow var(--dur-1)}
.cc-btn:active{transform:scale(.97)}
.cc-btn svg{width:13px;height:13px}
.cc-btn.on{color:var(--on-ink);background:var(--ink);box-shadow:var(--ink-shadow)}
.cc-btn.on:hover{background:var(--ink-hover)}
.cc-btn.off{color:var(--danger);box-shadow:inset 0 0 0 1px var(--line2)}
.cc-btn.off:hover{background:color-mix(in srgb,var(--bad-bar) 8%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad-bar) 35%,transparent)}
.cc-btn[disabled]{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}

/* claude */
.cc.claude{display:flex;flex-direction:column}
.big{display:flex;align-items:flex-start;gap:2px;font:600 44px/.9 var(--font-display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.big small{font:500 16px/1 var(--font-display);letter-spacing:-.02em;color:var(--faint);margin-top:4px}
.bigl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.bigl .rs{font:400 10.5px/1 var(--font-mono);color:var(--faint);white-space:nowrap}
.ticks{display:grid;grid-template-columns:repeat(24,1fr);gap:2.5px;height:14px;margin-top:12px}
.ticks i{border-radius:1.5px;background:var(--chip)}
.ticks i.on{background:var(--tc,var(--ink))}
.ticks.warn{--tc:var(--warn-bar)} .ticks.bad{--tc:var(--bad-bar)}
.app.show .ticks i.on{animation:tick .5s var(--ease-out) both}
@keyframes tick{from{transform:scaleY(.2);opacity:0}}
.lim2{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--faint)}
.lim2 b{font:500 11px/1 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.lim2 .mini{flex:1;height:3px;border-radius:2px;background:var(--chip);overflow:hidden}
.lim2 .mini i{display:block;height:100%;background:var(--muted);border-radius:2px}
.cc-today{margin-top:8px;align-self:flex-start;font:500 10.5px/1 var(--font-mono);color:var(--accent-ink);padding:4px 8px;border-radius:var(--r-pill);background:var(--accent-soft)}
.cc-link{margin-top:auto;padding-top:12px;display:inline-flex;align-items:center;gap:7px;align-self:stretch;white-space:nowrap;font-size:12px;font-weight:560;color:var(--text)}
.cc-link .sp{flex:1}
.cc-link svg{width:12px;height:12px;color:var(--faint);transition:transform var(--dur-2) var(--ease-out)}
.cc-link:hover svg{transform:translateX(3px);color:var(--text)}
.cc-link .cnt{font:400 11px/1 var(--font-mono);color:var(--faint)}
.sdots{display:inline-flex;gap:3px}
.sdots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.sdots i.b{background:var(--ok-bar);animation:sd 2s ease-in-out infinite}
.sdots i.b:nth-child(2){animation-delay:.3s}.sdots i.b:nth-child(3){animation-delay:.6s}
@keyframes sd{50%{opacity:.45}}

/* launcher: the one primary action */
.launch{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 7px 0 18px;border-radius:var(--r-pill);background:var(--ink);color:var(--on-ink);box-shadow:var(--ink-shadow);transition:transform var(--dur-1) var(--ease-out),background var(--dur-1)}
.launch:hover{background:var(--ink-hover)}
.launch:active{transform:scale(.985)}
.launch .lt{flex:1;min-width:0;font-size:13px;font-weight:560;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.launch .lk{font:400 10px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.launch .go{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--on-ink);color:var(--ink);transition:transform var(--dur-2) var(--ease-out)}
.launch .go svg{width:13px;height:13px}
.launch:hover .go{transform:translateX(2px)}

/* tools: tactile keycap tiles */
.tw{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:4px}
.ti{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:6px 2px 8px;border-radius:12px;overflow:hidden;transition:background var(--dur-1)}
.ti:hover{background:var(--hover)}
.ti .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin-bottom:9px;color:var(--k);
  background:linear-gradient(180deg,var(--pane) 0%,color-mix(in srgb,var(--pane) 94%,var(--text)) 100%);
  box-shadow:0 0 0 1px var(--line2),0 1px 0 rgba(255,255,255,.7) inset,0 3px 0 -1px color-mix(in srgb,var(--text) 10%,transparent),0 6px 12px -6px rgba(12,12,16,.3);
  transition:transform var(--dur-2) var(--ease-spring),box-shadow var(--dur-2)}
.ti .ico svg{width:22px;height:22px}
.ti:hover .ico{transform:translateY(-2px)}
.ti:active .ico{transform:translateY(1px);box-shadow:0 0 0 1px var(--line2),0 1px 0 -1px color-mix(in srgb,var(--text) 10%,transparent)}
.ti .nm{font:600 12.5px/1.1 var(--font-display);letter-spacing:-.012em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .wh{font-size:11px;color:var(--faint);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ti .kc{display:flex;gap:2px;margin-top:8px;max-width:100%}
.ti .kc kbd{min-width:18px;height:18px;padding:0 4px;font-size:10px;font-family:var(--font-mono),-apple-system,sans-serif}

/* quick toggles */
.rw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:11px 11px 10px;border-radius:12px;text-align:left;
  background:var(--chip);transition:background var(--dur-2),box-shadow var(--dur-2)}
.rt:hover{background:color-mix(in srgb,var(--chip) 60%,var(--hover))}
.rt .rh{display:flex;align-items:center;justify-content:space-between;width:100%}
.rt .rc{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:background var(--dur-2),color var(--dur-2)}
.rt .rc svg{width:15px;height:15px}
.rt .rn{font:600 12.5px/1.1 var(--font-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rt small{display:block;margin-top:3px;font:400 10px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sw{position:relative;width:28px;height:17px;border-radius:9px;background:color-mix(in srgb,var(--text) 18%,transparent);flex:none;transition:background var(--dur-2)}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform var(--dur-2) var(--ease-spring)}
.rt.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--line2),0 1px 2px rgba(12,12,16,.05)}
.rt.on .rc{color:var(--on-ink);background:var(--ink);box-shadow:none}
.rt.on .sw{background:var(--ok-bar)}
.rt.on .sw::after{transform:translateX(11px)}
.rt.on small{color:var(--ok)}
.rt.mic.on .sw{background:var(--bad-bar)} .rt.mic.on small{color:var(--danger)} .rt.mic.on .rc{background:var(--bad-bar);color:#fff}
.meets{margin:10px 0 0;padding:8px 0 0;border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:10px;width:calc(100% + 16px);margin:0 -8px;padding:0 8px;height:30px;border-radius:8px;font-size:12.5px}
.mrow.link:hover{background:var(--hover)}
.mrow time{font:500 11px/1 var(--font-mono);color:var(--accent-ink);flex:none;min-width:40px;font-variant-numeric:tabular-nums}
.mrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{font-size:11.5px;color:var(--faint);padding:8px 0 0}

/* system: three columns split by hairlines */
.sw4{display:grid;grid-template-columns:repeat(var(--n),1fr)}
.sc{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding:2px 12px 2px;text-align:left;border-radius:10px;transition:background var(--dur-1)}
.sc + .sc{box-shadow:-1px 0 0 var(--line)}
.sc:first-child{padding-left:2px}
.sc:hover b{color:var(--accent-ink)}
.sc small{font:500 9.5px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font:600 22px/1 var(--font-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap;transition:color var(--dur-1)}
.sc b em{font-style:normal;font-size:12px;font-weight:500;letter-spacing:-.01em;color:var(--faint);margin-left:2px}
.sbar{height:3px;border-radius:2px;background:var(--chip);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:2px;background:var(--text);opacity:.75;transform-origin:left;animation:grow .7s var(--ease-out) both .1s}
@keyframes grow{from{transform:scaleX(0)}}
.sc.alert b{color:var(--danger)} .sc.alert .sbar i{background:var(--bad-bar);opacity:1}

/* footer */
.foot{flex:none;display:flex;align-items:center;gap:2px;padding:10px 12px 12px}
.foot .sp{flex:1}
.fb{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;border-radius:var(--r-pill);font-size:12px;font-weight:500;color:var(--muted);transition:background var(--dur-1),color var(--dur-1)}
.fb:hover{color:var(--text);background:var(--hover)}
.fb svg{width:14px;height:14px}
.fb.ring{box-shadow:inset 0 0 0 1px var(--line2)}
.fb.wide{width:100%;justify-content:center;height:36px;box-shadow:inset 0 0 0 1px var(--line2)}

/* sub views */
.vhead{display:flex;align-items:center;gap:10px;padding:16px 2px 8px}
.vhead .ib{margin-left:-4px}
.vht{display:flex;flex-direction:column;gap:5px;min-width:0}
.vhead h2{margin:0;font:640 19px/1 var(--font-display);letter-spacing:-.03em}
.vht small{font-size:11px;color:var(--faint)}
.card{flex:none;background:var(--card);border-radius:16px;box-shadow:var(--card-lift);padding:6px 14px}
.krow{display:flex;align-items:center;gap:10px;min-height:38px;font-size:12.5px;border-top:1px solid var(--line)}
.krow:first-child{border-top:0}
.krow span{flex:1;min-width:0}
.krow .ki{flex:none;width:20px;font:500 10px/1 var(--font-mono);color:var(--faint)}
.kbds{display:inline-flex;gap:3px;flex:none}
.empty{color:var(--faint);font-size:12.5px;padding:12px 0}
.ss-list{padding:4px}
.ss{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;text-align:left}
.ss + .ss{box-shadow:0 -1px 0 var(--line)}
button.ss:hover{background:var(--hover);box-shadow:none}
.ss-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line2)}
.ss-dot.b{background:var(--ok-bar);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok-bar) 20%,transparent)}
.ss-tx{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ss-tx b{font:600 13px/1.15 var(--font-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-tx small{font:400 10.5px/1.2 var(--font-mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-st{flex:none;font:500 10px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:var(--r-pill);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line2)}
.ss-st.b{color:var(--ok);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok-bar) 40%,transparent);background:color-mix(in srgb,var(--ok-bar) 8%,transparent)}
.ss .go{flex:none;width:14px;height:14px;color:var(--faint);transition:transform var(--dur-2) var(--ease-out)}
button.ss:hover .go{color:var(--text);transform:translate(2px,-2px)}
.msum{display:flex;align-items:baseline;gap:8px;padding:10px 0 12px;border-bottom:1px solid var(--line)}
.msum b{font:600 26px/1 var(--font-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.msum span{font:400 11px/1 var(--font-mono);color:var(--faint)}
.prc{display:grid;grid-template-columns:18px minmax(0,1.4fr) 1fr 64px 54px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.msum + .prc{border-top:0}
.prc .ki{font:500 10px/1 var(--font-mono);color:var(--faint)}
.pn{font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{height:3px;border-radius:2px;background:var(--chip);overflow:hidden}
.pb i{display:block;height:100%;border-radius:2px;background:var(--accent);transform-origin:left;animation:grow .6s var(--ease-out) both}
.pm{font:500 11.5px/1 var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.pc2{font:400 10.5px/1 var(--font-mono);color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app grain" id="app" tabindex="-1">
  <div class="scroll" id="scroll"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const app = document.getElementById('app'), scrollEl = document.getElementById('scroll'), footEl = document.getElementById('foot');
const post = m => { try { window.webkit.messageHandlers.pulse.postMessage(m); } catch (e) {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Duotone set: 16px grid, 1.6px round stroke, soft fill (28%) behind part of each glyph.
const P = (soft, line) => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" fill-opacity=".28" stroke="none">${soft}</g>${line}</svg>`;
const DOT = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="currentColor" stroke="none"/>`;
const ICONS = {
  bat:    P('<rect x="2" y="5" width="7" height="6" rx="1"/>', '<rect x="1.8" y="4.5" width="11" height="7" rx="2"/><path d="M14.4 7v2"/>'),
  memo:   P('<rect x="4.5" y="4.5" width="7" height="7" rx="1.2"/>', '<rect x="3" y="3" width="10" height="10" rx="2"/><path d="M6 1.5V3M10 1.5V3M6 13v1.5M10 13v1.5M1.5 6H3M1.5 10H3M13 6h1.5M13 10h1.5"/>'),
  disk:   P('<ellipse cx="8" cy="4.5" rx="5" ry="2"/>', '<ellipse cx="8" cy="4.5" rx="5" ry="2"/><path d="M3 4.5v7c0 1.1 2.2 2 5 2s5-.9 5-2v-7M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>'),
  box:    P('<path d="M8 2.2 13.5 5v6L8 13.8 2.5 11V5z"/>', '<path d="M8 2.2 13.5 5v6L8 13.8 2.5 11V5z"/><path d="M2.5 5 8 7.8 13.5 5M8 7.8v6"/>'),
  cup:    P('<path d="M3 6.2h7.8v3.3a3.9 3.9 0 0 1-7.8 0z"/>', '<path d="M3 6.2h7.8v3.3a3.9 3.9 0 0 1-7.8 0z"/><path d="M10.8 7.2h.9a1.9 1.9 0 0 1 0 3.8h-1.1M5.4 2.4v1.6M8.4 2.4v1.6"/>'),
  mic:    P('<rect x="5.6" y="1.8" width="4.8" height="8" rx="2.4"/>', '<rect x="5.6" y="1.8" width="4.8" height="8" rx="2.4"/><path d="M3.4 7.8a4.6 4.6 0 0 0 9.2 0M8 12.4v1.8"/>'),
  cal:    P('<rect x="2.5" y="3.5" width="11" height="10" rx="2"/>', '<rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/>'),
  clip:   P('<rect x="3.5" y="3" width="9" height="11" rx="1.8"/>', '<rect x="3.5" y="3" width="9" height="11" rx="1.8"/><path d="M6.2 3v-.6c0-.5.4-.9.9-.9h1.8c.5 0 .9.4.9.9V3"/><path d="M9.6 14v-2.2c0-.4.3-.7.7-.7h2.2"/>'),
  shot:   P('<circle cx="8" cy="8" r="3.3"/>', '<path d="M2.5 5.5v-2c0-.6.4-1 1-1h2M10.5 2.5h2c.6 0 1 .4 1 1v2M13.5 10.5v2c0 .6-.4 1-1 1h-2M5.5 13.5h-2c-.6 0-1-.4-1-1v-2"/>' + DOT(8, 8, 1.5)),
  layout: P('<rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/>', '<rect x="2.5" y="2.5" width="4.8" height="11" rx="1.4"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/>'),
  repo:   P('<circle cx="4.5" cy="12" r="1.9"/>', '<circle cx="4.5" cy="3.8" r="1.7"/><circle cx="11.5" cy="6.2" r="1.7"/><circle cx="4.5" cy="12" r="1.9" fill="currentColor"/><path d="M4.5 5.5v4.6M11.5 7.9c0 2-2.6 2.2-5.2 3.4"/>'),
  text:   P('<rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1.6"/>', '<path d="M2.5 5.5v-2c0-.6.4-1 1-1h2M10.5 2.5h2c.6 0 1 .4 1 1v2M13.5 10.5v2c0 .6-.4 1-1 1h-2M5.5 13.5h-2c-.6 0-1-.4-1-1v-2"/><path d="M6.2 6h3.6M8 6v4.2"/>'),
  refresh:P('', '<path d="M13.2 8A5.2 5.2 0 1 1 11.6 4.3"/><path d="M13.3 2.4v2.6h-2.6"/>'),
  shield: P('<path d="M8 2 3.4 3.8v3.7c0 3 2 5 4.6 6.2 2.6-1.2 4.6-3.2 4.6-6.2V3.8z"/>', '<path d="M8 2 3.4 3.8v3.7c0 3 2 5 4.6 6.2 2.6-1.2 4.6-3.2 4.6-6.2V3.8z"/>'),
  play:   P('<path d="M5.6 3.8v8.4L12.4 8z"/>', '<path d="M5.6 3.8v8.4L12.4 8z"/>'),
  keys:   P('<rect x="1.8" y="3.8" width="12.4" height="8.4" rx="2"/>', '<rect x="1.8" y="3.8" width="12.4" height="8.4" rx="2"/><path d="M4.6 6.6h.01M7 6.6h.01M9.4 6.6h.01M11.6 6.6h.01M5 9.4h6"/>'),
  term:   P('<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/>', '<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><path d="m4.8 6.4 2 1.7-2 1.7M8.4 10h2.8"/>'),
  reload: P('', '<path d="M13.2 8A5.2 5.2 0 1 1 11.6 4.3"/><path d="M13.3 2.4v2.6h-2.6"/>'),
  sun:    '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3" fill="currentColor" fill-opacity=".28" stroke="none"/><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8H3M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1"/></svg>',
  moon:   '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4z" fill="currentColor" fill-opacity=".28" stroke="none"/><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4z"/></svg>',
  back:   P('', '<path d="M10 3 5 8l5 5"/>'),
  warn:   P('<path d="M8 2.4 14 13H2z"/>', '<path d="M8 2.4 14 13H2z"/><path d="M8 6.6v2.6"/>' + DOT(8, 11.2, .6)),
};
// Tool glyphs take a quiet tint; the tile itself stays paper.
const TOOL_COLOR = { clip: 'var(--k-link)', shot: 'var(--k-shot)', layout: 'var(--k-code)', repo: 'var(--k-path)', text: 'var(--k-number)' };
const TOOL_ICON = { clip: 'clip', shot: 'shot', layout: 'layout', repo: 'repo', text: 'text' };

// Nimbstia mark: ink squircle, two white panes, the blue diagonal that makes the N.
const MARK = `<svg class="mark" viewBox="0 0 512 512" width="26" height="26" aria-hidden="true"><defs><linearGradient id="mk-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a30"/><stop offset="1" stop-color="#0b0b0f"/></linearGradient><linearGradient id="mk-d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc0ff"/><stop offset="1" stop-color="#0a72ef"/></linearGradient></defs><path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#mk-ink)"/><path d="M256 4C459 4 508 53 508 256S459 508 256 508 4 459 4 256 53 4 256 4Z" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="8"/><line x1="182" y1="170" x2="330" y2="342" stroke="url(#mk-d)" stroke-width="70" stroke-linecap="round"/><rect x="141" y="132" width="70" height="248" rx="35" fill="#fff"/><rect x="301" y="132" width="70" height="248" rx="35" fill="#fff"/></svg>`;
const ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
const CHEV = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 4 4-4 4"/></svg>';

let data = {}, view = 'main', sessionsOpen = false, lastView = null, lastHTML = '';

// "⌃⌥P" -> "Ctrl Opt P"
function keyText(s) {
  const NAMES = { '⌃': 'Ctrl', '⌥': 'Opt', '⇧': 'Shift', '⌘': 'Cmd' };
  const out = []; let rest = '';
  for (const ch of Array.from(String(s || ''))) {
    if (NAMES[ch]) { if (rest) { out.push(rest); rest = ''; } out.push(NAMES[ch]); } else rest += ch;
  }
  if (rest) out.push(rest);
  return out.join(' ');
}
function keycaps(s) {
  if (!s) return '';
  const parts = [], mods = '⌃⌥⇧⌘';
  let rest = '';
  for (const ch of Array.from(String(s))) {
    if (mods.includes(ch)) { if (rest) { parts.push(rest); rest = ''; } parts.push(ch); } else rest += ch;
  }
  if (rest) parts.push(rest);
  // Spelled out (Ctrl, Opt, Cmd, Shift): easier to read than the bare symbols.
  const NAMES = { '⌃': 'Ctrl', '⌥': 'Opt', '⇧': 'Shift', '⌘': 'Cmd' };
  return parts.map(p => `<kbd>${esc(NAMES[p] || p)}</kbd>`).join('');
}

const TONE = { ok: 'ok', warn: 'warn', bad: 'bad', down: 'bad' };
function overall() {
  const s = data.status;
  if (s && s.text) return { text: s.text, tone: TONE[s.tone] || 'ok' };
  if (data.health === 'down') return { text: 'Bağlantı Yok', tone: 'bad' };
  if (data.health === 'warn') return { text: 'Dikkat', tone: 'warn' };
  return { text: 'Her Şey Yolunda', tone: 'ok' };
}
// Tool tiles are narrow: macOS symbols on one keycap each (⌃ ⇧ P).
const keySym = s => { const out = []; let rest = ''; for (const ch of Array.from(String(s || ''))) { if ('⌃⌥⇧⌘'.includes(ch)) { if (rest) { out.push(rest); rest = ''; } out.push(ch); } else rest += ch; } if (rest) out.push(rest); return out.map(p => `<kbd>${esc(p === 'Space' ? '␣' : p)}</kbd>`).join(''); };
const limTone = p => p >= 90 ? 'bad' : p >= 70 ? 'warn' : '';
const pad2 = n => String(n).padStart(2, '0');
// Sentence case for the hero line: "Her Şey Yolunda" -> "Her şey yolunda"
const sentence = s => { const w = String(s || '').split(' '); return w.map((x, i) => i ? x.toLocaleLowerCase('tr') : x).join(' '); };
const today = () => new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' }).toLocaleUpperCase('tr');
// Card label: zero-padded index in the accent + uppercase mono name (Shoji's "01 Pick a layout").
const kick = (n, label) => `<span class="cc-kicker"><span class="idx">${pad2(n)}</span>${label}</span>`;

function renderMain() {
  const d = data, out = [];
  let n = 0;
  const st = overall();
  out.push(`<div class="head">${MARK}<div class="ht"><b>Nimbstia</b><span class="eyebrow">${esc(today())}</span></div><span class="sp"></span><span class="pill ${st.tone}"><i></i>${esc(st.tone === 'ok' ? 'Çevrimiçi' : st.text)}</span><button class="ib dn flip" data-act="flip" type="button"></button><button class="ib dn" data-act="close" type="button" aria-label="Kapat" data-tip="Kapat · Esc"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button></div>`);

  // ---- hero: what matters, in one sentence (strong clause + quiet detail)
  const facts = [];
  if (d.dev) facts.push(d.health === 'ok' ? `${esc(d.dev.name || 'VPN')} bağlı` : `${esc(d.dev.name || 'VPN')} ${d.health === 'warn' ? 'yanıt vermiyor' : 'bağlı değil'}`);
  const lim0 = d.claude && Array.isArray(d.claude.limits) ? d.claude.limits[0] : null;
  if (lim0 && typeof lim0.percent === 'number') facts.push(`Claude %${Math.round(lim0.percent)}`);
  const sess0 = d.claude && Array.isArray(d.claude.sessions) ? d.claude.sessions.filter(x => x.busy).length : 0;
  if (sess0) facts.push(`${sess0} oturum çalışıyor`);
  out.push(`<div class="hero"><h1><i class="tone ${st.tone}"></i>${esc(sentence(st.text))}.${facts.length ? ` <span>${facts.join(' · ')}.</span>` : ''}</h1></div>`);

  const errs = Array.isArray(d.errors) ? d.errors : [];
  if (errs.length) out.push(`<button class="banner" data-act="console">${ICONS.warn}<span>${errs.length} modül yüklenemedi</span><span class="go">Konsol</span></button>`);

  // ---- row 1: connection + Claude
  const row1 = [];
  if (d.dev) {
    const dev = d.dev, tone = TONE[d.health] || '', v = d.vpn;
    // signal bars by latency: 3 under 60 ms, 2 under 150 ms, else 1; none while down
    const ms = typeof dev.ms === 'number' ? dev.ms : null;
    const bars = tone === 'ok' ? (ms == null ? 3 : ms < 60 ? 3 : ms < 150 ? 2 : 1) : 0;
    const sig = `<span class="sig">${[1, 2, 3].map(i => `<i class="${i <= bars ? 'on' : ''}" style="height:${2 + i * 3}px"></i>`).join('')}</span>`;
    const label = v && v.busy ? v.busy : tone === 'ok' ? 'Bağlı' : tone === 'warn' ? 'Yanıt Vermiyor' : tone === 'bad' ? 'Bağlı Değil' : 'Kontrol Ediliyor…';
    const power = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2v5.5"/><path d="M4.6 4.4a5 5 0 1 0 6.8 0"/></svg>';
    const action = !v ? '' : v.busy
      ? `<button class="cc-btn" type="button" disabled>${esc(v.busy)}</button>`
      : v.connected
        ? `<button class="cc-btn off" data-act="vpn" data-v="disconnect" type="button">${power}Bağlantıyı Kes</button>`
        : `<button class="cc-btn on" data-act="vpn" data-v="connect" type="button">${power}Bağlan</button>`;
    const tip = 'Yeniden Kontrol Et' + (dev.checkedAgo ? ' · ' + dev.checkedAgo : '');
    row1.push(`<section class="cc vpn ${tone}">
      <div class="cc-top">${kick(++n, 'Bağlantı')}<button class="ib sm" data-act="check" type="button" data-tip="${esc(tip)}" aria-label="Yeniden Kontrol Et">${ICONS.refresh}</button></div>
      <div class="vtx"><h2>${esc(dev.title || 'VPN Bağlantısı')}</h2>${dev.host ? `<div class="hostin">${esc(dev.host)}${dev.port ? ':' + esc(dev.port) : ''}</div>` : ''}</div>
      <div class="vline"><span class="vstat"><i></i>${esc(label)}</span>${tone === 'ok' ? `<span class="vlat">${sig}${ms != null ? ms + ' ms' : ''}</span>` : ''}</div>
      ${action}</section>`);
  }
  if (d.claude) {
    const c = d.claude, lims = Array.isArray(c.limits) ? c.limits : [], lim = lims[0], sess = Array.isArray(c.sessions) ? c.sessions : [];
    const p = lim && typeof lim.percent === 'number' ? Math.max(0, Math.min(100, Math.round(lim.percent))) : null;
    const tone = p == null ? '' : limTone(p);
    const on = p == null ? 0 : Math.round(p / 100 * 24);
    const ticks = `<div class="ticks ${tone}">${Array.from({ length: 24 }, (_, i) => `<i class="${i < on ? 'on' : ''}" style="animation-delay:${(i * 14)}ms"></i>`).join('')}</div>`;
    const second = lims[1] && typeof lims[1].percent === 'number'
      ? `<div class="lim2"><span>${esc(lims[1].label.replace(' Limit', ''))}</span><span class="mini"><i style="width:${Math.max(2, Math.min(100, lims[1].percent))}%"></i></span><b>%${Math.round(lims[1].percent)}</b></div>` : '';
    const busy = sess.filter(x => x.busy).length;
    row1.push(`<section class="cc claude">
      <div class="cc-top">${kick(++n, 'Claude' + (c.plan ? ' · ' + esc(c.plan) : ''))}${c.updatedAgo ? `<span class="cc-ago">${esc(c.updatedAgo)}</span>` : ''}</div>
      <div class="big">${p == null ? '–' : p}${p == null ? '' : '<small>%</small>'}</div>
      <div class="bigl"><span>${esc(lim ? lim.label.replace(' Limit', '') : 'Kullanım')}</span>${lim && lim.resets ? `<span class="rs">↻ ${esc(lim.resets)}</span>` : ''}</div>
      ${ticks}${second}
      ${lim && typeof lim.today === 'number' ? `<div class="cc-today">Bugün +%${lim.today}</div>` : ''}
      ${sess.length ? `<button class="cc-link" data-act="sessions" type="button"><span class="sdots">${sess.slice(0, 5).map(x => `<i class="${x.busy ? 'b' : ''}"></i>`).join('')}</span><span>${sess.length} oturum</span><span class="cnt">${busy ? busy + ' aktif' : 'boşta'}</span><span class="sp"></span>${CHEV}</button>` : ''}
      </section>`);
  }
  if (row1.length) out.push(`<div class="cc-row${row1.length === 1 ? ' one' : ''}">${row1.join('')}</div>`);

  // ---- launcher (config.local.lua → launcher): the one ink call to action
  if (d.launcher) out.push(`<button class="launch" data-act="launcher" type="button"><span class="lk">Başlat</span><span class="lt">${esc(d.launcher.title)}</span><span class="go">${ARROW}</span></button>`);

  // ---- tools
  const tools = Array.isArray(d.tools) ? d.tools : [];
  if (tools.length) {
    out.push(`<section class="cc tools"><div class="cc-top">${kick(++n, 'Araçlar')}<span class="cc-ago">${tools.length} araç</span></div><div class="tw" style="--n:${Math.min(tools.length, 5)}">` + tools.map(t =>
      `<button class="ti" data-act="tool" data-id="${esc(t.id)}" style="--k:${TOOL_COLOR[t.id] || 'var(--muted)'}" aria-label="${esc(t.name + ' · ' + t.what)}"><span class="ico">${ICONS[TOOL_ICON[t.id]] || ICONS.clip}</span><span class="nm">${esc(t.name)}</span><span class="wh">${esc(t.what)}</span><span class="kc">${keySym(t.keys)}</span></button>`).join('') + `</div></section>`);
  }

  // ---- quick toggles
  const tg = d.toggles || {};
  const rt = (id, label, icon, states) => `<button class="rt ${id}${tg[id] ? ' on' : ''}" role="switch" aria-checked="${tg[id] ? 'true' : 'false'}" data-act="toggle" data-id="${id}"><span class="rh"><span class="rc">${ICONS[icon]}</span><span class="sw"></span></span><span><span class="rn">${label}</span><small>${(states || ['Açık', 'Kapalı'])[tg[id] ? 0 : 1]}</small></span></button>`;
  let q = `<section class="cc quick"><div class="cc-top">${kick(++n, 'Hızlı Ayarlar')}<span class="cc-ago">Ctrl Opt K · M</span></div><div class="rw">` +
    rt('awake', 'Uyanık Tut', 'cup') + rt('mic', 'Mikrofon', 'mic', ['Sessiz', 'Açık']) + rt('meetings', 'Toplantılar', 'cal') + `</div>`;
  const meets = Array.isArray(d.meetings) ? d.meetings : [];
  if (tg.meetings && meets.length) {
    q += `<div class="meets">` + meets.slice(0, 3).map(m => {
      const inner = `<time>${esc(m.time)}</time><span>${esc(m.title)}</span>`;
      return m.url ? `<button class="mrow link" data-act="url" data-url="${esc(m.url)}">${inner}</button>` : `<div class="mrow">${inner}</div>`;
    }).join('') + `</div>`;
  }
  if (d.meetErr) q += `<div class="muted">${esc(d.meetErr)}</div>`;
  out.push(q + '</section>');

  // ---- system: three numbers, hairline-separated
  const sy = d.system || {};
  const col = (id, value, unit, label, alert, tip, fill) => `<button class="sc${alert ? ' alert' : ''}" data-act="${id === 'mem' ? 'memory' : 'sys'}" data-id="${id}" type="button" aria-label="${esc(tip)}"><small>${label}</small><b>${value}<em>${unit}</em></b>${typeof fill === 'number' ? `<span class="sbar"><i style="width:${Math.max(2, Math.min(100, fill))}%"></i></span>` : ''}</button>`;
  const cols = [];
  if (sy.battery) cols.push(col('battery', sy.battery.pct, '%', sy.battery.charging ? 'Pil · Şarj' : 'Pil', sy.battery.pct < 20 && !sy.battery.charging, 'Pil Ayarları', sy.battery.pct));
  if (typeof sy.mem === 'number') cols.push(col('mem', sy.mem, '%', 'Bellek', sy.mem >= 85, 'Neyin ne kadar kullandığını gör', sy.mem));
  if (typeof sy.disk === 'number') cols.push(col('disk', sy.disk >= 1000 ? (sy.disk / 1000).toFixed(1).replace('.', ',') : sy.disk, sy.disk >= 1000 ? 'TB' : 'GB', 'Boş Disk', sy.disk < 20 || sy.diskUsed >= 90, 'Depolama Ayarları', sy.diskUsed));
  if (cols.length) out.push(`<section class="cc sys"><div class="cc-top">${kick(++n, 'Sistem')}</div><div class="sw4" style="--n:${cols.length}">${cols.join('')}</div></section>`);
  return out.join('');
}

let procs = null;
function renderMemory() {
  const fmt = mb => mb >= 1024 ? (mb / 1024).toFixed(1).replace('.', ',') + ' GB' : Math.round(mb) + ' MB';
  let body;
  if (!procs) body = '<div class="empty">Uygulamalar okunuyor…</div>';
  else if (!procs.list.length) body = '<div class="empty">Okunamadı.</div>';
  else {
    const max = procs.list[0].mb || 1;
    body = procs.list.map((p, i) => `<div class="prc"><span class="ki">${pad2(i + 1)}</span><span class="pn">${esc(p.name)}</span><span class="pb"><i style="width:${Math.max(3, p.mb / max * 100)}%;animation-delay:${i * 30}ms"></i></span><span class="pm">${fmt(p.mb)}</span>${p.cpu ? `<span class="pc2">%${p.cpu} CPU</span>` : '<span class="pc2"></span>'}</div>`).join('');
  }
  const total = procs && procs.memMB ? `<div class="msum"><b>${fmt(procs.totalMB)}</b><span>/ ${fmt(procs.memMB)} kullanımda</span></div>` : '';
  return `<div class="vhead"><button class="ib ring" data-act="back" aria-label="Geri">${ICONS.back}</button><div class="vht"><span class="eyebrow">Sistem</span><h2>Bellek Kullanımı</h2></div></div>
    <section class="card">${total}${body}</section>
    <button class="fb wide" data-act="sys" data-id="activity" type="button">${ICONS.memo}<span>Etkinlik İzleyicisi'nde Aç</span></button>`;
}

function renderSessions() {
  const sess = (data.claude && Array.isArray(data.claude.sessions)) ? data.claude.sessions.slice() : [];
  sess.sort((a, b) => (b.busy ? 1 : 0) - (a.busy ? 1 : 0));
  const busy = sess.filter(x => x.busy).length;
  const ext = '<svg class="go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2.5"/></svg>';
  const rows = sess.map(x => {
    const meta = [x.folder, x.ago].filter(Boolean).map(esc).join(' · ');
    const inner = `<span class="ss-dot${x.busy ? ' b' : ''}"></span><span class="ss-tx"><b>${esc(x.name)}</b>${meta ? `<small>${meta}</small>` : ''}</span><span class="ss-st${x.busy ? ' b' : ''}">${x.busy ? 'Çalışıyor' : 'Boşta'}</span>${x.url ? ext : ''}`;
    return x.url ? `<button class="ss" data-act="url" data-url="${esc(x.url)}" type="button" title="claude.ai'de aç">${inner}</button>` : `<div class="ss">${inner}</div>`;
  }).join('');
  return `<div class="vhead"><button class="ib ring" data-act="back" aria-label="Geri">${ICONS.back}</button><div class="vht"><span class="eyebrow">${sess.length} açık · ${busy} çalışıyor</span><h2>Claude Oturumları</h2></div></div>
    <section class="card ss-list">${rows || '<div class="empty">Açık oturum yok.</div>'}</section>
    <div class="vht" style="padding:2px 4px"><small>Bir oturuma tıklayınca claude.ai'de açılır.</small></div>`;
}

function renderKeys() {
  const list = Array.isArray(data.shortcuts) ? data.shortcuts : [];
  return `<div class="vhead"><button class="ib ring" data-act="back" aria-label="Geri">${ICONS.back}</button><div class="vht"><span class="eyebrow">${list.length} kısayol</span><h2>Kısayollar</h2></div></div>
    <section class="card">${list.length ? list.map((s, i) => `<div class="krow"><span class="ki">${pad2(i + 1)}</span><span>${esc(s.label)}</span><span class="kbds">${keycaps(s.keys)}</span></div>`).join('') : '<div class="empty">Henüz kısayol yok.</div>'}</section>`;
}

function renderFoot() {
  // Labelled actions: what each one does is written on it (the theme switch lives in the header).
  return `<button class="fb" data-act="keys" type="button">${ICONS.keys}<span>Kısayollar</span></button>
    <button class="fb" data-act="console" type="button">${ICONS.term}<span>Konsol</span></button>
    <span class="sp"></span>
    <button class="fb ring" data-act="reload" type="button">${ICONS.reload}<span>Yeniden Yükle</span></button>`;
}

function applyTheme() {
  const t = data.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

// Theme switch in the header: sun while dark (click -> light), moon while light (click -> dark).
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : darkMQ.matches; };
function syncFlip() {
  const d = isDark(), tip = d ? 'Açık Tema' : 'Koyu Tema';
  document.querySelectorAll('.flip').forEach(b => { b.innerHTML = d ? ICONS.sun : ICONS.moon; b.dataset.tip = tip; b.setAttribute('aria-label', tip); });
}
new MutationObserver(syncFlip).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
darkMQ.addEventListener('change', syncFlip);

function render() {
  const top = scrollEl.scrollTop;
  const html = view === 'keys' ? renderKeys() : view === 'sessions' ? renderSessions() : view === 'memory' ? renderMemory() : renderMain();
  // Live updates that change nothing visible leave the DOM (and a running entrance) alone; a new view
  // plays the entrance, a data change within the same view just swaps in place.
  if (html === lastHTML && lastView === view) return;
  scrollEl.classList.toggle('still', lastView === view);
  lastView = view; lastHTML = html;
  scrollEl.innerHTML = html;
  footEl.innerHTML = renderFoot();
  syncFlip();
  scrollEl.scrollTop = top;
  postSize();
}
let lastH = 0;
function postSize() { const h = Math.ceil(app.offsetHeight) + 20; if (h !== lastH) { lastH = h; post({ action: 'size', h }); } }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'url': if (el.dataset.url) post({ action: 'url', url: el.dataset.url }); break;
    case 'vpn': post({ action: 'vpn', v: el.dataset.v }); break;
    case 'tool': post({ action: 'tool', id: el.dataset.id }); break;
    case 'toggle': post({ action: 'toggle', id: el.dataset.id }); break;
    case 'theme': post({ action: 'theme', v: el.dataset.v }); break;
    case 'flip': post({ action: 'toggleTheme' }); break;
    case 'close': post({ action: 'close' }); break;
    case 'more': sessionsOpen = !sessionsOpen; render(); break;
    case 'keys': view = 'keys'; scrollEl.scrollTop = 0; render(); break;
    case 'sessions': view = 'sessions'; scrollEl.scrollTop = 0; render(); break;
    case 'memory': view = 'memory'; procs = null; scrollEl.scrollTop = 0; render(); post({ action: 'procs' }); break;
    case 'sys': post({ action: 'sys', id: el.dataset.id }); break;
    case 'back': view = 'main'; render(); break;
    default: post({ action: a });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); if (view !== 'main') { view = 'main'; render(); } else post({ action: 'close' }); }
});

window.Pulse = {
  setProcs(p) { procs = p && Array.isArray(p.list) ? p : { list: [] }; if (view === 'memory') render(); },
  set(d) { data = d || {}; applyTheme(); render(); },
  open() { view = 'main'; lastView = null; lastHTML = ''; render(); app.classList.remove('show'); void app.offsetWidth; requestAnimationFrame(() => app.classList.add('show')); try { app.focus({ preventScroll: true }); } catch (e) {} },
  close() { app.classList.remove('show'); },
};
window.Panel = window.Pulse;
render();
post({ action: 'ready' });
</script>
</body>
</html>
