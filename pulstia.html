<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --card-lift:0 1px 2px rgba(23,30,60,.07),0 0 0 1px rgba(23,30,60,.09); --app-bg:radial-gradient(120% 60% at 0% 0%,#eef3ff 0%,transparent 60%),radial-gradient(90% 50% at 100% 0%,#f4eeff 0%,transparent 60%),linear-gradient(180deg,#f8f9fd 0,#eef1f8 100%);
  --bg:#f6f7fb; --bg2:#eef1f8; --pane:#ffffff; --ctl:#ffffff;
  --line:rgba(23,30,60,.09); --line2:rgba(23,30,60,.14);
  --text:#0f1222; --muted:#4a5068; --faint:#636a80;
  --accent:#2563ff; --accent-fill:#2563ff; --accent-ink:#1d4fe0; --accent-soft:#e8efff; --accent-ring:rgba(37,99,255,.45); --on-accent:#ffffff;
  --hover:rgba(23,30,60,.05); --chip:rgba(23,30,60,.065);
  --ok:#166534; --danger:#be123c; --warn:#92400e;
  --ok-bar:#16a34a; --warn-bar:#d97706; --bad-bar:#e11d48;
  --tile-mix:12%; --tile-ring:28%;
  --shadow:0 18px 44px rgba(15,18,34,.26),0 0 0 .5px rgba(15,18,34,.22);
  --ctl-shadow:0 1px 1px rgba(23,30,60,.05); --top:#fbfcff; --seg-on:#ffffff; --card:#ffffff; --card-shadow:0 1px 2px rgba(23,30,60,.05);
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --font-display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --font-mono:"SF Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --card-lift:0 0 0 1px var(--line); --app-bg:linear-gradient(180deg,var(--top) 0,var(--bg) 90px,var(--bg2) 100%);
  --bg:#1e1e22; --bg2:#1a1a1e; --pane:#17171a; --ctl:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#f2f2f5; --muted:#bcbcc6; --faint:#92929d;
  --accent:#5b9dff; --accent-fill:#2a6de0; --accent-ink:#8bb8ff; --accent-soft:rgba(91,157,255,.16); --accent-ring:rgba(91,157,255,.5); --on-accent:#ffffff;
  --hover:rgba(255,255,255,.055); --chip:rgba(255,255,255,.08);
  --ok:#3ccf7a; --danger:#ff7468; --warn:#ffb340;
  --ok-bar:#3ccf7a; --warn-bar:#ffb340; --bad-bar:#ff6a5e;
  --tile-mix:18%; --tile-ring:32%;
  --shadow:0 18px 44px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.13);
  --ctl-shadow:none; --top:#26262c; --seg-on:rgba(255,255,255,.15); --card:rgba(255,255,255,.04); --card-shadow:none;
}}
:root[data-theme="dark"]{
  --card-lift:0 0 0 1px var(--line); --app-bg:linear-gradient(180deg,var(--top) 0,var(--bg) 90px,var(--bg2) 100%);
  --bg:#1e1e22; --bg2:#1a1a1e; --pane:#17171a; --ctl:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#f2f2f5; --muted:#bcbcc6; --faint:#92929d;
  --accent:#5b9dff; --accent-fill:#2a6de0; --accent-ink:#8bb8ff; --accent-soft:rgba(91,157,255,.16); --accent-ring:rgba(91,157,255,.5); --on-accent:#ffffff;
  --hover:rgba(255,255,255,.055); --chip:rgba(255,255,255,.08);
  --ok:#3ccf7a; --danger:#ff7468; --warn:#ffb340;
  --ok-bar:#3ccf7a; --warn-bar:#ffb340; --bad-bar:#ff6a5e;
  --tile-mix:18%; --tile-ring:32%;
  --shadow:0 18px 44px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.13);
  --ctl-shadow:none; --top:#26262c; --seg-on:rgba(255,255,255,.15); --card:rgba(255,255,255,.04); --card-shadow:none;
}
@property --bg{syntax:"<color>";inherits:true;initial-value:#f6f7fb}
@property --bg2{syntax:"<color>";inherits:true;initial-value:#eef1f8}
@property --top{syntax:"<color>";inherits:true;initial-value:#fbfcff}
@property --pane{syntax:"<color>";inherits:true;initial-value:#ffffff}
@property --ctl{syntax:"<color>";inherits:true;initial-value:#ffffff}
@property --line{syntax:"<color>";inherits:true;initial-value:rgba(23,30,60,.09)}
@property --line2{syntax:"<color>";inherits:true;initial-value:rgba(23,30,60,.14)}
@property --text{syntax:"<color>";inherits:true;initial-value:#0f1222}
@property --muted{syntax:"<color>";inherits:true;initial-value:#4a5068}
@property --faint{syntax:"<color>";inherits:true;initial-value:#636a80}
@property --chip{syntax:"<color>";inherits:true;initial-value:rgba(23,30,60,.065)}
@property --hover{syntax:"<color>";inherits:true;initial-value:rgba(23,30,60,.05)}
@property --accent-soft{syntax:"<color>";inherits:true;initial-value:#e8efff}
@property --accent-ink{syntax:"<color>";inherits:true;initial-value:#1d4fe0}
@property --seg-on{syntax:"<color>";inherits:true;initial-value:#ffffff}
:root{transition:--bg .16s ease,--bg2 .16s ease,--top .16s ease,--pane .16s ease,--ctl .16s ease,--line .16s ease,--line2 .16s ease,--text .16s ease,--muted .16s ease,--faint .16s ease,--chip .16s ease,--hover .16s ease,--accent-soft .16s ease,--accent-ink .16s ease,--seg-on .16s ease}
@media (prefers-reduced-motion:reduce){:root{transition:none}}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
body{font:13px/1.45 var(--font-ui);color:var(--text);-webkit-user-select:none;cursor:default;padding:10px}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default;text-align:inherit}
button:focus{outline:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent-ring);outline-offset:1px}

.app{position:relative;display:flex;flex-direction:column;max-height:980px;border-radius:16px;background:var(--app-bg);box-shadow:var(--shadow);overflow:hidden;outline:0;opacity:0;transform:translateY(-4px);transition:opacity .14s ease,transform .18s cubic-bezier(.2,.8,.2,1)}
.app.show{opacity:1;transform:none}
.scroll{overflow-y:auto;overflow-x:hidden;padding:0 12px 0;display:flex;flex-direction:column;gap:8px;min-height:0}
.scroll::after{content:"";flex:none;height:2px}

/* header */
.head{display:flex;align-items:center;gap:9px;padding:0 0 0 6px;height:56px;flex:none}
.head .mark{width:22px;height:22px;flex:none}
.head h1{margin:0;font:600 15px/1 var(--font-display);letter-spacing:-.015em}
.head .sp{flex:1}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--faint);background:var(--chip);letter-spacing:.002em}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok-bar) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn-bar) 16%,transparent)}
.pill.bad{color:var(--danger);background:color-mix(in srgb,var(--bad-bar) 14%,transparent)}
.pill.plain{color:var(--accent-ink);background:var(--accent-soft)}

/* banner */
.banner{margin-top:12px;display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--bad-bar) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad-bar) 28%,transparent);color:var(--danger);font-size:12.5px;font-weight:600;flex:none}
.banner svg{width:15px;height:15px}
.banner:hover{background:color-mix(in srgb,var(--bad-bar) 17%,transparent)}

/* cards */
.card{flex:none;background:var(--card);border-radius:12px;box-shadow:var(--card-lift);padding:11px 12px}
.ctitle{display:flex;align-items:center;gap:8px;min-height:22px}
.ctitle h2{margin:0;white-space:nowrap;flex:none;font:650 13.5px/1 var(--font-display);color:var(--text);letter-spacing:-.005em}
.ctitle .sp{flex:1}

/* connection */
.host{margin:6px 0 0 16px;font:11px/1 var(--font-mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev{display:flex;align-items:center;gap:9px;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok-bar);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok-bar) 22%,transparent)}
.dot.warn{background:var(--warn-bar);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn-bar) 24%,transparent)}
.dot.bad{background:var(--bad-bar);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad-bar) 22%,transparent)}
.dev b{font:600 14px/1 var(--font-display);letter-spacing:-.01em}
.dev .host{font:11.5px/1 var(--font-mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dev .sp{flex:1}
.acts{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--text);background:var(--ctl);box-shadow:0 0 0 1px var(--line2),var(--ctl-shadow);white-space:nowrap;transition:background .1s}
.btn svg{width:14px;height:14px;color:var(--muted)}
.btn:hover{background:color-mix(in srgb,var(--ctl) 90%,var(--text))}
.btn:active{background:color-mix(in srgb,var(--ctl) 82%,var(--text))}
.ago{font-size:11.5px;color:var(--faint);margin-right:4px;font-variant-numeric:tabular-nums}

/* claude */
.lim{margin-top:10px}
.lim .top{display:flex;align-items:baseline;gap:8px}
.lim .lb{flex:1;font-size:12.5px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lim .pc{font:600 20px/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--chip);margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--ok-bar);transition:width .3s ease}
.bar>i.warn{background:var(--warn-bar)}.bar>i.bad{background:var(--bad-bar)}
.lim .rs{font-size:11.5px;color:var(--faint);margin-top:5px}
.sub{display:flex;align-items:center;margin:11px 0 2px;padding-top:10px;border-top:1px solid var(--line);font:600 12px/1 var(--font-ui);color:var(--muted);letter-spacing:.01em}
.sub span{margin-left:6px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.srow{display:flex;align-items:center;gap:10px;width:100%;height:26px;padding:0 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:7px;transition:background .1s}
.srow.link:hover{background:var(--hover)}
.srow .n{flex:1;min-width:0;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .st{font-size:11.5px;color:var(--faint)}
.srow.busy .st{color:var(--ok)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--faint);opacity:.5;flex:none}
.srow.busy .sdot{background:var(--ok-bar);opacity:1;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok-bar) 45%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok-bar) 0%,transparent)}}
.srow.more{color:var(--faint);font-size:12px;font-weight:500}
.srow.more:hover{background:var(--hover);color:var(--text)}
.foot-note{margin-top:6px;font-size:11.5px;color:var(--faint)}

/* tools */
.grid{display:grid;grid-template-columns:1fr;gap:5px}
.tile{position:relative;display:flex;align-items:center;gap:12px;padding:6px 12px 6px 7px;min-width:0;min-height:46px;border-radius:12px;text-align:left;
  background:linear-gradient(135deg,color-mix(in srgb,var(--k) 9%,var(--ctl)) 0%,var(--ctl) 70%);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--k) 16%,var(--line)),var(--ctl-shadow);transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .14s,background .14s}
.tile:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--k) 38%,var(--line)),0 6px 14px color-mix(in srgb,var(--k) 12%,transparent)}
.tile .ico{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,color-mix(in srgb,var(--k) 88%,#fff) 0%,var(--k) 55%,color-mix(in srgb,var(--k) 80%,#000) 100%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.45),0 2px 6px color-mix(in srgb,var(--k) 35%,transparent)}
.tile .ico svg{width:17px;height:17px}
.tile .keys{flex:none;display:flex;gap:3px;margin-left:auto}
.tile kbd{min-width:18px;height:17px;font-size:10px;font-weight:600;padding:0 5px;border-radius:5px;color:var(--muted);background:var(--pane);box-shadow:0 0 0 1px var(--line),0 1px 0 var(--line)}
.tile .tx{flex:1;min-width:0}
.tile .nm{font:650 14px/1.2 var(--font-display);letter-spacing:-.01em}
.tile .wh{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:600 10.5px/1 var(--font-ui);display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:var(--ctl);color:var(--muted);box-shadow:0 0 0 1px var(--line2),0 1.5px 0 var(--line2)}
.kbds{display:inline-flex;gap:3px}

/* mac switches */
.trow{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:9px;transition:background .15s}
.trow:hover{background:var(--hover)}
.trow .lb{flex:1;font-size:13.5px;font-weight:500}
.trow.alert{background:color-mix(in srgb,var(--bad-bar) 11%,transparent)}
.trow.alert .lb{color:var(--danger)}
.sw{position:relative;width:36px;height:22px;border-radius:11px;background:color-mix(in srgb,var(--muted) 40%,transparent);flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.trow[aria-checked="true"] .sw{background:var(--accent-fill)}
.trow.alert[aria-checked="true"] .sw{background:var(--bad-bar)}
.trow[aria-checked="true"] .sw::after{transform:translateX(14px)}
.qs[aria-checked="true"] .sw{background:var(--q)}
.qs[aria-checked="true"] .sw::after{transform:translateX(14px)}
.meets{margin:2px 0 0;padding:6px 0 0;border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:10px;width:calc(100% + 16px);margin:0 -8px;padding:0 8px;height:28px;border-radius:7px;font-size:12.5px}
.mrow.link:hover{background:var(--hover)}
.mrow time{font:11.5px/1 var(--font-mono);color:var(--faint);flex:none;min-width:38px}
.mrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{font-size:11.5px;color:var(--faint);padding:4px 0 0}

/* footer */
.foot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px 10px 12px}
.segc{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
.segc button{height:24px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;white-space:nowrap;transition:background .1s,color .1s}
.segc button:hover:not(.on){color:var(--text)}
.segc button.on{background:var(--seg-on);color:var(--text);font-weight:600;box-shadow:0 0 0 .5px var(--line2),0 1px 2px rgba(0,0,0,.10)}
.foot .sp{flex:1}
.ib{position:relative;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .1s,color .1s}
.ib svg{width:16px;height:16px}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.dn[data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
.ib[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);right:0;white-space:nowrap;background:var(--text);color:var(--pane);font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:6px;pointer-events:none}

/* shortcuts view */
.vhead{display:flex;align-items:center;gap:8px;min-height:44px;padding:14px 2px 6px}
.vhead .ib{margin-left:-6px}
.vhead h2{margin:0;font:600 15px/1 var(--font-display);letter-spacing:-.015em}
.krow{display:flex;align-items:center;gap:10px;min-height:34px;font-size:12.5px;border-top:1px solid var(--line)}
.krow:first-child{border-top:0}
.krow span{flex:1;min-width:0}
.empty{color:var(--faint);font-size:12.5px;padding:8px 0}

::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
.app:focus,.app:focus-visible{outline:0;box-shadow:var(--shadow)}
body{-webkit-font-smoothing:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{-webkit-font-smoothing:antialiased}}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased}
/* two-column dashboard */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
/* GitHub card */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;border-radius:10px;background:color-mix(in srgb,var(--sc,var(--muted)) 9%,var(--ctl));box-shadow:0 0 0 1px color-mix(in srgb,var(--sc,var(--muted)) 18%,var(--line))}
.stat b{font:700 17px/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--sc,var(--text))}
.stat span{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.stat.pr{--sc:var(--accent)} .stat.commit{--sc:#7c3aed} .stat.add{--sc:#16a34a} .stat.del{--sc:#e11d48}
.gh .sub{margin-top:12px}
.prow{display:flex;align-items:baseline;gap:8px;width:calc(100% + 12px);margin:0 -6px;padding:5px 6px;border:0;border-radius:7px;background:none;font:inherit;color:var(--text);text-align:left;cursor:default}
.prow:hover{background:var(--hover)}
.prow .repo{flex:none;font:600 10.5px/1.2 var(--font-mono);color:var(--faint)}
.prow .t{min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .draft{flex:none;margin-left:auto;font-size:10px;font-weight:600;color:var(--muted);padding:1px 6px;border-radius:6px;background:var(--chip)}
.prow.more{color:var(--accent);font-size:12px;font-weight:600}
.nil{font-size:12px;color:var(--faint);padding:4px 0}
.lim .top .today{flex:none;font-size:11px;font-weight:650;color:var(--accent);padding:2px 7px;border-radius:7px;background:var(--accent-soft)}
/* section labels: say what each card is */
.sec{display:flex;align-items:flex-end;gap:8px;margin:6px 4px -1px}
.sec-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.sec-t b{font:650 12px/1.1 var(--font-display);color:var(--text);letter-spacing:-.005em}
.sec-t small{font-size:11px;line-height:1.2;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec > span{margin-left:auto;flex:none;font-size:11px;color:var(--faint);padding-bottom:1px}
.trow .lb{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.trow .lb small{font-size:11px;font-weight:400;color:var(--faint)}
.crow{display:flex;align-items:center;gap:6px;margin-top:8px}
.crow .hostin{margin-left:16px}
.crow .ago{font-size:11px;color:var(--faint);white-space:nowrap}
.btn.sm{height:26px;padding:0 10px;font-size:12px;font-weight:600}
.btn.accent{color:#fff;background:var(--accent-grad,var(--accent));box-shadow:var(--accent-shadow,none)}
.btn.ghost{color:var(--danger,#be123c);background:var(--ctl);box-shadow:0 0 0 1px color-mix(in srgb,var(--danger,#be123c) 30%,var(--line2))}
.btn[disabled]{opacity:.6}
/* header title + subtitle, labelled footer actions */
.ht{display:flex;flex-direction:column;gap:3px;min-width:0}
.ht small{font-size:11px;color:var(--faint);white-space:nowrap}
.fb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border:0;border-radius:8px;font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);cursor:default;transition:background .12s,color .12s}
.fb:hover{color:var(--text);background:var(--hover)}
.fb svg{width:15px;height:15px}
/* connection card: badge | info | actions */

const TOOL_COLOR = { clip: '#2563ff', shot: '#16a34a', layout: '#7c3aed', repo: '#d97706', text: '#0d9488' };
const TOOL_ICON = { clip: 'clip', shot: 'shot', layout: 'layout', repo: 'repo', text: 'text' };

const MARK = `<svg class="mark" viewBox="0 0 512 512" width="24" height="24" aria-hidden="true"><defs><linearGradient id="mk-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d82ff"/><stop offset=".55" stop-color="#2f5cf5"/><stop offset="1" stop-color="#7b3df0"/></linearGradient></defs><path d="M256 0C462 0 512 50 512 256S462 512 256 512 0 462 0 256 50 0 256 0Z" fill="url(#mk-bg)"/><line x1="176" y1="168" x2="336" y2="344" stroke="#fff" stroke-width="66" stroke-linecap="round" opacity=".88"/><rect x="143" y="135" width="66" height="242" rx="33" fill="#fff"/><rect x="303" y="135" width="66" height="242" rx="33" fill="#fff"/></svg>`;

let data = {}, view = 'main', sessionsOpen = false;

// "⌃⌥P" -> "Ctrl Opt P"
function keyText(s) {
  const NAMES = { '⌃': 'Ctrl', '⌥': 'Opt', '⇧': 'Shift', '⌘': 'Cmd' };
  const out = []; let rest = '';
  for (const ch of Array.from(String(s || ''))) {
    if (NAMES[ch]) { if (rest) { out.push(rest); rest = ''; } out.push(NAMES[ch]); } else rest += ch;
  }
  if (rest) out.push(rest);
  return out.join(' ');
}
function keycaps(s) {
  if (!s) return '';
  const parts = [], mods = '⌃⌥⇧⌘';
  let rest = '';
  for (const ch of Array.from(String(s))) {
    if (mods.includes(ch)) { if (rest) { parts.push(rest); rest = ''; } parts.push(ch); } else rest += ch;
  }
  if (rest) parts.push(rest);
  // Spelled out (Ctrl, Opt, Cmd, Shift): easier to read than the bare symbols.
  const NAMES = { '⌃': 'Ctrl', '⌥': 'Opt', '⇧': 'Shift', '⌘': 'Cmd' };
  return parts.map(p => `<kbd>${esc(NAMES[p] || p)}</kbd>`).join('');
}

const TONE = { ok: 'ok', warn: 'warn', bad: 'bad', down: 'bad' };
function overall() {
  const s = data.status;
  if (s && s.text) return { text: s.text, tone: TONE[s.tone] || 'ok' };
  if (data.health === 'down') return { text: 'Bağlantı Yok', tone: 'bad' };
  if (data.health === 'warn') return { text: 'Dikkat', tone: 'warn' };
  return { text: 'Her Şey Yolunda', tone: 'ok' };
}
const limTone = p => p >= 90 ? 'bad' : p >= 70 ? 'warn' : '';

// Section label with a one-line explanation under it and optional right-aligned info.
const sec = (label, desc, right) => `<div class="sec"><div class="sec-t"><b>${label}</b>${desc ? `<small>${desc}</small>` : ''}</div>${right ? `<span>${right}</span>` : ''}</div>`;
function renderMain() {
  const d = data, out = [];
  const errs = Array.isArray(d.errors) ? d.errors : [];
  if (errs.length) out.push(`<button class="banner" data-act="console">${ICONS.warn}<span>${errs.length} modül yüklenemedi</span></button>`);
  const st = overall();
  out.push(`<div class="head">${MARK}<div class="ht"><h1>Nimbstia</h1><small>Günlük Durum Paneli</small></div><span class="sp"></span><span class="pill ${st.tone}"><i></i>${esc(st.text)}</span><button class="ib dn flip" data-act="flip" type="button"></button><button class="ib dn" data-act="close" type="button" aria-label="Kapat" data-tip="Kapat · Esc"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button></div>`);

  // ---- row 1: VPN tile + Claude tile (Control Center style)
  const row1 = [];
  if (d.dev) {
    const dev = d.dev, tone = TONE[d.health] || '', v = d.vpn;
    // signal bars by latency: 3 under 60 ms, 2 under 150 ms, else 1; none while down
    const ms = typeof dev.ms === 'number' ? dev.ms : null;
    const bars = tone === 'ok' ? (ms == null ? 3 : ms < 60 ? 3 : ms < 150 ? 2 : 1) : 0;
    const sig = `<span class="sig">${[1, 2, 3].map(i => `<i class="${i <= bars ? 'on' : ''}" style="height:${3 + i * 3}px"></i>`).join('')}</span>`;
    const label = v && v.busy ? v.busy : tone === 'ok' ? 'Bağlı' : tone === 'warn' ? 'Yanıt Vermiyor' : tone === 'bad' ? 'Bağlı Değil' : 'Kontrol Ediliyor…';
    const power = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2v5.5"/><path d="M4.6 4.4a5 5 0 1 0 6.8 0"/></svg>';
    const action = !v ? '' : v.busy
      ? `<button class="cc-btn" type="button" disabled>${esc(v.busy)}</button>`
      : v.connected
        ? `<button class="cc-btn off" data-act="vpn" data-v="disconnect" type="button">${power}Bağlantıyı Kes</button>`
        : `<button class="cc-btn on" data-act="vpn" data-v="connect" type="button">${power}Bağlan</button>`;
    const tip = 'Yeniden Kontrol Et' + (dev.checkedAgo ? ' · ' + dev.checkedAgo : '');
    row1.push(`<section class="cc vpn ${tone}">
      <div class="cc-top"><span class="cc-kicker">Bağlantı</span><button class="ib sm" data-act="check" type="button" data-tip="${esc(tip)}" aria-label="Yeniden Kontrol Et">${ICONS.refresh}</button></div>
      <div class="vrow"><span class="vbadge">${ICONS.shield}</span><div class="vtx"><h2>${esc(dev.title || 'VPN Bağlantısı')}</h2>${dev.host ? `<div class="hostin">${esc(dev.host)}</div>` : ''}</div></div>
      <div class="vline"><span class="vstat"><i></i>${esc(label)}</span>${ms != null && tone === 'ok' ? `<span class="vlat">${sig}${ms} ms</span>` : ''}</div>
      ${action}</section>`);
  }
  if (d.claude) {
    const c = d.claude, lim = (Array.isArray(c.limits) ? c.limits : [])[0], sess = Array.isArray(c.sessions) ? c.sessions : [];
    const p = lim && typeof lim.percent === 'number' ? Math.max(0, Math.min(100, Math.round(lim.percent))) : null;
    const R = 30, C = 2 * Math.PI * R, dash = p == null ? 0 : C * p / 100;
    const tone = p == null ? '' : limTone(p);
    const [g1, g2] = tone === 'bad' ? ['#ff6b6b', '#e5484d'] : tone === 'warn' ? ['#fbbf24', '#d97706'] : ['#34d399', '#16a34a'];
    const ring = `<svg class="ring" viewBox="0 0 72 72"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g1}"/><stop offset="1" stop-color="${g2}"/></linearGradient></defs><circle cx="36" cy="36" r="${R}" class="trk"/><circle cx="36" cy="36" r="${R}" class="val" stroke="url(#rg)" stroke-dasharray="${dash} ${C}"/></svg>`;
    const busy = sess.filter(x => x.busy).length;
    row1.push(`<section class="cc claude">
      <div class="cc-top"><span class="cc-kicker">Claude${c.plan ? ' · ' + esc(c.plan) : ''}</span>${c.updatedAgo ? `<span class="cc-ago" data-tip="Son Güncelleme">${esc(c.updatedAgo)}</span>` : ''}</div>
      <div class="gauge">${ring}<div class="gv"><b>${p == null ? '–' : '%' + p}</b><span>${esc(lim ? lim.label.replace(' Limit', '') : 'Kullanım')}</span></div></div>
      ${lim && lim.resets ? `<div class="cc-sub">Sıfırlanma ${esc(lim.resets)}</div>` : ''}
      ${lim && typeof lim.today === 'number' ? `<div class="cc-today">Bugün +%${lim.today}</div>` : ''}
      ${sess.length ? `<button class="cc-link" data-act="sessions" type="button"><span class="sdots">${sess.slice(0, 5).map(x => `<i class="${x.busy ? 'b' : ''}"></i>`).join('')}</span>${sess.length} oturum${busy ? ' · ' + busy + ' aktif' : ''}<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 4 4-4 4"/></svg></button>` : ''}
      </section>`);
  }
  if (row1.length) out.push(`<div class="cc-row${row1.length === 1 ? ' one' : ''}">${row1.join('')}</div>`);

  // ---- row 2: tools
  const tools = Array.isArray(d.tools) ? d.tools : [];
  if (tools.length) {
    out.push(`<section class="cc tools"><div class="cc-kicker">Araçlar</div><div class="tw">` + tools.map(t =>
      `<button class="ti" data-act="tool" data-id="${esc(t.id)}" style="--k:${TOOL_COLOR[t.id] || '#5b6170'}" data-tip="${esc(t.name + ' · ' + keyText(t.keys))}" aria-label="${esc(t.name + ' · ' + t.what)}"><span class="ico">${ICONS[TOOL_ICON[t.id]] || ICONS.clip}</span><span class="nm">${esc(t.name)}</span><span class="wh">${esc(t.what)}</span><span class="kc"><kbd>${esc(keyText(t.keys))}</kbd></span></button>`).join('') + `</div></section>`);
  }

  // ---- row 3: round toggles
  const tg = d.toggles || {};
  const rt = (id, label, icon, color, states, keys) => `<button class="rt${tg[id] ? ' on' : ''}" role="switch" aria-checked="${tg[id] ? 'true' : 'false'}" data-act="toggle" data-id="${id}" style="--q:${color}"${keys ? ` data-tip="${esc(keyText(keys))}"` : ''}><span class="rc">${ICONS[icon]}</span><span class="rn">${label}</span><small>${(states || ['Açık', 'Kapalı'])[tg[id] ? 0 : 1]}</small></button>`;
  let q = `<section class="cc quick"><div class="cc-kicker">Hızlı Ayarlar</div><div class="rw">` +
    rt('awake', 'Uyanık', 'cup', '#d97706', null, '⌃⌥K') + rt('mic', 'Mikrofon', 'mic', '#e5484d', ['Sessiz', 'Açık'], '⌃⌥M') + rt('meetings', 'Toplantı', 'cal', '#7c3aed') + `</div>`;
  const meets = Array.isArray(d.meetings) ? d.meetings : [];
  if (tg.meetings && meets.length) {
    q += `<div class="meets">` + meets.slice(0, 3).map(m => {
      const inner = `<time>${esc(m.time)}</time><span>${esc(m.title)}</span>`;
      return m.url ? `<button class="mrow link" data-act="url" data-url="${esc(m.url)}">${inner}</button>` : `<div class="mrow">${inner}</div>`;
    }).join('') + `</div>`;
  }
  if (d.meetErr) q += `<div class="muted">${esc(d.meetErr)}</div>`;
  out.push(q + '</section>');

  // ---- row 4: system strip
  const sy = d.system || {};
  const chip = (id, icon, color, value, label, alert, tip, fill) => `<button class="sc${alert ? ' alert' : ''}" data-act="${id === 'mem' ? 'memory' : 'sys'}" data-id="${id}" type="button" style="--s:${color}" data-tip="${tip}"><span class="sh"><span class="si">${ICONS[icon]}</span><small>${label}</small></span><b>${value}</b>${typeof fill === 'number' ? `<span class="sbar"><i style="width:${Math.max(2, Math.min(100, fill))}%"></i></span>` : ''}</button>`;
  const chips = [];
  if (sy.battery) chips.push(chip('battery', 'bat', '#16a34a', '%' + sy.battery.pct, sy.battery.charging ? 'Pil · Şarjda' : 'Pil', sy.battery.pct < 20 && !sy.battery.charging, 'Pil Ayarları', sy.battery.pct));
  if (typeof sy.mem === 'number') chips.push(chip('mem', 'memo', '#2563ff', '%' + sy.mem, 'Bellek', sy.mem >= 85, 'Neyin ne kadar kullandığını gör', sy.mem));
  if (typeof sy.disk === 'number') chips.push(chip('disk', 'disk', '#7c3aed', (sy.disk >= 1000 ? (sy.disk / 1000).toFixed(1).replace('.', ',') + ' TB' : sy.disk + ' GB'), 'Boş Disk', sy.disk < 20 || sy.diskUsed >= 90, 'Depolama Ayarları', sy.diskUsed));
  if (chips.length) out.push(`<section class="cc sys"><div class="cc-kicker">Sistem</div><div class="sw4" style="--n:${chips.length}">${chips.join('')}</div></section>`);
  return out.join('');
}

let procs = null;
function renderMemory() {
  const fmt = mb => mb >= 1024 ? (mb / 1024).toFixed(1).replace('.', ',') + ' GB' : Math.round(mb) + ' MB';
  let body;
  if (!procs) body = '<div class="empty">Uygulamalar okunuyor…</div>';
  else if (!procs.list.length) body = '<div class="empty">Okunamadı.</div>';
  else {
    const max = procs.list[0].mb || 1;
    body = procs.list.map(p => `<div class="prc"><span class="pn">${esc(p.name)}</span><span class="pb"><i style="width:${Math.max(3, p.mb / max * 100)}%"></i></span><span class="pm">${fmt(p.mb)}</span>${p.cpu ? `<span class="pc2">%${p.cpu} CPU</span>` : '<span class="pc2"></span>'}</div>`).join('');
  }
  const total = procs && procs.memMB ? `<div class="msum">Toplam ${fmt(procs.totalMB)} / ${fmt(procs.memMB)}</div>` : '';
  return `<div class="vhead"><button class="ib" data-act="back" data-tip="Geri" aria-label="Geri">${ICONS.back}</button><h2>Bellek Kullanımı</h2></div>
    <section class="card" style="padding:8px 12px">${total}${body}</section>
    <button class="fb wide" data-act="sys" data-id="activity" type="button">${ICONS.memo}<span>Etkinlik İzleyicisi'nde Aç</span></button>`;
}

function renderSessions() {
  const sess = (data.claude && Array.isArray(data.claude.sessions)) ? data.claude.sessions.slice() : [];
  sess.sort((a, b) => (b.busy ? 1 : 0) - (a.busy ? 1 : 0));
  const busy = sess.filter(x => x.busy).length;
  const ext = '<svg class="go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2.5"/></svg>';
  const rows = sess.map(x => {
    const meta = [x.folder, x.ago].filter(Boolean).map(esc).join(' · ');
    const inner = `<span class="ss-dot${x.busy ? ' b' : ''}"></span><span class="ss-tx"><b>${esc(x.name)}</b>${meta ? `<small>${meta}</small>` : ''}</span><span class="ss-st${x.busy ? ' b' : ''}">${x.busy ? 'Çalışıyor' : 'Boşta'}</span>${x.url ? ext : ''}`;
    return x.url ? `<button class="ss" data-act="url" data-url="${esc(x.url)}" type="button" title="claude.ai'de aç">${inner}</button>` : `<div class="ss">${inner}</div>`;
  }).join('');

    <section class="card ss-list">${rows || '<div class="empty">Açık oturum yok.</div>'}</section>`;
}

function renderKeys() {
  const list = Array.isArray(data.shortcuts) ? data.shortcuts : [];
  return `<div class="vhead"><button class="ib" data-act="back" data-tip="Geri" aria-label="Geri">${ICONS.back}</button><h2>Kısayollar</h2></div>

}

function renderFoot() {

  return `<button class="fb" data-act="keys" type="button">${ICONS.keys}<span>Kısayollar</span></button>
    <button class="fb" data-act="console" type="button">${ICONS.term}<span>Konsol</span></button>
    <span class="sp"></span>
    <button class="fb" data-act="reload" type="button">${ICONS.reload}<span>Yeniden Yükle</span></button>`;
}

function applyTheme() {
  const t = data.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

// Theme switch in the header: sun while dark (click -> light), moon while light (click -> dark).
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : darkMQ.matches; };
function syncFlip() {
  const d = isDark(), tip = d ? 'Açık Tema' : 'Koyu Tema';
  document.querySelectorAll('.flip').forEach(b => { b.innerHTML = d ? ICONS.sun : ICONS.moon; b.dataset.tip = tip; b.setAttribute('aria-label', tip); });
}
new MutationObserver(syncFlip).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
darkMQ.addEventListener('change', syncFlip);

function render() {
  const top = scrollEl.scrollTop;
  scrollEl.innerHTML = view === 'keys' ? renderKeys() : view === 'sessions' ? renderSessions() : view === 'memory' ? renderMemory() : renderMain();
  footEl.innerHTML = renderFoot();
  syncFlip();
  scrollEl.scrollTop = top;
  postSize();
}
let lastH = 0;
function postSize() { const h = Math.ceil(app.offsetHeight) + 20; if (h !== lastH) { lastH = h; post({ action: 'size', h }); } }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'url': if (el.dataset.url) post({ action: 'url', url: el.dataset.url }); break;
    case 'vpn': post({ action: 'vpn', v: el.dataset.v }); break;
    case 'tool': post({ action: 'tool', id: el.dataset.id }); break;
    case 'toggle': post({ action: 'toggle', id: el.dataset.id }); break;
    case 'theme': post({ action: 'theme', v: el.dataset.v }); break;
    case 'flip': post({ action: 'toggleTheme' }); break;
    case 'close': post({ action: 'close' }); break;
    case 'more': sessionsOpen = !sessionsOpen; render(); break;
    case 'keys': view = 'keys'; scrollEl.scrollTop = 0; render(); break;
    case 'sessions': view = 'sessions'; scrollEl.scrollTop = 0; render(); break;
    case 'memory': view = 'memory'; procs = null; scrollEl.scrollTop = 0; render(); post({ action: 'procs' }); break;
    case 'sys': post({ action: 'sys', id: el.dataset.id }); break;
    case 'back': view = 'main'; render(); break;
    default: post({ action: a });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); if (view !== 'main') { view = 'main'; render(); } else post({ action: 'close' }); }
});

window.Pulse = {
  setProcs(p) { procs = p && Array.isArray(p.list) ? p : { list: [] }; if (view === 'memory') render(); },
  set(d) { data = d || {}; applyTheme(); render(); },
  open() { view = 'main'; render(); app.classList.remove('show'); void app.offsetWidth; requestAnimationFrame(() => app.classList.add('show')); try { app.focus({ preventScroll: true }); } catch (e) {} },
  close() { app.classList.remove('show'); },
};
window.Panel = window.Pulse;
render();
post({ action: 'ready' });
</script>
</body>
</html>
